<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自我紀錄講義! Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --paper: #E9E4D8;
  --paper-line: #d9d2bf;
  --card: #FCFAF5;
  --card-border: #DAD3C1;
  --ink: #2B2A26;
  --ink-soft: #6b6659;
  --ledger-green: #2F5D50;
  --ledger-green-soft: #E4ECE9;
  --brass: #B0812C;
  --brass-soft: #F3E6C8;
  --danger: #A03A2E;
  --radius: 6px;
  --shadow: 0 1px 2px rgba(43,42,38,0.06), 0 4px 10px rgba(43,42,38,0.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    repeating-linear-gradient(180deg, transparent, transparent 27px, var(--paper-line) 28px),
    var(--paper);
  color:var(--ink);
  font-family:'Inter', sans-serif;
  min-height:100vh;
  padding:28px 20px 60px;
}
::selection{ background: var(--brass-soft); }
:focus-visible{ outline:2px solid var(--ledger-green); outline-offset:2px; border-radius:3px; }
.hidden{ display:none !important; }

.wrap{ max-width:980px; margin:0 auto; }

header.top{
  display:flex; justify-content:space-between; align-items:flex-end;
  gap:16px; margin-bottom:24px; flex-wrap:wrap;
}
.title-block h1{
  font-family:'Fraunces', serif; font-weight:600; font-size:clamp(28px,4vw,38px);
  margin:0 0 4px; letter-spacing:-0.01em;
}
.title-block .stamp{
  font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink-soft);
  letter-spacing:0.04em; text-transform:uppercase;
}
.header-actions{ display:flex; align-items:center; gap:10px; }
.user-badge{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); }
.export-btn, .logout-btn{
  font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
  border:none; border-radius:var(--radius);
  padding:11px 18px; cursor:pointer; box-shadow:var(--shadow);
  display:inline-flex; align-items:center; gap:8px; transition:transform .12s ease, background .12s ease;
}
.export-btn{ background:var(--ledger-green); color:#fff; }
.export-btn:hover{ background:#264c41; transform:translateY(-1px); }
.logout-btn{ background:#fff; color:var(--danger); border:1px solid var(--card-border); }
.logout-btn:hover{ background:#f7f0ee; }
.export-btn svg{ width:15px; height:15px; }

/* ---------- 登入畫面 ---------- */
.auth-wrap{ max-width:380px; margin:8vh auto 0; }
.auth-card{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:32px 28px;
}
.auth-card h1{ font-family:'Fraunces',serif; font-size:26px; margin:0 0 4px; text-align:center; }
.auth-card .sub{ text-align:center; color:var(--ink-soft); font-size:13px; margin-bottom:22px; }
.auth-field{ display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
.auth-field label{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; }
.auth-field input{ font-family:'Inter',sans-serif; font-size:14px; padding:10px 12px; border:1px solid var(--card-border); border-radius:4px; background:#fff; }
.auth-submit{
  width:100%; background:var(--ledger-green); color:#fff; border:none; border-radius:4px;
  padding:11px; font-weight:600; font-size:14px; cursor:pointer; margin-top:4px;
}
.auth-submit:hover{ background:#264c41; }
.auth-submit:disabled{ opacity:0.6; cursor:default; }
.auth-toggle{ text-align:center; margin-top:16px; font-size:13px; color:var(--ink-soft); }
.auth-toggle button{ background:none; border:none; color:var(--ledger-green); font-weight:600; cursor:pointer; text-decoration:underline; padding:0; font-size:13px; }
.auth-msg{ font-size:13px; text-align:center; margin-top:12px; padding:8px; border-radius:4px; }
.auth-msg.error{ background:#f7e3e0; color:var(--danger); }
.auth-msg.success{ background:var(--ledger-green-soft); color:var(--ledger-green); }

/* ---------- 主應用程式 ---------- */
.overview{ margin-bottom:22px; }
.overview h2{ font-family:'Fraunces',serif; font-size:18px; font-weight:600; margin:0 0 10px; }
.overview-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
.overview-card{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:14px 16px; cursor:pointer; text-align:left;
  font-family:inherit; display:flex; flex-direction:column; gap:8px;
  border-left:4px solid var(--tab-color, var(--brass)); transition:transform .12s ease, box-shadow .12s ease;
}
.overview-card:hover{ transform:translateY(-1px); box-shadow:0 2px 4px rgba(43,42,38,0.08), 0 6px 14px rgba(43,42,38,0.08); }
.overview-card.active{ outline:2px solid var(--tab-color, var(--ledger-green)); outline-offset:1px; }
.overview-card .name{ font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.overview-card .num{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); }
.overview-card .num b{ color:var(--ink); font-size:14px; }
.overview-bar{ height:8px; background:#fff; border:1px solid var(--card-border); border-radius:4px; overflow:hidden; }
.overview-bar-fill{ height:100%; background:var(--tab-color, var(--brass)); transition:width .35s ease; }
.overview-card .no-target{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); }

.layout{ display:grid; grid-template-columns:220px 1fr; gap:20px; align-items:start; }
@media (max-width:720px){ .layout{ grid-template-columns:1fr; } }

.shelf{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:10px; display:flex; flex-direction:column; gap:6px;
}
.shelf h2{
  font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase;
  letter-spacing:0.08em; color:var(--ink-soft); margin:4px 6px 2px; font-weight:700;
}
.book-tab{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  background:transparent; border:none; border-left:4px solid var(--tab-color, var(--ledger-green));
  border-radius:3px; padding:9px 10px; cursor:pointer; font-family:'Inter',sans-serif;
  font-size:14px; color:var(--ink); transition:background .12s ease;
}
.book-tab .name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.book-tab .pct{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); }
.book-tab:hover{ background:var(--ledger-green-soft); }
.book-tab.active{ background:var(--ledger-green-soft); font-weight:600; }

.add-book{ border-top:1px dashed var(--card-border); margin-top:4px; padding-top:8px; }
.add-book input{
  width:100%; font-family:'Inter',sans-serif; font-size:13px; padding:7px 8px;
  border:1px solid var(--card-border); border-radius:4px; margin-bottom:6px; background:#fff;
}
.add-book .row{ display:flex; gap:6px; }
.add-book .row input.pages{ width:70px; }
.add-book button{
  font-family:'Inter',sans-serif; font-size:13px; font-weight:600; width:100%;
  background:#fff; border:1px solid var(--ledger-green); color:var(--ledger-green);
  border-radius:4px; padding:7px; cursor:pointer;
}
.add-book button:hover{ background:var(--ledger-green-soft); }

.panel{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:22px 24px;
}
.panel-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:6px;}
.panel-head h2{ font-family:'Fraunces',serif; font-size:22px; font-weight:600; margin:0; }
.panel-head .target-edit{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft); }
.panel-head .target-edit input{
  width:70px; font-family:'JetBrains Mono',monospace; font-size:13px; padding:4px 6px;
  border:1px solid var(--card-border); border-radius:4px; text-align:right;
}
.delete-book{ background:none; border:none; color:var(--danger); font-size:12px; cursor:pointer; text-decoration:underline; padding:0; }

.ruler{ margin:22px 0 26px; }
.ruler .stats{ display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink-soft); margin-bottom:10px; }
.ruler .stats b{ color:var(--ink); font-size:15px; }
.page-grid{
  display:flex; height:22px; border:1px solid var(--card-border); border-radius:3px;
  overflow:hidden; background:#fff;
}
.page-cell{ flex:1; border-right:1px solid var(--paper-line); transition:background .15s ease; }
.page-cell:last-child{ border-right:none; }
.page-cell.filled{ background:var(--cell-color, var(--brass)); border-right-color:var(--cell-color, var(--brass)); }
.page-grid.compact{ height:8px; border-radius:4px; }
.page-grid.compact .page-cell{ border-right:none; }
.page-grid-empty{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); }


.entry-form{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; padding:16px; background:var(--ledger-green-soft); border-radius:var(--radius); margin-bottom:20px; }
.entry-form .field{ display:flex; flex-direction:column; gap:4px; }
.entry-form label{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; }
.entry-form input{ font-family:'Inter',sans-serif; font-size:14px; padding:8px 10px; border:1px solid var(--card-border); border-radius:4px; background:#fff; }
.entry-form input[type=number]{ width:90px; }
.entry-form input[type=text]{ width:180px; }
.entry-form input#entryPages{ width:130px; }
.page-range{ display:flex; align-items:center; gap:6px; }
.page-range input{ width:70px !important; }
.page-range .tilde{ color:var(--ink-soft); font-family:'JetBrains Mono',monospace; }
.field-hint{ font-size:11px; color:var(--ink-soft); max-width:160px; line-height:1.3; }
.entry-form .submit{
  background:var(--ledger-green); color:#fff; border:none; border-radius:4px; padding:9px 18px;
  font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; font-size:14px; height:38px;
}
.entry-form .submit:hover{ background:#264c41; }

table.ledger{ width:100%; border-collapse:collapse; font-size:14px; }
table.ledger th{ text-align:left; font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); border-bottom:1px solid var(--card-border); padding:6px 8px; font-weight:700; }
table.ledger td{ padding:8px; border-bottom:1px solid var(--paper-line); font-family:'JetBrains Mono',monospace; }
table.ledger td.note{ font-family:'Inter',sans-serif; color:var(--ink-soft); }
table.ledger tr:hover td{ background:#faf7ee; }
table.ledger .del{ background:none; border:none; color:var(--danger); cursor:pointer; font-size:12px; }

.empty{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
.empty h2{ font-family:'Fraunces',serif; font-size:20px; color:var(--ink); margin-bottom:6px; }

.loading{ text-align:center; padding:60px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; font-size:13px; }

/* ---------- 修改密碼彈窗 ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(43,42,38,0.45); display:flex;
  align-items:center; justify-content:center; padding:20px; z-index:50;
}
.modal-card{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:26px 26px; width:100%; max-width:360px;
}
.modal-card h2{ font-family:'Fraunces',serif; font-size:20px; margin:0 0 16px; }
.modal-card .auth-field{ margin-bottom:12px; }
.modal-actions{ display:flex; gap:8px; margin-top:6px; }
.modal-actions button{ flex:1; border-radius:4px; padding:10px; font-weight:600; font-size:14px; cursor:pointer; font-family:'Inter',sans-serif; }
.modal-actions .cancel-btn{ background:#fff; border:1px solid var(--card-border); color:var(--ink); }
.modal-actions .cancel-btn:hover{ background:var(--ledger-green-soft); }
.modal-actions .confirm-btn{ background:var(--ledger-green); border:none; color:#fff; }
.modal-actions .confirm-btn:hover{ background:#264c41; }
.modal-actions .confirm-btn:disabled{ opacity:0.6; cursor:default; }
.change-pw-btn{ background:#fff; color:var(--ink); border:1px solid var(--card-border); }
.change-pw-btn:hover{ background:var(--ledger-green-soft); }
</style>
</head>
<body>

<!-- 登入 / 註冊畫面 -->
<div id="authView" class="auth-wrap">
  <div class="auth-card">
    <h1 id="authTitle">登入</h1>
    <div class="sub">自我紀錄.讓寫好的講義躍然"網"上</div>
    <form id="authForm">
      <div class="auth-field">
        <label>Email</label>
        <input type="email" id="authEmail" required autocomplete="email">
      </div>
      <div class="auth-field">
        <label>密碼</label>
        <input type="password" id="authPassword" required autocomplete="current-password" minlength="6">
      </div>
      <button type="submit" class="auth-submit" id="authSubmitBtn">登入</button>
    </form>
    <div class="auth-toggle">
      <span id="authToggleText">還沒有帳號？</span>
      <button id="authToggleBtn">註冊一個</button>
    </div>
    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>

<!-- 主應用程式畫面 -->
<div id="mainView" class="wrap hidden">
  <header class="top">
    <div class="title-block">
      <h1>自我講義複習紀錄!</h1>
      <div class="stamp" id="todayStamp"></div>
    </div>
    <div class="header-actions">
      <span class="user-badge" id="userBadge"></span>
      <button class="logout-btn change-pw-btn" id="changePwBtn">修改密碼</button>
      <button class="export-btn" id="exportBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>
        匯出 Excel
      </button>
      <button class="logout-btn" id="logoutBtn">登出</button>
    </div>
  </header>

  <div id="appPanel"><div class="loading">讀取資料中…</div></div>
</div>

<!-- 修改密碼彈窗 -->
<div id="changePwOverlay" class="modal-overlay hidden">
  <div class="modal-card">
    <h2>修改密碼</h2>
    <form id="changePwForm">
      <div class="auth-field">
        <label>目前密碼</label>
        <input type="password" id="oldPassword" required autocomplete="current-password">
      </div>
      <div class="auth-field">
        <label>新密碼</label>
        <input type="password" id="newPassword" required minlength="6" autocomplete="new-password">
      </div>
      <div class="auth-field">
        <label>確認新密碼</label>
        <input type="password" id="newPasswordConfirm" required minlength="6" autocomplete="new-password">
      </div>
      <div class="auth-msg" id="changePwMsg"></div>
      <div class="modal-actions">
        <button type="button" class="cancel-btn" id="cancelPwBtn">取消</button>
        <button type="submit" class="confirm-btn" id="confirmPwBtn">確認修改</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* ============================================================
   請把下面兩個值換成你自己 Supabase 專案的資訊
   Supabase 專案後台 → Project Settings → API 可以找到：
     Project URL         → SUPABASE_URL
     anon public API key → SUPABASE_ANON_KEY
   這個 anon key 設計上就是可以公開放在前端程式碼裡的，不是機密金鑰，
   可以放心把這整個檔案推上 GitHub。
   ============================================================ */
const SUPABASE_URL = "https://vpvtgksmxgbvzwummoqs.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_a0-qYVHS78mHYxBPsFo7sg_n3X5xiAj";
const CONFIG_OK = SUPABASE_URL.startsWith('http') && !SUPABASE_ANON_KEY.includes('YOUR_');

// 尚未填入正確設定時，用一個假的網址建立 client，避免整頁直接噴錯崩潰。
// 實際的登入/資料操作在呼叫前都會先檢查 CONFIG_OK 並顯示提示訊息。
const supabase = createClient(
  CONFIG_OK ? SUPABASE_URL : 'https://placeholder.supabase.co',
  CONFIG_OK ? SUPABASE_ANON_KEY : 'placeholder-anon-key'
);

const PALETTE = ['#2F5D50','#B0812C','#7A4A6B','#3A6B8A','#8A4A3A','#4A6B3A'];

let currentUser = null;
let books = [];              // [{id,name,target}]
let entriesByBook = {};      // { bookId: [{id,date,pages,note}] }
let activeBookId = null;
let isSignUpMode = false;

function todayStr(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatStamp(){
  const d = new Date();
  const w = ['日','一','二','三','四','五','六'][d.getDay()];
  const el = document.getElementById('todayStamp');
  if(el) el.textContent = `今天 ${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}（週${w}）`;
}

/* ---------------- Auth ---------------- */

function checkConfig(){
  if(SUPABASE_URL.includes('YOUR_') || SUPABASE_ANON_KEY.includes('YOUR_')){
    setAuthMsg('⚠️ 尚未設定檔案開頭的 SUPABASE_URL 與 SUPABASE_ANON_KEY，請參考 README.md。', 'error');
    return false;
  }
  return true;
}

function setAuthMsg(text, type){
  const el = document.getElementById('authMsg');
  el.textContent = text || '';
  el.className = 'auth-msg' + (type ? ' ' + type : '');
}

async function handleAuthSubmit(e){
  e.preventDefault();
  if(!checkConfig()) return;
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const btn = document.getElementById('authSubmitBtn');
  btn.disabled = true;
  setAuthMsg('');

  if(isSignUpMode){
    const { error } = await supabase.auth.signUp({ email, password });
    if(error){ setAuthMsg(error.message, 'error'); }
    else{ setAuthMsg('註冊成功！請檢查信箱完成驗證後再登入（若專案關閉了信箱驗證，可直接登入）。', 'success'); }
  }else{
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if(error){ setAuthMsg(error.message, 'error'); }
  }
  btn.disabled = false;
}

function toggleAuthMode(){
  isSignUpMode = !isSignUpMode;
  document.getElementById('authTitle').textContent = isSignUpMode ? '建立帳號' : '登入';
  document.getElementById('authSubmitBtn').textContent = isSignUpMode ? '註冊' : '登入';
  document.getElementById('authToggleText').textContent = isSignUpMode ? '已經有帳號了？' : '還沒有帳號？';
  document.getElementById('authToggleBtn').textContent = isSignUpMode ? '登入' : '註冊一個';
  setAuthMsg('');
}

async function handleLogout(){
  await supabase.auth.signOut();
}

/* ---------------- Change password ---------------- */

function openChangePwModal(){
  document.getElementById('oldPassword').value = '';
  document.getElementById('newPassword').value = '';
  document.getElementById('newPasswordConfirm').value = '';
  setChangePwMsg('');
  document.getElementById('changePwOverlay').classList.remove('hidden');
  document.getElementById('oldPassword').focus();
}
function closeChangePwModal(){
  document.getElementById('changePwOverlay').classList.add('hidden');
}
function setChangePwMsg(text, type){
  const el = document.getElementById('changePwMsg');
  el.textContent = text || '';
  el.className = 'auth-msg' + (type ? ' ' + type : '');
}

async function handleChangePwSubmit(e){
  e.preventDefault();
  const oldPassword = document.getElementById('oldPassword').value;
  const newPassword = document.getElementById('newPassword').value;
  const newPasswordConfirm = document.getElementById('newPasswordConfirm').value;
  const btn = document.getElementById('confirmPwBtn');

  if(newPassword !== newPasswordConfirm){
    setChangePwMsg('兩次輸入的新密碼不一致。', 'error');
    return;
  }
  if(newPassword === oldPassword){
    setChangePwMsg('新密碼不能跟目前密碼一樣。', 'error');
    return;
  }

  btn.disabled = true;
  setChangePwMsg('確認中…');

  // 先用「目前密碼」重新登入一次，確認使用者真的知道原密碼
  const { error: verifyError } = await supabase.auth.signInWithPassword({
    email: currentUser.email,
    password: oldPassword
  });
  if(verifyError){
    setChangePwMsg('目前密碼不正確，請再確認一次。', 'error');
    btn.disabled = false;
    return;
  }

  // 驗證通過，才真的更新成新密碼
  const { error: updateError } = await supabase.auth.updateUser({ password: newPassword });
  btn.disabled = false;
  if(updateError){
    setChangePwMsg('修改失敗：' + updateError.message, 'error');
    return;
  }

  setChangePwMsg('密碼修改成功！', 'success');
  setTimeout(closeChangePwModal, 1200);
}

/* ---------------- Data loading ---------------- */

async function loadAllData(){
  const { data: bookRows, error: bErr } = await supabase
    .from('books').select('*').order('created_at', { ascending: true });
  if(bErr){ console.error(bErr); books = []; } else { books = bookRows; }

  entriesByBook = {};
  if(books.length){
    const { data: entryRows, error: eErr } = await supabase
      .from('entries').select('*').order('date', { ascending: true });
    if(eErr){ console.error(eErr); }
    else{
      entryRows.forEach(r=>{
        if(!entriesByBook[r.book_id]) entriesByBook[r.book_id] = [];
        entriesByBook[r.book_id].push(r);
      });
    }
  }
}

function cumulativeFor(bookId){
  const list = (entriesByBook[bookId]||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  let sum = 0;
  return list.map(e=>{ sum += Number(e.pages)||0; return {...e, cum:sum}; });
}
function totalFor(bookId){
  return (entriesByBook[bookId]||[]).reduce((s,e)=>s+(Number(e.pages)||0),0);
}

// 從「起始頁」「結束頁」兩個欄位算出實際寫了幾頁
// 只填起始頁 = 1 頁；起訖都填 = 終-起+1 頁（自動處理順序顛倒）
function parsePageRange(startRaw, endRaw){
  const startStr = String(startRaw||'').trim();
  const endStr = String(endRaw||'').trim();
  if(startStr === '') return null;
  const startNum = Number(startStr);
  if(!Number.isFinite(startNum) || startNum <= 0) return null;

  if(endStr === ''){
    return { pages: 1, rangeLabel: `第${startNum}頁`, start: startNum, end: startNum };
  }
  const endNum = Number(endStr);
  if(!Number.isFinite(endNum) || endNum <= 0) return null;
  const start = Math.min(startNum, endNum), end = Math.max(startNum, endNum);
  return { pages: end - start + 1, rangeLabel: `第${start}~${end}頁`, start, end };
}

// 把某本書「目前所有紀錄」的頁碼區間合併成互不重疊、由小到大排序的區間陣列
// excludeEntryId：如果是在編輯某一筆舊紀錄，記得排除自己，不然會跟自己重疊
function mergedRangesFor(bookId, excludeEntryId){
  const ranges = (entriesByBook[bookId]||[])
    .filter(e => e.id !== excludeEntryId && Number.isFinite(e.page_start) && Number.isFinite(e.page_end))
    .map(e => [e.page_start, e.page_end])
    .sort((a,b)=>a[0]-b[0]);
  const merged = [];
  for(const [s,e] of ranges){
    const last = merged[merged.length-1];
    if(last && s <= last[1] + 1){ last[1] = Math.max(last[1], e); }
    else{ merged.push([s,e]); }
  }
  return merged;
}

// 用「已經寫過的區間」去扣掉這次新輸入的 start~end，算出真正「新寫的頁數」跟「重疊掉的頁數」
function subtractWrittenRanges(start, end, mergedRanges){
  let segments = [[start,end]];
  for(const [rs,re] of mergedRanges){
    const next = [];
    for(const [s,e] of segments){
      if(re < s || rs > e){ next.push([s,e]); continue; } // 完全沒重疊
      if(s < rs) next.push([s, rs-1]);
      if(e > re) next.push([re+1, e]);
    }
    segments = next;
  }
  const totalPages = end - start + 1;
  const newPages = segments.reduce((sum,[s,e])=>sum + (e-s+1), 0);
  return { newPages, overlappedPages: totalPages - newPages, totalPages };
}

// 產生「逐頁長條圖」：目標頁數是幾頁就畫幾格、排成一整條，只有寫過的頁碼格子會被填色（顏色跟該科目一致）
function pageGridHTML(bookId, target, color, extraClass){
  const merged = mergedRangesFor(bookId);
  const isWritten = (p) => merged.some(([s,e]) => p>=s && p<=e);

  const cellCount = target>0 ? target : (merged.length ? merged[merged.length-1][1] : 0);
  if(cellCount <= 0){
    return `<div class="page-grid-empty">還沒有可顯示的頁碼，記錄後會自動畫出進度條。</div>`;
  }
  const cells = Array.from({length:cellCount}).map((_,i)=>{
    const p = i+1;
    return `<span class="page-cell ${isWritten(p)?'filled':''}" title="第${p}頁"></span>`;
  }).join('');
  return `<div class="page-grid ${extraClass||''}" style="--cell-color:${color}">${cells}</div>`;
}

/* ---------------- Rendering ---------------- */

function render(){
  const app = document.getElementById('appPanel');

  if(books.length === 0){
    app.innerHTML = `
      <div class="layout">
        <aside class="shelf">
          <h2>書目 / 科目</h2>
          <div class="add-book">${addBookFormHTML()}</div>
        </aside>
        <div class="panel">
          <div class="empty">
            <h2>還沒有任何一本書</h2>
            <p>從左側新增你正在寫的參考書或科目，開始記錄每天寫的頁數。</p>
          </div>
        </div>
      </div>`;
    bindAddBook();
    return;
  }

  if(!activeBookId || !books.find(b=>b.id===activeBookId)){
    activeBookId = books[0].id;
  }
  const active = books.find(b=>b.id===activeBookId);
  const activeColor = PALETTE[books.findIndex(b=>b.id===active.id) % PALETTE.length];
  const total = totalFor(active.id);
  const target = Number(active.target)||0;
  const pctExact = target>0 ? Math.min(100, (total/target)*100) : 0;
  const pct = Math.round(pctExact);
  const rows = cumulativeFor(active.id).slice().reverse();

  app.innerHTML = `
    <div class="overview">
      <h2>進度總覽</h2>
      <div class="overview-grid">
        ${books.map((b,i)=>{
          const t = totalFor(b.id); const tg = Number(b.target)||0;
          const pExact = tg>0 ? Math.min(100, (t/tg)*100) : 0;
          const p = Math.round(pExact);
          const color = PALETTE[i % PALETTE.length];
          return `<button class="overview-card ${b.id===active.id?'active':''}" style="--tab-color:${color}" data-id="${b.id}">
            <span class="name">${escapeHtml(b.name)}</span>
            ${tg>0 ? `
              <span class="num">已寫 <b>${t}</b> / ${tg} 頁</span>
              ${pageGridHTML(b.id, tg, color, 'compact')}
              <span class="num">完成 <b>${p}%</b></span>
            ` : `<span class="no-target">已寫 ${t} 頁・尚未設目標</span>`}
          </button>`;
        }).join('')}
      </div>
    </div>
    <div class="layout">
      <aside class="shelf">
        <h2>書目 / 科目</h2>
        ${books.map((b,i)=>{
          const t = totalFor(b.id); const tg = Number(b.target)||0;
          const p = tg>0 ? Math.min(100, Math.round((t/tg)*100)) : 0;
          const color = PALETTE[i % PALETTE.length];
          return `<button class="book-tab ${b.id===active.id?'active':''}" style="--tab-color:${color}" data-id="${b.id}">
            <span class="name">${escapeHtml(b.name)}</span>
            <span class="pct">${tg>0 ? p+'%' : t+'頁'}</span>
          </button>`;
        }).join('')}
        <div class="add-book">${addBookFormHTML()}</div>
      </aside>

      <div class="panel">
        <div class="panel-head">
          <h2>${escapeHtml(active.name)}</h2>
          <div class="target-edit">
            目標頁數
            <input type="number" min="0" id="targetInput" value="${target||''}" placeholder="未設定">
            <button class="delete-book" id="delBookBtn">刪除此書</button>
          </div>
        </div>

        <div class="ruler">
          <div class="stats">
            <span>已寫 <b>${total}</b> 頁</span>
            <span>${target>0 ? `目標 <b>${target}</b> 頁・完成 <b>${pct}%</b>` : '尚未設定目標頁數'}</span>
          </div>
          ${pageGridHTML(active.id, target, activeColor)}
        </div>

        <form class="entry-form" id="entryForm">
          <div class="field">
            <label>日期</label>
            <input type="date" id="entryDate" value="${todayStr()}" required>
          </div>
          <div class="field">
            <label>今天寫了第幾頁</label>
            <div class="page-range">
              <input type="number" min="1" id="entryPageStart" placeholder="從">
              <span class="tilde">~</span>
              <input type="number" min="1" id="entryPageEnd" placeholder="到（選填）">
            </div>
            <div class="field-hint">只填「從」＝寫1頁；兩個都填會自動算頁數</div>
          </div>
          <div class="field">
            <label>備註（選填）</label>
            <input type="text" id="entryNote" placeholder="例如：第三章草稿">
          </div>
          <button type="submit" class="submit">記錄</button>
        </form>

        ${rows.length===0 ? `<div class="empty"><p>還沒有紀錄，開始寫下今天的頁數吧。</p></div>` : `
        <table class="ledger">
          <thead><tr><th>日期</th><th>當日頁數</th><th>累計頁數</th><th>備註</th><th></th></tr></thead>
          <tbody>
            ${rows.map(r=>`
              <tr>
                <td>${r.date}</td>
                <td>${r.pages}</td>
                <td>${r.cum}</td>
                <td class="note">${escapeHtml(r.note||'')}</td>
                <td><button class="del" data-entry="${r.id}">刪除</button></td>
              </tr>`).join('')}
          </tbody>
        </table>`}
      </div>
    </div>
  `;

  bindAddBook();
  document.querySelectorAll('.book-tab').forEach(el=>{
    el.addEventListener('click', ()=>{ activeBookId = el.dataset.id; render(); });
  });
  document.querySelectorAll('.overview-card').forEach(el=>{
    el.addEventListener('click', ()=>{ activeBookId = el.dataset.id; render(); });
  });
  document.getElementById('targetInput').addEventListener('change', async (e)=>{
    const val = e.target.value === '' ? null : Number(e.target.value);
    const { error } = await supabase.from('books').update({ target: val }).eq('id', active.id);
    if(error){ alert('更新失敗：' + error.message); return; }
    active.target = val;
    render();
  });
  document.getElementById('delBookBtn').addEventListener('click', async ()=>{
    if(!confirm(`確定要刪除「${active.name}」以及它的所有紀錄嗎？此動作無法復原。`)) return;
    const { error } = await supabase.from('books').delete().eq('id', active.id);
    if(error){ alert('刪除失敗：' + error.message); return; }
    books = books.filter(b=>b.id!==active.id);
    delete entriesByBook[active.id];
    activeBookId = books[0]?.id || null;
    render();
  });
document.getElementById('entryForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const date = document.getElementById('entryDate').value;
    const pageStart = document.getElementById('entryPageStart').value;
    const pageEnd = document.getElementById('entryPageEnd').value;
    if(!date) return;
    const parsed = parsePageRange(pageStart, pageEnd);
    if(!parsed || parsed.pages <= 0){
      alert('頁數欄位看不懂，請至少填「從」，例如從15到20');
      return;
    }

    // 檢查這個範圍裡有沒有頁數是「之前已經寫過」的，已經寫過的不重複計算
    const merged = mergedRangesFor(active.id);
    const { newPages, overlappedPages } = subtractWrittenRanges(parsed.start, parsed.end, merged);
    if(newPages <= 0){
      alert(`${parsed.rangeLabel}都已經寫過了，這次不會重複計算頁數，所以沒有新增紀錄。`);
      return;
    }

    let label = parsed.rangeLabel;
    if(overlappedPages > 0){
      label += `（其中${overlappedPages}頁已寫過，只算${newPages}頁新進度）`;
    }
    let note = document.getElementById('entryNote').value.trim();
    note = note ? `${label}・${note}` : label;

    const { data, error } = await supabase.from('entries')
      .insert({ book_id: active.id, user_id: currentUser.id, date, pages: newPages, page_start: parsed.start, page_end: parsed.end, note })
      .select().single();
    if(error){ alert('新增失敗：' + error.message); return; }
    if(!entriesByBook[active.id]) entriesByBook[active.id] = [];
    entriesByBook[active.id].push(data);
    render();
  });
  document.querySelectorAll('.del').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const entryId = el.dataset.entry;
      const { error } = await supabase.from('entries').delete().eq('id', entryId);
      if(error){ alert('刪除失敗：' + error.message); return; }
      entriesByBook[active.id] = entriesByBook[active.id].filter(e=>e.id!==entryId);
      render();
    });
  });
}

function addBookFormHTML(){
  return `
    <input type="text" id="newBookName" placeholder="書名／科目名稱">
    <div class="row">
      <input type="number" min="0" class="pages" id="newBookTarget" placeholder="目標頁數">
      <button id="addBookBtn" style="flex:1">新增</button>
    </div>`;
}
function bindAddBook(){
  document.getElementById('addBookBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('newBookName').value.trim();
    if(!name) return;
    const targetVal = document.getElementById('newBookTarget').value;
    const target = targetVal ? Number(targetVal) : null;
    const { data, error } = await supabase.from('books')
      .insert({ name, target, user_id: currentUser.id })
      .select().single();
    if(error){ alert('新增失敗：' + error.message); return; }
    books.push(data);
    entriesByBook[data.id] = [];
    activeBookId = data.id;
    render();
  });
}

/* ---------------- Export ---------------- */

function exportExcel(){
  if(!books.length){ alert('目前還沒有任何資料可以匯出。'); return; }
  const wb = XLSX.utils.book_new();

  const summary = books.map(b=>{
    const total = totalFor(b.id);
    const target = Number(b.target)||0;
    return {
      '書名/科目': b.name,
      '已完成頁數': total,
      '目標頁數': target || '',
      '完成率': target ? Math.round((total/target)*100)+'%' : ''
    };
  });
  const wsSummary = XLSX.utils.json_to_sheet(summary);
  XLSX.utils.book_append_sheet(wb, wsSummary, '總覽');

  books.forEach(b=>{
    const rows = cumulativeFor(b.id).map(r=>({
      '日期': r.date, '當日頁數': r.pages, '累計頁數': r.cum, '備註': r.note||''
    }));
    const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{'日期':'','當日頁數':'','累計頁數':'','備註':''}]);
    let sheetName = b.name.replace(/[\\/?*\[\]:]/g,'').slice(0,31) || '未命名';
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });

  const stamp = todayStr().replace(/-/g,'');
  XLSX.writeFile(wb, `寫書進度_${stamp}.xlsx`);
}

/* ---------------- View switching ---------------- */

function showAuthView(){
  document.getElementById('authView').classList.remove('hidden');
  document.getElementById('mainView').classList.add('hidden');
}
async function showMainView(){
  document.getElementById('authView').classList.add('hidden');
  document.getElementById('mainView').classList.remove('hidden');
  document.getElementById('userBadge').textContent = currentUser.email;
  document.getElementById('appPanel').innerHTML = '<div class="loading">讀取資料中…</div>';
  await loadAllData();
  render();
}

/* ---------------- Init ---------------- */

async function init(){
  formatStamp();
  checkConfig();

  document.getElementById('authForm').addEventListener('submit', handleAuthSubmit);
  document.getElementById('authToggleBtn').addEventListener('click', toggleAuthMode);
  document.getElementById('logoutBtn').addEventListener('click', handleLogout);
  document.getElementById('exportBtn').addEventListener('click', exportExcel);
  document.getElementById('changePwBtn').addEventListener('click', openChangePwModal);
  document.getElementById('cancelPwBtn').addEventListener('click', closeChangePwModal);
  document.getElementById('changePwForm').addEventListener('submit', handleChangePwSubmit);
  document.getElementById('changePwOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'changePwOverlay') closeChangePwModal();
  });

  const { data: { session } } = await supabase.auth.getSession();
  if(session){ currentUser = session.user; await showMainView(); }
  else{ showAuthView(); }

  supabase.auth.onAuthStateChange(async (event, session) => {
    if(session){
      currentUser = session.user;
      await showMainView();
    }else{
      currentUser = null;
      books = []; entriesByBook = {}; activeBookId = null;
      showAuthView();
    }
  });
}

init();
</script>
