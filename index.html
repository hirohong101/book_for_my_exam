// 單字加入日期：統一顯示成 YYYYMMDD（以本機時區的「放入單字本那天」為準）。
// 如果這個單字沒有日期資料，一律顯示 20261018。
const VOCAB_DEFAULT_DATE = '20261018';
function formatVocabDate(iso){
  if(!iso) return VOCAB_DEFAULT_DATE;
  const d = new Date(iso);
  if(isNaN(d.getTime())) return VOCAB_DEFAULT_DATE;
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
}

// 單字加入時間（毫秒）；沒有日期資料的單字視為 2026/10/18
function vocabDateTs(v){
  const t = v && v.created_at ? new Date(v.created_at).getTime() : NaN;
  return isNaN(t) ? new Date(2026, 9, 18).getTime() : t;
}

function vocabReviewKey(){
  return `vocabReview:${currentUser ? currentUser.id : 'guest'}`;
}
function loadVocabReviewState(){
  try{ vocabReviewState = JSON.parse(localStorage.getItem(vocabReviewKey()) || '{}') || {}; }
  catch{ vocabReviewState = {}; }
}
function saveVocabReviewState(){
  try{ localStorage.setItem(vocabReviewKey(), JSON.stringify(vocabReviewState)); }
  catch(err){ console.error('儲存複習進度失敗', err); }
}
function getVocabReview(v){
  // 優先使用雲端（資料表欄位 review_stage / last_reviewed），沒有再用本機備份
  if(v.last_reviewed){
    return { stage: Math.min(REVIEW_MAX_STAGE, Math.max(0, Number(v.review_stage)||0)), last: v.last_reviewed, reviewed: true };
  }
  if(!vocabReviewState) loadVocabReviewState();
  const s = vocabReviewState[v.id];
  if(s) return { stage: Math.min(REVIEW_MAX_STAGE, Math.max(0, Number(s.stage)||0)), last: s.last, reviewed: true };
  // 還沒複習過：從「加入單字本」那天開始算起
  return { stage: 0, last: new Date(vocabDateTs(v)).toISOString(), reviewed: false };
}

// 依遺忘曲線算出單字目前的記憶保留率與狀態
function vocabRetentionInfo(v){
  const r = getVocabReview(v);
  const interval = REVIEW_INTERVALS[r.stage];
  const lastTs = new Date(r.last).getTime();
  const elapsed = Math.max(0, (Date.now() - (isNaN(lastTs) ? Date.now() : lastTs)) / 86400000);
  const S = interval / -Math.log(0.9);
  const ret = Math.exp(-elapsed / S);
  const bucket = REVIEW_BUCKETS.find(b=>ret < b.max) || REVIEW_BUCKETS[REVIEW_BUCKETS.length-1];
  return { stage: r.stage, reviewed: r.reviewed, ret, pct: Math.round(ret * 100), bucket, due: ret < 0.9, daysToDue: interval - elapsed };
}

function vocabDueCount(){
  return vocab.filter(v=>vocabRetentionInfo(v).due).length;
}

// 遊戲出題：開啟「依遺忘曲線出題」時，優先挑記憶保留率最低的字；否則隨機
function pickVocabForQuiz(pool, n){
  if(vocabQuizSmart){
    const sorted = pool.slice().sort((a,b)=> vocabRetentionInfo(a).ret - vocabRetentionInfo(b).ret);
    return shuffleArr(sorted.slice(0, n));
  }
  return shuffleArr(pool).slice(0, n);
}

function vocabCompare(sortId){
  const [key, dir] = sortId.split('-');
  const sign = dir === 'desc' ? -1 : 1;
  return (a,b)=>{
    let d = 0;
    if(key === 'date') d = vocabDateTs(a) - vocabDateTs(b);
    else if(key === 'review') d = vocabRetentionInfo(a).ret - vocabRetentionInfo(b).ret;
    else if(key === 'level') d = CEFR_LEVELS.indexOf(a.cefr) - CEFR_LEVELS.indexOf(b.cefr);
    else d = String(a.word).localeCompare(String(b.word));
    return (d * sign) || String(a.word).localeCompare(String(b.word));
  };
}

function vocabGroupKey(v, mode){
  if(mode === 'date') return formatVocabDate(v.created_at);
  if(mode === 'review') return vocabRetentionInfo(v).bucket.id;
  if(mode === 'level') return v.cefr || '—';
  return 'all';
}
function vocabGroupLabel(mode, key){
  if(mode === 'date') return `📅 ${key}${key === formatVocabDate(new Date().toISOString()) ? '（今天）' : ''}`;
  if(mode === 'review'){
    const b = REVIEW_BUCKETS.find(x=>x.id===key);
    return b ? `${b.label}` : key;
  }
  if(mode === 'level') return `難度 ${key}`;
  return '';
}

// 把單字清單依「排序＋分組」整理成 [{key,label,color,items}]
function vocabGroupedList(list){
  const sorted = list.slice().sort(vocabCompare(vocabSortId));
  if(vocabGroupBy === 'none') return [{ key:'all', label:null, items:sorted }];
  const map = new Map();
  sorted.forEach(v=>{
    const k = vocabGroupKey(v, vocabGroupBy);
    if(!map.has(k)) map.set(k, []);
    map.get(k).push(v);
  });
  let groups = Array.from(map.entries()).map(([key, items])=>({
    key, items, label: vocabGroupLabel(vocabGroupBy, key),
    color: vocabGroupBy==='review' ? (REVIEW_BUCKETS.find(b=>b.id===key)||{}).color
         : vocabGroupBy==='level' ? CEFR_COLORS[key] : null
  }));
  const rank = (k)=>{
    if(vocabGroupBy === 'review') return REVIEW_BUCKETS.findIndex(b=>b.id===k);
    if(vocabGroupBy === 'level'){ const i = CEFR_LEVELS.indexOf(k); return i < 0 ? 99 : i; }
    return 0;
  };
  if(vocabGroupBy === 'date'){
    const asc = vocabSortId === 'date-asc';
    groups.sort((a,b)=> asc ? a.key.localeCompare(b.key) : b.key.localeCompare(a.key));
  }else{
    const reverse = vocabSortId === 'review-desc' || vocabSortId === 'level-desc';
    groups.sort((a,b)=> (rank(a.key) - rank(b.key)) * (reverse ? -1 : 1));
  }
  return groups;
}

async function copySelectedVocab(){
  if(vocabSelectedIds.size === 0) return;
  const ids = Array.from(vocabSelectedIds);
  const items = vocab.filter(v => ids.includes(v.id));
  if(items.length === 0) return;
  const text = items.map(v => `${v.word}\t${v.translation}\t${v.cefr || ''}\t${formatVocabDate(v.created_at)}`).join('\n');
  const done = ()=> alert(`已複製 ${items.length} 個單字的中英文到剪貼簿。`);
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      done();
      return;
    }
    throw new Error('no clipboard api');
  }catch(err){
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    }catch(err2){
      alert('複製失敗，請手動選取文字複製。');
    }
  }
}

function normalizeCefrValue(v){
  const c = String(v||'').trim().toUpperCase();
  return CEFR_LEVELS.includes(c) ? c : '';
}

// 解析「一行一筆、欄位用 Tab（或連續空白）分隔」的格式，例如從試算表貼上：
//   1  dull  無聊的；乏味的；暗淡的；鈍的  B1
// 開頭的編號欄位會自動被忽略。
function parseVocabRow(line){
  let cols = line.split('\t').map(c=>c.trim()).filter(c=>c!=='');
  if(cols.length < 2){
    cols = line.trim().split(/\s{2,}/).map(c=>c.trim()).filter(c=>c!=='');
  }
  if(cols.length < 2) return null;
  if(/^\d+[.、]?$/.test(cols[0]) && cols.length >= 3){
    cols = cols.slice(1); // 去掉開頭的編號欄位
  }
  const word = cols[0];
  const translation = cols[1] || '';
  const cefr = normalizeCefrValue(cols[2]);
  if(!word || !translation) return null;
  return { word, translation, cefr };
}

function parseVocabQuickInput(text){
  const raw = String(text||'');
  const nonEmptyLines = raw.split('\n').map(l=>l.replace(/\r$/,'')).filter(l=>l.trim()!=='');
  if(nonEmptyLines.length === 0) return [];

  // 格式一：每行一筆（Tab 分隔，常見於試算表貼上，開頭可有編號欄位）
  if(nonEmptyLines.some(l=>l.includes('\t'))){
    const rowItems = nonEmptyLines.map(parseVocabRow).filter(Boolean);
    if(rowItems.length) return rowItems;
  }

  // 格式二：三行一組（單字／翻譯／CEFR），多組之間用空行分隔
  const blocks = raw.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  const items = [];
  blocks.forEach(block=>{
    const lines = block.split('\n').map(l=>l.trim()).filter(Boolean);
    if(lines.length < 2) return;
    const word = lines[0];
    const translation = lines[1];
    const cefr = normalizeCefrValue(lines[2]);
    if(word && translation) items.push({ word, translation, cefr });
  });
  return items;
}

function bindVocabQuickInput(){
  const ta = document.getElementById('vQuickInput');
  const parseBtn = document.getElementById('parseVocabQuickBtn');
  if(!ta) return;
  const doParse = async ()=>{
    const items = parseVocabQuickInput(ta.value);
    if(items.length === 0) return;
    if(items.length === 1){
      const it = items[0];
      document.getElementById('vWord').value = it.word;
      document.getElementById('vTranslation').value = it.translation;
      if(it.cefr) document.getElementById('vCefr').value = it.cefr;
      ta.value = '';
    }else{
      const seen = new Set();
      const deduped = [];
      items.forEach(it=>{
        const key = normalizeAnswer(it.word);
        if(seen.has(key)) return;
        seen.add(key);
        deduped.push(it);
      });
      const newOnes = deduped.filter(it=>!vocabWordExists(it.word));
      const dupCount = items.length - newOnes.length;
      if(newOnes.length === 0){
        alert('這些單字都已經在單字本裡了，沒有新增任何項目。');
        return;
      }
      const msg = dupCount > 0
        ? `偵測到 ${items.length} 筆單字（其中 ${dupCount} 筆重複，將略過），要新增其餘 ${newOnes.length} 筆到單字本嗎？`
        : `偵測到 ${newOnes.length} 筆單字，要一次全部加入單字本嗎？`;
      if(!confirm(msg)) return;
      const rows = newOnes.map(it=>({ word:it.word, translation:it.translation, cefr: it.cefr || 'A1', user_id: currentUser.id }));
      const { data, error } = await db.from('vocab').insert(rows).select();
      if(error){ alert('批次新增失敗：' + error.message); return; }
      vocab = (data || []).concat(vocab);
      vocabShowForm = false;
      renderVocabPanel();
    }
  };
  ta.addEventListener('paste', ()=> setTimeout(doParse, 0));
  if(parseBtn) parseBtn.addEventListener('click', doParse);
}

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function buildVocabOptionIds(correctWord, distractorSource){
  const sameLevel = distractorSource.filter(v=>v.id!==correctWord.id && v.cefr===correctWord.cefr);
  const others = distractorSource.filter(v=>v.id!==correctWord.id && v.cefr!==correctWord.cefr);
  const distractors = shuffleArr(sameLevel).concat(shuffleArr(others)).slice(0, 3);
  return shuffleArr([correctWord.id, ...distractors.map(d=>d.id)]);
}

function startVocabQuiz(){
  const pool = vocabQuizLevelFilter === 'all' ? vocab : vocab.filter(v=>v.cefr===vocabQuizLevelFilter);
  if(pool.length === 0 || vocab.length < 2) return;
  const n = vocabQuizCount === 'all' ? pool.length : Math.min(vocabQuizCount, pool.length);
  const chosen = pickVocabForQuiz(pool, n);
  const questions = chosen.map(v=>{
    const qType = vocabQuizType === 'mixed' ? (Math.random() < 0.5 ? 'zh2en' : 'en2zh') : vocabQuizType;
    return { vocabId: v.id, optionIds: buildVocabOptionIds(v, vocab), type: qType };
  });
  vocabShowQuizSetup = false;
  vocabQuizSession = { type: vocabQuizType, questions, idx:0, correctCount:0, picked:null, revealed:false, lastCorrect:false };
  renderVocabPanel();
}

function revealVocabAnswer(){
  const q = vocabQuizSession.questions[vocabQuizSession.idx];
  const correct = vocabQuizSession.picked === q.vocabId;
  vocabQuizSession.revealed = true;
  vocabQuizSession.lastCorrect = correct;
  if(correct) vocabQuizSession.correctCount++;
  recordVocabAnswer(q.vocabId, correct);
  renderVocabPanel();
  if(correct) autoNextAfterCorrect(vocabQuizSession, ()=>vocabQuizSession, 'nextVocabCardBtn');
}

function normalizeAnswer(s){
  return String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
}

/* ============================================================
   遊戲模式 1：🎴 記憶配對
   ============================================================ */

function startVocabMemory(){
  const pool = vocabQuizLevelFilter === 'all' ? vocab : vocab.filter(v=>v.cefr===vocabQuizLevelFilter);
  if(pool.length < 2) return;
  const n = MEMORY_PAIR_OPTIONS.includes(vocabQuizCount) ? Math.min(vocabQuizCount, pool.length) : Math.min(MEMORY_PAIR_OPTIONS[0], pool.length);
  const chosen = pickVocabForQuiz(pool, n);
  let tiles = [];
  chosen.forEach(v=>{
    tiles.push({ key: v.id+'-w', pairId: v.id, kind:'word', text: v.word });
    tiles.push({ key: v.id+'-t', pairId: v.id, kind:'translation', text: v.translation });
  });
  tiles = shuffleArr(tiles);
  vocabShowQuizSetup = false;
  vocabMemorySession = { tiles, flippedKeys: [], matchedPairIds: new Set(), moves: 0, lock:false, totalPairs: n, rewarded:false };
  renderVocabPanel();
}

function vocabMemorySessionHTML(){
  const s = vocabMemorySession;
  const done = s.matchedPairIds.size === s.totalPairs;
  if(done){
    return `
      <div class="flash-wrap">
        <div class="summary-card">
          <span class="subject-tag">記憶配對完成</span>
          <div class="score">${s.moves} <span>次翻牌</span></div>
          <p style="color:var(--ink-soft);font-size:13.5px;">共配對 ${s.totalPairs} 組單字</p>
          <div class="flash-actions" style="justify-content:center;margin-top:16px;">
            <button type="button" class="ghost-btn" id="vocabBackToListBtn">回到單字本</button>
            <button type="button" class="solid-btn" id="vocabRestartBtn">再玩一次</button>
          </div>
        </div>
      </div>`;
  }
  const tilesHtml = s.tiles.map(t=>{
    const flipped = s.flippedKeys.includes(t.key);
    const matched = s.matchedPairIds.has(t.pairId);
    let cls = 'memory-tile';
    if(flipped || matched) cls += ' flipped';
    if(matched) cls += ' matched';
    return `
      <div class="${cls}" data-key="${t.key}">
        <div class="mt-inner">
          <div class="mt-face mt-back">🎴</div>
          <div class="mt-face mt-front">${escapeHtml(t.text)}</div>
        </div>
      </div>`;
  }).join('');
  return `
    <div class="flash-wrap" style="max-width:760px;">
      <div class="memory-topbar">
        <span>已配對 ${s.matchedPairIds.size} / ${s.totalPairs} 組</span>
        <span>翻牌次數：${s.moves}</span>
      </div>
      <div class="memory-grid">${tilesHtml}</div>
      <div class="flash-actions" style="margin-top:16px;">
        <button type="button" class="ghost-btn" id="vocabBackToListBtn">回到單字本</button>
      </div>
    </div>
  `;
}

function bindVocabMemoryEvents(){
  document.querySelectorAll('#vocabPanel .memory-tile').forEach(el=>{
    el.addEventListener('click', ()=>{
      const s = vocabMemorySession;
      if(!s || s.lock) return;
      const key = el.dataset.key;
      if(s.flippedKeys.includes(key)) return;
      const tile = s.tiles.find(t=>t.key===key);
      if(!tile || s.matchedPairIds.has(tile.pairId)) return;
      s.flippedKeys.push(key);
      if(tile.kind === 'word' && autoSpeakOn) speakVocabWord(tile.text);
      if(s.flippedKeys.length === 2){
        s.moves++;
        const [k1,k2] = s.flippedKeys;
        const t1 = s.tiles.find(t=>t.key===k1);
        const t2 = s.tiles.find(t=>t.key===k2);
        if(t1.pairId === t2.pairId && t1.kind !== t2.kind){
          s.matchedPairIds.add(t1.pairId);
          playAnswerSound(true);
          s.flippedKeys = [];
          if(s.matchedPairIds.size >= s.totalPairs && !s.rewarded){
            s.rewarded = true;
            awardQuizExp(s.totalPairs * VOCAB_ACTIVITY_EXP, 'match');
          }
          renderVocabPanel();
        }else{
          s.lock = true;
          playAnswerSound(false);
          renderVocabPanel();
          setTimeout(()=>{
            if(!vocabMemorySession) return;
            vocabMemorySession.flippedKeys = [];
            vocabMemorySession.lock = false;
            renderVocabPanel();
          }, 800);
        }
      }else{
        renderVocabPanel();
      }
    });
  });
  const backBtn = document.getElementById('vocabBackToListBtn');
  if(backBtn) backBtn.addEventListener('click', ()=>{ vocabMemorySession = null; renderVocabPanel(); });
  const restartBtn = document.getElementById('vocabRestartBtn');
  if(restartBtn) restartBtn.addEventListener('click', ()=>{ vocabMemorySession = null; startVocabMemory(); });
}

/* ============================================================
   遊戲模式 2：⏱ 限時打字挑戰
   ============================================================ */

function startVocabTyping(){
  const pool = vocabQuizLevelFilter === 'all' ? vocab : vocab.filter(v=>v.cefr===vocabQuizLevelFilter);
  if(pool.length === 0 || vocab.length < 2) return;
  const n = vocabQuizCount === 'all' ? pool.length : Math.min(vocabQuizCount, pool.length);
  const words = pickVocabForQuiz(pool, n);
  vocabShowQuizSetup = false;
  vocabTypingSession = {
    words, idx: 0, correctCount: 0, wrongCount: 0,
    timeLeft: vocabTypingTimeLimit, totalTime: vocabTypingTimeLimit,
    timerId: null, finished: false, revealed: false, lastCorrect: false
  };
  renderVocabPanel();
  startVocabTypingTimer();
}

function startVocabTypingTimer(){
  const s = vocabTypingSession;
  if(!s || s.timerId) return;
  s.timerId = setInterval(()=>{
    if(!vocabTypingSession){ clearInterval(s.timerId); return; }
    vocabTypingSession.timeLeft--;
    if(vocabTypingSession.timeLeft <= 0){
      vocabTypingSession.timeLeft = 0;
      finishVocabTyping();
      return;
    }
    const timerEl = document.getElementById('typingTimerDisplay');
    if(timerEl){
      timerEl.textContent = `⏱ ${vocabTypingSession.timeLeft} 秒`;
      timerEl.classList.toggle('low', vocabTypingSession.timeLeft <= 10);
    }
  }, 1000);
}

function finishVocabTyping(){
  const s = vocabTypingSession;
  if(!s || s.finished) return;
  if(s.timerId){ clearInterval(s.timerId); s.timerId = null; }
  s.finished = true;
  awardQuizExp(s.correctCount * VOCAB_ACTIVITY_EXP, 'typing');
  renderVocabPanel();
}

function vocabTypingSessionHTML(){
  const s = vocabTypingSession;
  const attempted = s.correctCount + s.wrongCount;
  if(s.finished || s.idx >= s.words.length){
    if(s.timerId){ clearInterval(s.timerId); s.timerId = null; }
    return `
      <div class="flash-wrap">
        <div class="summary-card">
          <span class="subject-tag">打字挑戰結果</span>
          <div class="score">${s.correctCount} <span>/ ${attempted || s.correctCount}</span></div>
          <p style="color:var(--ink-soft);font-size:13.5px;">答對 ${s.correctCount} 題・答錯 ${s.wrongCount} 題</p>
          <div class="flash-actions" style="justify-content:center;margin-top:16px;">
            <button type="button" class="ghost-btn" id="vocabBackToListBtn">回到單字本</button>
            <button type="button" class="solid-btn" id="vocabRestartBtn">再玩一次</button>
          </div>
        </div>
      </div>`;
  }
  const v = s.words[s.idx];
  const revealed = s.revealed;
  let resultHtml = '';
  if(revealed){
    resultHtml = `
      <div class="result-banner ${s.lastCorrect?'ok':'no'}">${s.lastCorrect?'✓ 答對了':'✗ 答錯了'}</div>
      ${!s.lastCorrect ? `<div class="correct-line">正確答案：<b>${escapeHtml(v.word)}</b></div>` : ''}
    `;
  }
  return `
    <div class="flash-wrap">
      <div class="typing-timer ${s.timeLeft<=10?'low':''}" id="typingTimerDisplay">⏱ ${s.timeLeft} 秒</div>
      <div class="flash-progress"><span>第 ${s.idx+1} / ${s.words.length} 題</span><span>答對 ${s.correctCount} 題</span></div>
      <div class="flash-bar"><div class="fill" style="width:${(s.idx/s.words.length*100)}%"></div></div>
      <div class="flashcard">
        <span class="cefr-tag" style="--cefr-color:${CEFR_COLORS[v.cefr]||'var(--brass)'}">${escapeHtml(v.cefr||'—')}</span>
        <div class="vocab-quiz-prompt">${escapeHtml(v.translation)}</div>
        <div class="vocab-quiz-hint">看中文，打出正確的英文單字（共 ${(v.word||'').replace(/\s+/g,'').length} 個字母）</div>
        <input type="text" id="typingAnswerInput" class="vocab-quiz-word-input" autocomplete="off" autocapitalize="off" spellcheck="false" ${revealed?'disabled':''} placeholder="在這裡輸入英文單字…">
        ${resultHtml}
        <div class="flash-actions">
          ${revealed
            ? `<button type="button" class="solid-btn" id="nextTypingBtn">${s.idx+1>=s.words.length?'查看結果':'下一題'}</button>`
            : `<button type="button" class="solid-btn" id="submitTypingBtn">送出答案</button>`}
        </div>
      </div>
    </div>
  `;
}

function bindVocabTypingEvents(){
  const input = document.getElementById('typingAnswerInput');
  if(input){
    input.focus();
    input.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        if(!vocabTypingSession.revealed) submitVocabTypingAnswer();
        else document.getElementById('nextTypingBtn')?.click();
      }
    });
  }
  const submitBtn = document.getElementById('submitTypingBtn');
  if(submitBtn) submitBtn.addEventListener('click', submitVocabTypingAnswer);
  const nextBtn = document.getElementById('nextTypingBtn');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{
    vocabTypingSession.idx++;
    vocabTypingSession.revealed = false;
    if(vocabTypingSession.idx >= vocabTypingSession.words.length){
      finishVocabTyping();
    }else{
      renderVocabPanel();
    }
  });
  const backBtn = document.getElementById('vocabBackToListBtn');
  if(backBtn) backBtn.addEventListener('click', ()=>{
    if(vocabTypingSession && vocabTypingSession.timerId) clearInterval(vocabTypingSession.timerId);
    vocabTypingSession = null; renderVocabPanel();
  });
  const restartBtn = document.getElementById('vocabRestartBtn');
  if(restartBtn) restartBtn.addEventListener('click', ()=>{
    if(vocabTypingSession && vocabTypingSession.timerId) clearInterval(vocabTypingSession.timerId);
    vocabTypingSession = null; startVocabTyping();
  });
}

function submitVocabTypingAnswer(){
  const s = vocabTypingSession;
  if(!s || s.revealed) return;
  const input = document.getElementById('typingAnswerInput');
  const val = input ? input.value : '';
  const v = s.words[s.idx];
  const correct = normalizeAnswer(val) === normalizeAnswer(v.word);
  s.revealed = true;
  s.lastCorrect = correct;
  if(correct) s.correctCount++; else s.wrongCount++;
  recordVocabAnswer(v.id, correct);
  renderVocabPanel();
  if(correct) autoNextAfterCorrect(s, ()=>vocabTypingSession, 'nextTypingBtn');
}

/* ============================================================
   遊戲模式 3：🔤 字母重組
   ============================================================ */

function startVocabScramble(){
  const pool = vocabQuizLevelFilter === 'all' ? vocab : vocab.filter(v=>v.cefr===vocabQuizLevelFilter);
  const usablePool = pool.filter(v=>/[a-zA-Z]/.test(v.word||''));
  const source = usablePool.length ? usablePool : pool;
  if(source.length === 0 || vocab.length < 2) return;
  const n = vocabQuizCount === 'all' ? source.length : Math.min(vocabQuizCount, source.length);
  const words = pickVocabForQuiz(source, n);
  vocabShowQuizSetup = false;
  vocabScrambleSession = { words, idx: 0, correctCount: 0, revealed: false, lastCorrect: false };
  setupScrambleLetters();
  renderVocabPanel();
}

function setupScrambleLetters(){
  const s = vocabScrambleSession;
  const v = s.words[s.idx];
  const rawLetters = (v.word||'').replace(/\s+/g,'').split('');
  let scrambled = rawLetters;
  let attempts = 0;
  do {
    scrambled = shuffleArr(rawLetters);
    attempts++;
  } while(scrambled.join('') === rawLetters.join('') && rawLetters.length > 1 && attempts < 20);
  s.letters = scrambled.map((ch,i)=>({ id:'l'+i, ch, used:false }));
  s.answer = [];
}

function vocabScrambleSessionHTML(){
  const s = vocabScrambleSession;
  const total = s.words.length;
  if(s.idx >= total){
    return `
      <div class="flash-wrap">
        <div class="summary-card">
          <span class="subject-tag">字母重組結果</span>
          <div class="score">${s.correctCount} <span>/ ${total}</span></div>
          <p style="color:var(--ink-soft);font-size:13.5px;">答對率 ${total?Math.round(s.correctCount/total*100):0}%</p>
          <div class="flash-actions" style="justify-content:center;margin-top:16px;">
            <button type="button" class="ghost-btn" id="vocabBackToListBtn">回到單字本</button>
            <button type="button" class="solid-btn" id="vocabRestartBtn">再玩一次</button>
          </div>
        </div>
      </div>`;
  }
  const v = s.words[s.idx];
  const revealed = s.revealed;
  const answerLen = s.letters.length;

  const blanksHtml = Array.from({length: answerLen}).map((_,i)=>{
    const picked = s.answer[i];
    const cls = 'scramble-blank' + (picked ? ' filled' : '');
    return `<div class="${cls}" data-slot="${i}">${picked ? escapeHtml(picked.ch) : ''}</div>`;
  }).join('');

  const tilesHtml = s.letters.map(l=>`<button type="button" class="scramble-letter ${l.used?'used':''}" data-letterid="${l.id}" ${revealed?'disabled':''}>${escapeHtml(l.ch)}</button>`).join('');

  let resultHtml = '';
  if(revealed){
    resultHtml = `
      <div class="result-banner ${s.lastCorrect?'ok':'no'}">${s.lastCorrect?'✓ 答對了':'✗ 答錯了'}</div>
      ${!s.lastCorrect ? `<div class="correct-line">正確答案：<b>${escapeHtml(v.word)}</b></div>` : ''}
    `;
  }

  return `
    <div class="flash-wrap">
      <div class="flash-progress"><span>第 ${s.idx+1} / ${total} 題</span><span>答對 ${s.correctCount} 題</span></div>
      <div class="flash-bar"><div class="fill" style="width:${(s.idx/total*100)}%"></div></div>
      <div class="flashcard">
        <span class="cefr-tag" style="--cefr-color:${CEFR_COLORS[v.cefr]||'var(--brass)'}">${escapeHtml(v.cefr||'—')}</span>
        <div class="vocab-quiz-prompt" style="font-size:16px;">${escapeHtml(v.translation)}</div>
        <div class="vocab-quiz-hint">打亂了的英文單字字母，點一點拼回正確順序</div>
        <div class="scramble-answer-row">${blanksHtml}</div>
        <div class="scramble-tiles">${tilesHtml}</div>
        ${resultHtml}
        <div class="flash-actions" style="justify-content:space-between;">
          <div>${!revealed ? `<button type="button" class="ghost-btn" id="clearScrambleBtn">清除</button>` : ''}</div>
          <div style="display:flex;gap:10px;">
            ${!revealed ? `<button type="button" class="solid-btn" id="submitScrambleBtn" ${s.answer.length!==answerLen?'disabled':''}>送出答案</button>` : ''}
            ${revealed ? `<button type="button" class="solid-btn" id="nextScrambleBtn">${s.idx+1>=total?'查看結果':'下一題'}</button>` : ''}
          </div>
        </div>
      </div>
    </div>
  `;
}

function bindVocabScrambleEvents(){
  document.querySelectorAll('#vocabPanel .scramble-letter').forEach(el=>{
    el.addEventListener('click', ()=>{
      const s = vocabScrambleSession;
      if(!s || s.revealed) return;
      const letter = s.letters.find(l=>l.id===el.dataset.letterid);
      if(!letter || letter.used) return;
      letter.used = true;
      s.answer.push(letter);
      renderVocabPanel();
    });
  });
  document.querySelectorAll('#vocabPanel .scramble-blank').forEach(el=>{
    el.addEventListener('click', ()=>{
      const s = vocabScrambleSession;
      if(!s || s.revealed) return;
      const slot = parseInt(el.dataset.slot, 10);
      if(slot >= s.answer.length) return;
      const removed = s.answer.splice(slot, s.answer.length - slot);
      removed.forEach(letter=>{ letter.used = false; });
      renderVocabPanel();
    });
  });
  const clearBtn = document.getElementById('clearScrambleBtn');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{
    const s = vocabScrambleSession;
    if(!s) return;
    s.answer.forEach(letter=>{ letter.used = false; });
    s.answer = [];
    renderVocabPanel();
  });
  const submitBtn = document.getElementById('submitScrambleBtn');
  if(submitBtn) submitBtn.addEventListener('click', ()=>{
    const s = vocabScrambleSession;
    if(!s || s.answer.length !== s.letters.length) return;
    const v = s.words[s.idx];
    const built = s.answer.map(l=>l.ch).join('');
    const correct = normalizeAnswer(built) === normalizeAnswer((v.word||'').replace(/\s+/g,''));
    s.revealed = true;
    s.lastCorrect = correct;
    if(correct) s.correctCount++;
    recordVocabAnswer(v.id, correct);
    renderVocabPanel();
    if(correct) autoNextAfterCorrect(s, ()=>vocabScrambleSession, 'nextScrambleBtn');
  });
  const nextBtn = document.getElementById('nextScrambleBtn');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{
    const s = vocabScrambleSession;
    if(!s) return;
    s.idx++;
    s.revealed = false;
    if(s.idx < s.words.length){
      setupScrambleLetters();
    }else{
      awardQuizExp(s.correctCount * VOCAB_ACTIVITY_EXP, 'scramble');
    }
    renderVocabPanel();
  });
  const backBtn = document.getElementById('vocabBackToListBtn');
  if(backBtn) backBtn.addEventListener('click', ()=>{ vocabScrambleSession = null; renderVocabPanel(); });
  const restartBtn = document.getElementById('vocabRestartBtn');
  if(restartBtn) restartBtn.addEventListener('click', ()=>{ vocabScrambleSession = null; startVocabScramble(); });
}

/* ============================================================
   遊戲模式 4：🔊 聽力選擇
   ============================================================ */

function startVocabListening(){
  const pool = vocabQuizLevelFilter === 'all' ? vocab : vocab.filter(v=>v.cefr===vocabQuizLevelFilter);
  if(pool.length === 0 || vocab.length < 2) return;
  const n = vocabQuizCount === 'all' ? pool.length : Math.min(vocabQuizCount, pool.length);
  const chosen = pickVocabForQuiz(pool, n);
  const questions = chosen.map(v=>({ vocabId: v.id, optionIds: buildVocabOptionIds(v, vocab) }));
  vocabShowQuizSetup = false;
  vocabListeningSession = { questions, idx: 0, correctCount: 0, picked: null, revealed: false, lastCorrect: false };
  renderVocabPanel();
}

function speakVocabWord(word){
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(word);
    utter.lang = 'en-US';
    utter.rate = 0.9;
    // 盡量挑英文（美式）語音，找不到就用瀏覽器預設
    const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
    const voice = voices.find(x=>x.lang === 'en-US') || voices.find(x=>(x.lang||'').startsWith('en'));
    if(voice) utter.voice = voice;
    window.speechSynthesis.speak(utter);
  }catch(e){ /* 語音合成不可用時靜默忽略，使用者仍可重新點擊喇叭 */ }
}

/* ---- 音效與自動發音（設定存在 localStorage） ---- */
let soundFxOn = localStorage.getItem('vocabSoundFx') !== '0';       // 答題音效
let autoSpeakOn = localStorage.getItem('vocabAutoSpeak') !== '0';   // 自動唸出單字
let autoNextOn = localStorage.getItem('vocabAutoNext') !== '0';     // 答對自動換下一題
let audioCtx = null;

// 答對後稍等一下（讓音效與發音播完）再自動按「下一題」。
// 只有在還停留在同一題、同一場遊戲時才會跳，避免使用者已經手動換題後又被多跳一次。
function autoNextAfterCorrect(session, getActive, nextBtnId){
  if(!autoNextOn || !session) return;
  const idx = session.idx;
  setTimeout(()=>{
    if(getActive() !== session || session.idx !== idx) return;
    const btn = document.getElementById(nextBtnId);
    if(btn) btn.click();
  }, 1400);
}

function playTone(freq, startOffset, duration, type, volume){
  const ctx = audioCtx;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  const t0 = ctx.currentTime + startOffset;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(volume || 0.15, t0 + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + duration + 0.05);
}

// 答對：清脆的兩聲上行；答錯：低沉的兩聲下行
function playAnswerSound(correct){
  if(!soundFxOn) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!audioCtx) audioCtx = new AC();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    if(correct){
      playTone(660, 0, 0.14, 'sine', 0.16);
      playTone(990, 0.11, 0.22, 'sine', 0.16);
    }else{
      playTone(220, 0, 0.18, 'triangle', 0.2);
      playTone(165, 0.15, 0.28, 'triangle', 0.2);
    }
  }catch(e){ /* 音效不可用時靜默忽略 */ }
}

function vocabListeningSessionHTML(){
  const s = vocabListeningSession;
  const total = s.questions.length;
  if(s.idx >= total){
    return `
      <div class="flash-wrap">
        <div class="summary-card">
          <span class="subject-tag">聽力選擇結果</span>
          <div class="score">${s.correctCount} <span>/ ${total}</span></div>
          <p style="color:var(--ink-soft);font-size:13.5px;">答對率 ${total?Math.round(s.correctCount/total*100):0}%</p>
          <div class="flash-actions" style="justify-content:center;margin-top:16px;">
            <button type="button" class="ghost-btn" id="vocabBackToListBtn">回到單字本</button>
            <button type="button" class="solid-btn" id="vocabRestartBtn">再測驗一次</button>
          </div>
        </div>
      </div>`;
  }
  const q = s.questions[s.idx];
  const v = vocab.find(x=>x.id===q.vocabId);
  if(!v){ s.idx++; return vocabListeningSessionHTML(); }
  const revealed = s.revealed;
  const optionWords = q.optionIds.map(id=>vocab.find(x=>x.id===id)).filter(Boolean);

  const optionsHtml = optionWords.map((opt,i)=>{
    const letter = OPTION_LABELS[i];
    let cls = 'choice-btn';
    if(revealed){
      if(opt.id === v.id) cls += ' reveal-correct';
      else if(opt.id === s.picked) cls += ' reveal-wrong';
    }else if(opt.id === s.picked) cls += ' picked';
    return `<button type="button" class="${cls}" data-id="${opt.id}" ${revealed?'disabled':''}><span>${letter}.</span><span>${escapeHtml(opt.translation)}</span></button>`;
  }).join('');

  let resultHtml = '';
  if(revealed){
    resultHtml = `
      <div class="result-banner ${s.lastCorrect?'ok':'no'}">${s.lastCorrect?'✓ 答對了':'✗ 答錯了'}</div>
      ${!s.lastCorrect ? `<div class="correct-line">正確答案：<b>${escapeHtml(v.translation)}</b>（${escapeHtml(v.word)}）</div>` : ''}
    `;
  }

  return `
    <div class="flash-wrap">
      <div class="flash-progress"><span>第 ${s.idx+1} / ${total} 題</span><span>答對 ${s.correctCount} 題</span></div>
      <div class="flash-bar"><div class="fill" style="width:${(s.idx/total*100)}%"></div></div>
      <div class="flashcard">
        <span class="cefr-tag" style="--cefr-color:${CEFR_COLORS[v.cefr]||'var(--brass)'}">${escapeHtml(v.cefr||'—')}</span>
        <button type="button" class="listen-btn" id="playListeningBtn" title="播放發音">🔊</button>
        <div class="listen-hint">點喇叭聽發音，選出正確的中文意思${revealed ? `（單字：${escapeHtml(v.word)}）` : ''}</div>
        <div class="m-opts">${optionsHtml}</div>
        ${resultHtml}
        <div class="flash-actions">
          ${revealed ? `<button type="button" class="solid-btn" id="nextListeningBtn">${s.idx+1>=total?'查看結果':'下一題'}</button>` : ''}
        </div>
      </div>
    </div>
  `;
}

function bindVocabListeningEvents(){
  const playBtn = document.getElementById('playListeningBtn');
  if(playBtn){
    playBtn.addEventListener('click', ()=>{
      const s = vocabListeningSession;
      const q = s.questions[s.idx];
      const v = vocab.find(x=>x.id===q.vocabId);
      if(v) speakVocabWord(v.word);
    });
    const s = vocabListeningSession;
    if(!s.revealed){
      const q = s.questions[s.idx];
      const v = vocab.find(x=>x.id===q.vocabId);
      if(v) speakVocabWord(v.word);
    }
  }
  document.querySelectorAll('#vocabPanel .choice-btn').forEach(el=>{
    el.addEventListener('click', ()=>{
      const s = vocabListeningSession;
      if(s.revealed) return;
      s.picked = el.dataset.id;
      revealVocabListeningAnswer();
    });
  });
  const nextBtn = document.getElementById('nextListeningBtn');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{
    vocabListeningSession.idx++;
    vocabListeningSession.revealed = false;
    vocabListeningSession.picked = null;
    if(vocabListeningSession.idx >= vocabListeningSession.questions.length){
      awardQuizExp(vocabListeningSession.correctCount * VOCAB_ACTIVITY_EXP, 'listen');
    }
    renderVocabPanel();
  });
  const backBtn = document.getElementById('vocabBackToListBtn');
  if(backBtn) backBtn.addEventListener('click', ()=>{ vocabListeningSession = null; renderVocabPanel(); });
  const restartBtn = document.getElementById('vocabRestartBtn');
  if(restartBtn) restartBtn.addEventListener('click', ()=>{ vocabListeningSession = null; startVocabListening(); });
}

function revealVocabListeningAnswer(){
  const s = vocabListeningSession;
  const q = s.questions[s.idx];
  const correct = s.picked === q.vocabId;
  s.revealed = true;
  s.lastCorrect = correct;
  if(correct) s.correctCount++;
  recordVocabAnswer(q.vocabId, correct);
  renderVocabPanel();
  if(correct) autoNextAfterCorrect(s, ()=>vocabListeningSession, 'nextListeningBtn');
}

/* ============================================================
   讀書時間：登記開始/結束時間，計算總時間
   ============================================================ */

async function loadStudySessions(){
  studySessions = [];
  studyActiveSession = null;
  if(!currentUser) return;
  const { data, error } = await db
    .from('study_sessions').select('*').order('start_time', { ascending:false });
  if(error){ console.error('讀取讀書時間紀錄失敗', error); return; }
  studySessions = data || [];
  // 如果有一筆還沒填 end_time，代表上次計時到一半就離開／重新整理了，恢復計時
  const running = studySessions.find(s=>!s.end_time);
  if(running){
    studyActiveSession = { id: running.id, start_time: running.start_time };
    startStudyTimerInterval();
  }
}

function formatStudyDuration(totalSeconds){
  const sec = Math.max(0, Math.round(totalSeconds || 0));
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  if(h > 0) return `${h} 小時 ${m} 分`;
  if(m > 0) return `${m} 分 ${s} 秒`;
  return `${s} 秒`;
}

function formatStudyDateTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '—';
  return d.toLocaleString('zh-TW', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false });
}

function studyDateInputValue(iso){
  // 轉成 <input type="datetime-local"> 需要的格式（本地時間、無時區）
  const d = iso ? new Date(iso) : new Date();
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function studySessionSeconds(s){
  if(s.duration_seconds != null) return s.duration_seconds;
  if(!s.end_time) return 0;
  return Math.max(0, (new Date(s.end_time) - new Date(s.start_time)) / 1000);
}

function studyStatsToday(){
  const today = todayStr();
  return studySessions
    .filter(s=> s.end_time && (s.start_time||'').slice(0,10) === today)
    .reduce((sum,s)=> sum + studySessionSeconds(s), 0);
}

function studyStatsTotal(){
  return studySessions
    .filter(s=>s.end_time)
    .reduce((sum,s)=> sum + studySessionSeconds(s), 0);
}

function renderStudyPanel(){
  const panel = document.getElementById('studyPanel');
  const finished = studySessions.filter(s=>s.end_time).slice(0, 200);

  panel.innerHTML = `
    <div class="panel">
      <div class="section-head">
        <h2>讀書時間</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          ${!studyActiveSession ? `<button type="button" class="ghost-btn" id="toggleStudyManualBtn">${studyShowManualForm ? '－ 收起手動新增' : '＋ 手動新增紀錄'}</button>` : ''}
        </div>
      </div>

      <div class="study-timer-card">
        ${studyActiveSession ? `
          <div class="study-timer-label">正在讀書中…</div>
          <div class="study-timer-display" id="studyTimerDisplay">00:00:00</div>
          <div class="study-timer-sub">開始於 ${formatStudyDateTime(studyActiveSession.start_time)}</div>
          <button type="button" class="solid-btn" id="stopStudyBtn" style="background:var(--danger);">⏹ 結束讀書</button>
        ` : `
          <div class="study-timer-label">還沒開始計時</div>
          <button type="button" class="solid-btn" id="startStudyBtn">▶️ 開始讀書</button>
        `}
      </div>

      ${studyShowManualForm && !studyActiveSession ? studyManualFormHTML() : ''}

      <div class="vocab-stats-grid" style="margin-top:20px;">
        <div class="vocab-chart-card" style="text-align:center;">
          <h3>今天讀書時間</h3>
          <div class="study-stat-num">${formatStudyDuration(studyStatsToday())}</div>
        </div>
        <div class="vocab-chart-card" style="text-align:center;">
          <h3>累計讀書時間</h3>
          <div class="study-stat-num">${formatStudyDuration(studyStatsTotal())}</div>
        </div>
      </div>

      <h3 style="font-family:'Fraunces',serif;font-size:15px;margin:22px 0 10px;">紀錄</h3>
      ${finished.length === 0 ? `
        <div class="empty"><h2>還沒有讀書紀錄</h2><p>按上面「開始讀書」開始計時，或手動新增一筆過去的紀錄。</p></div>
      ` : `
        <div class="study-list">
          ${finished.map(studySessionRowHTML).join('')}

function studySessionRowHTML(s){
  return `
    <div class="study-row">
      <div class="study-row-main">
        <span class="study-row-time">${formatStudyDateTime(s.start_time)} → ${formatStudyDateTime(s.end_time)}</span>

function studyManualFormHTML(){
  const now = studyDateInputValue();

    <form class="vocab-form" id="studyManualForm" style="margin-top:16px;">
      ${studyManualError ? `<div class="vocab-form-error">${escapeHtml(studyManualError)}</div>` : ''}
      <div class="row3">
        <div class="field">
          <label>開始時間</label>
          <input type="datetime-local" id="studyStartInput" value="${now}">
        </div>

          <label>結束時間</label>
          <input type="datetime-local" id="studyEndInput" value="${now}">
        </div>
        <div class="field">
          <label>備註（選填）</label>

        </div>
      </div>
      <div class="vocab-form-actions">
        <button type="button" class="ghost-btn" id="cancelStudyManualBtn">取消</button>
        <button type="submit" class="solid-btn">新增紀錄</button>
      </div>
    </form>
  `;
}

function bindStudyPanelEvents(){
  const startBtn = document.getElementById('startStudyBtn');
  if(startBtn) startBtn.addEventListener('click', startStudySession);
  const stopBtn = document.getElementById('stopStudyBtn');
  if(stopBtn) stopBtn.addEventListener('click', stopStudySession);
  const toggleBtn = document.getElementById('toggleStudyManualBtn');
  if(toggleBtn) toggleBtn.addEventListener('click', ()=>{
    studyShowManualForm = !studyShowManualForm;
    studyManualError = '';
    renderStudyPanel();
  });
  const cancelBtn = document.getElementById('cancelStudyManualBtn');
  if(cancelBtn) cancelBtn.addEventListener('click', ()=>{
    studyShowManualForm = false;
    studyManualError = '';
    renderStudyPanel();
  });
  const form = document.getElementById('studyManualForm');
  if(form) form.addEventListener('submit', submitStudyManualForm);
  document.querySelectorAll('#studyPanel .v-del').forEach(el=>{
    el.addEventListener('click', async ()=>{
      if(!confirm('確定要刪除這筆讀書紀錄嗎？')) return;
      const { error } = await db.from('study_sessions').delete().eq('id', el.dataset.id);
      if(error){ alert('刪除失敗：' + error.message); return; }
      studySessions = studySessions.filter(s=>s.id !== el.dataset.id);
      renderStudyPanel();
    });
  });
  if(studyActiveSession) updateStudyTimerDisplay();
}

async function startStudySession(){
  if(studyActiveSession || !currentUser) return;
  const startIso = new Date().toISOString();
  const { data, error } = await db.from('study_sessions')
    .insert({ user_id: currentUser.id, start_time: startIso, end_time: null, duration_seconds: null, note: '' })
    .select().single();
  if(error){ alert('開始計時失敗：' + error.message); return; }
  const id = data && data.id ? data.id : ('local-' + Date.now());
  studyActiveSession = { id, start_time: startIso };
  studySessions.unshift({ id, user_id: currentUser.id, start_time: startIso, end_time: null, duration_seconds: null, note: '' });
  startStudyTimerInterval();
  renderStudyPanel();
}

function startStudyTimerInterval(){
  if(studyTimerIntervalId) clearInterval(studyTimerIntervalId);
  studyTimerIntervalId = setInterval(updateStudyTimerDisplay, 1000);
}

function updateStudyTimerDisplay(){
  if(!studyActiveSession) return;
  const el = document.getElementById('studyTimerDisplay');
  if(!el) return;
  const secs = Math.max(0, Math.floor((Date.now() - new Date(studyActiveSession.start_time).getTime()) / 1000));
  const h = String(Math.floor(secs/3600)).padStart(2,'0');
  const m = String(Math.floor((secs%3600)/60)).padStart(2,'0');
  const s = String(secs%60).padStart(2,'0');
  el.textContent = `${h}:${m}:${s}`;
}

async function stopStudySession(){
  if(!studyActiveSession) return;
  const endIso = new Date().toISOString();
  const durationSeconds = Math.max(0, Math.round((new Date(endIso) - new Date(studyActiveSession.start_time)) / 1000));
  if(studyTimerIntervalId){ clearInterval(studyTimerIntervalId); studyTimerIntervalId = null; }
  const { error } = await db.from('study_sessions')
    .update({ end_time: endIso, duration_seconds: durationSeconds })
    .eq('id', studyActiveSession.id);
  if(error){ alert('結束計時失敗：' + error.message); return; }
  const row = studySessions.find(s=>s.id === studyActiveSession.id);
  if(row){ row.end_time = endIso; row.duration_seconds = durationSeconds; }
  studyActiveSession = null;
  renderStudyPanel();
}

async function submitStudyManualForm(e){
  e.preventDefault();
  const startVal = document.getElementById('studyStartInput').value;
  const endVal = document.getElementById('studyEndInput').value;
  const note = document.getElementById('studyNoteInput').value.trim();
  if(!startVal || !endVal){
    studyManualError = '請輸入開始與結束時間';
    renderStudyPanel();
    return;
  }
  const startDate = new Date(startVal);
  const endDate = new Date(endVal);
  if(isNaN(startDate.getTime()) || isNaN(endDate.getTime()) || endDate <= startDate){
    studyManualError = '結束時間必須晚於開始時間';
    renderStudyPanel();
    return;
  }
  const durationSeconds = Math.round((endDate - startDate) / 1000);
  const { data, error } = await db.from('study_sessions')
    .insert({
      user_id: currentUser.id,
      start_time: startDate.toISOString(),
      end_time: endDate.toISOString(),
      duration_seconds: durationSeconds,
      note
    }).select().single();
  if(error){ studyManualError = '新增失敗：' + error.message; renderStudyPanel(); return; }
  studySessions.unshift(data);
  studySessions.sort((a,b)=> new Date(b.start_time) - new Date(a.start_time));
  studyShowManualForm = false;
  studyManualError = '';
  renderStudyPanel();
}



/* ============================================================
   每日紀錄（熱力圖）：最近 365 天每天寫了多少頁、各科分別多少
   ============================================================ */

let selectedDailyDate = todayStr(); // 目前熱力圖選中的日期，預設今天

// 把所有書的 entries 依日期彙總：{ date: { total, bySubject:{book_id:pages} } }
function dailyAggregation(){
  const map = {};
  books.forEach(b=>{
    (entriesByBook[b.id] || []).forEach(e=>{
      if(!map[e.date]) map[e.date] = { total:0, bySubject:{} };
      map[e.date].total += e.pages;
      map[e.date].bySubject[b.id] = (map[e.date].bySubject[b.id] || 0) + e.pages;
    });
  });
  return map;
}

function dailyLevel(pages, maxPages){
  if(!pages) return 0;
  if(maxPages <= 0) return 0;
  const ratio = pages / maxPages;
  if(ratio >= 0.75) return 4;
  if(ratio >= 0.5) return 3;
  if(ratio >= 0.25) return 2;
  return 1;
}

function fmtDate(d){ return d.toISOString().slice(0,10); }

const MONTH_ZH = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function renderDailyPanel(){
  const panel = document.getElementById('dailyPanel');
  const agg = dailyAggregation();

  const todayD = new Date(todayStr() + 'T00:00:00');
  const rangeStart = new Date(todayD); rangeStart.setDate(rangeStart.getDate() - 364); // 最近 365 天起點

  // 對齊到週：格子從最近一個週日開始排到本週六，共 53 週
  const weeks = 53;
  const gridEnd = new Date(todayD); gridEnd.setDate(gridEnd.getDate() + (6 - todayD.getDay()));
  const gridStart = new Date(gridEnd); gridStart.setDate(gridStart.getDate() - (weeks * 7 - 1));

  // 最近 365 天的統計摘要
  let totalPages365 = 0, activeDays365 = 0;
  Object.keys(agg).forEach(date=>{
    const d = new Date(date + 'T00:00:00');
    if(d >= rangeStart && d <= todayD){ totalPages365 += agg[date].total; activeDays365++; }
  });
  const maxPages = Math.max(0, ...Object.values(agg).map(v=>v.total));

  // 逐日建立格子（gridStart 一定是週日，天然依序填滿 grid-auto-flow:column 的 7 列）
  let cells = '';
  let months = '';
  let prevMonth = null;
  for(let i=0, d=new Date(gridStart); d<=gridEnd; i++, d.setDate(d.getDate()+1)){
    const dateStr = fmtDate(d);
    const isFuture = d > todayD;
    if(d.getDay() === 0){ // 每週日代表一個新的一週欄位，檢查是否要標月份
      const m = d.getMonth();
      months += `<span>${m !== prevMonth ? MONTH_ZH[m] : ''}</span>`;
      prevMonth = m;
    }
    if(isFuture){
      cells += `<div class="heatmap-cell empty-pad"></div>`;
    }else{
      const pages = agg[dateStr] ? agg[dateStr].total : 0;
      const level = dailyLevel(pages, maxPages);
      const sel = dateStr === selectedDailyDate ? ' selected' : '';
      cells += `<div class="heatmap-cell level-${level}${sel}" data-date="${dateStr}" title="${dateStr}・${pages}頁"></div>`;
    }
  }

  panel.innerHTML = `
    <div class="panel">
      <div class="section-head">
        <h2>📅 每日紀錄</h2>
      </div>
      <div class="daily-summary">
        <span class="stat">最近 365 天總頁數 <b>${totalPages365}</b> 頁</span>
        <span class="stat">有紀錄的天數 <b>${activeDays365}</b> 天</span>
      </div>
      <div class="heatmap-scroll">
        <div class="heatmap-inner">
          <div class="heatmap-months">${months}</div>
          <div class="heatmap-body">
            <div class="heatmap-weekday-labels"><span></span><span>一</span><span></span><span>三</span><span></span><span>五</span><span></span></div>
            <div class="heatmap-grid" id="dailyHeatmapGrid">${cells}</div>
          </div>
        </div>
      </div>
      <div class="heatmap-legend">
        <span>少</span>
        <div class="heatmap-cell level-0"></div>
        <div class="heatmap-cell level-1"></div>
        <div class="heatmap-cell level-2"></div>
        <div class="heatmap-cell level-3"></div>
        <div class="heatmap-cell level-4"></div>
        <span>多</span>
      </div>
      <div class="daily-detail" id="dailyDetail"></div>
    </div>
  `;

  updateDailyDetail(agg);
  bindDailyPanelEvents(agg);
}

function updateDailyDetail(agg){
  const detail = document.getElementById('dailyDetail');
  const info = agg[selectedDailyDate];
  const dateLabel = selectedDailyDate === todayStr() ? `${selectedDailyDate}（今天）` : selectedDailyDate;

  if(!info || info.total === 0){
    detail.innerHTML = `
      <div class="daily-detail-head">
        <h3>${dateLabel}</h3>
        <span class="total">共 <b>0</b> 頁</span>
      </div>
      <div class="daily-detail-empty">這天沒有寫紀錄</div>
    `;
    return;
  }

  const rows = Object.entries(info.bySubject)
    .map(([bookId, pages])=>({ name: (books.find(b=>b.id===bookId)||{}).name || '未知科目', pages }))
    .sort((a,b)=>b.pages - a.pages);

  detail.innerHTML = `
    <div class="daily-detail-head">
      <h3>${dateLabel}</h3>
      <span class="total">共 <b>${info.total}</b> 頁</span>
    </div>
    <div class="daily-detail-list">
      ${rows.map(r=>`
        <div class="daily-detail-row">
          <span class="subject">${escapeHtml(r.name)}</span>
          <span class="pages"><b>${r.pages}</b> 頁</span>
        </div>
      `).join('')}
    </div>
  `;
}

function bindDailyPanelEvents(agg){
  document.querySelectorAll('#dailyHeatmapGrid .heatmap-cell[data-date]').forEach(el=>{
    el.addEventListener('click', ()=>{
      selectedDailyDate = el.dataset.date;
      document.querySelectorAll('#dailyHeatmapGrid .heatmap-cell').forEach(c=>c.classList.remove('selected'));
      el.classList.add('selected');
      updateDailyDetail(agg);
    });
  });
}



/* ---------------- 島嶼寵物模式 ---------------- */
const PET_SPECIES = [
  { id:'seafrog', emoji:'🐸', name:'海水蛙', desc:'島上唯一的夥伴・陪你複習與冒險' },
];
let islandPet = null;

function petStorageKey(){
  const uid = currentUser ? (currentUser.id || 'guest') : 'guest';
  return 'islandPet:' + uid;
}
function defaultPet(){
  return null; // 尚未認養
}
function loadPet(){
  try{
    const raw = localStorage.getItem(petStorageKey());
    if(!raw){ islandPet = null; return; }
    islandPet = JSON.parse(raw);
    // 目前只有海水蛙：統一物種與預設名
    if(islandPet){
      islandPet.species = 'seafrog';
      if(!islandPet.name || ['島嶼小龍','熔岩狐','椰林貓','沙灘龜'].includes(islandPet.name)){
        islandPet.name = '海水蛙';
      }
    }
    // 自然衰減：依上次互動時間略降飢餓/心情
    if(islandPet && islandPet.lastSeen){
      const days = Math.max(0, (Date.now() - islandPet.lastSeen) / 86400000);
      if(days >= 0.2){
        islandPet.hunger = Math.max(0, (islandPet.hunger||50) - Math.floor(days*12));
        islandPet.mood = Math.max(0, (islandPet.mood||50) - Math.floor(days*8));
        islandPet.lastSeen = Date.now();
        savePet();
      }
    }
  }catch(e){ islandPet = null; }
}
function savePet(){
  if(!islandPet){ localStorage.removeItem(petStorageKey()); return; }
  islandPet.lastSeen = Date.now();
  localStorage.setItem(petStorageKey(), JSON.stringify(islandPet));
}
function petSpecies(id){
  return PET_SPECIES.find(s=>s.id===id) || PET_SPECIES[0];
}
function petLevel(exp){
  const e = Number(exp)||0;
  return Math.floor(e / 80) + 1;
}
function petExpInLevel(exp){
  const e = Number(exp)||0;
  return e % 80;
}
/** 寵物強度：與錯題數量、複習次數正相關（再加養成 EXP） */
function petStudyStats(){
  const list = Array.isArray(mistakes) ? mistakes : [];
  const mistakeCount = list.length;
  const reviewTotal = list.reduce((s,m)=> s + (Number(m.review_count)||0), 0);
  return { mistakeCount, reviewTotal };
}
function petPower(){
  loadPet();
  const { mistakeCount, reviewTotal } = petStudyStats();
  const exp = islandPet ? (Number(islandPet.exp)||0) : 0;
  // 基礎 10 + 每題錯題 2 + 每次複習 1 + 養成 EXP/10
  const power = 10 + mistakeCount * 2 + reviewTotal * 1 + Math.floor(exp / 10);
  return {
    power: Math.max(10, power),
    mistakeCount,
    reviewTotal,
    expBonus: Math.floor(exp / 10)
  };
}
function petMoodEmoji(p){
  if(!p) return '';
  const m = (p.mood||0);
  if(m >= 80) return '✨';
  if(m >= 50) return '😊';
  if(m >= 25) return '😐';
  return '💤';
}
function petSpeech(p){
  if(!p) return '在島上孵一顆蛋，開始你的夥伴旅程吧！';
  const sp = petSpecies(p.species);
  const lines = [];
  if((p.hunger||0) < 30) lines.push(`${sp.emoji} 肚子好餓…去完成主線任務可以拿點心！`);
  else if((p.mood||0) < 30) lines.push(`${sp.emoji} 有點無聊…摸我一下或去火山試煉吧！`);
  else if((p.bond||0) >= 80) lines.push(`${sp.emoji} 和你的羈絆好深，今天也一起登頂吧！`);
  else lines.push(`${sp.emoji} ${p.name} 準備好陪你複習了～`);
  return lines[Math.floor(Math.random()*lines.length)] || lines[0];
}
function adoptPet(speciesId, name){
  const sp = petSpecies(speciesId);
  islandPet = {
    species: sp.id,
    name: (name && name.trim()) || '海水蛙',
    exp: 0,
    bond: 20,
    hunger: 70,
    mood: 70,
    adoptedAt: new Date().toISOString().slice(0,10),
    lastSeen: Date.now(),
    lastFed: 0,
    lastPlay: 0
  };

  renderIslandPet();
  renderPetPanel();
}
function petGainExp(amount, reason){
  loadPet();
  if(!islandPet || !amount) return;
  islandPet.exp = (islandPet.exp||0) + amount;
  islandPet.bond = Math.min(100, (islandPet.bond||0) + Math.max(1, Math.floor(amount/15)));
  islandPet.mood = Math.min(100, (islandPet.mood||0) + Math.max(2, Math.floor(amount/10)));
  savePet();
  renderIslandPet();
  const el = document.getElementById('islandPet');
  if(el){ el.classList.remove('happy'); void el.offsetWidth; el.classList.add('happy'); }
}
function feedPet(){
  if(!islandPet) return;
  const now = Date.now();
  if(now - (islandPet.lastFed||0) < 30*60*1000){
    showPetToast('剛剛吃過了，再過一下子才能餵～');
    return;
  }
  islandPet.hunger = Math.min(100, (islandPet.hunger||0) + 25);
  islandPet.mood = Math.min(100, (islandPet.mood||0) + 8);
  islandPet.bond = Math.min(100, (islandPet.bond||0) + 3);
  islandPet.lastFed = now;
  savePet();
  renderIslandPet();
  renderPetPanel(true);
  showPetToast(`${islandPet.name} 吃得好開心！`);
}
function playWithPet(){

  const now = Date.now();

    showPetToast('玩累了，休息一下再陪我玩～');

  }
  islandPet.mood = Math.min(100, (islandPet.mood||0) + 18);
  islandPet.bond = Math.min(100, (islandPet.bond||0) + 5);
  islandPet.hunger = Math.max(0, (islandPet.hunger||0) - 6);

  islandPet.exp = (islandPet.exp||0) + 5;

  renderIslandPet();

/* ---------------- 考卷驛站：考卷登記 ---------------- */
const EXAM_LEVELS = [
  { id:'elementary', label:'國小' },
  { id:'junior', label:'國中' },
];
const EXAM_GRADES_ELE = ['一年級','二年級','三年級','四年級','五年級','六年級'];
const EXAM_GRADES_JUN = ['七年級','八年級','九年級'];
const EXAM_SEMESTERS = ['上學期','下學期'];
const EXAM_SUBJECTS = ['國文','英語','數學','自然','社會','健康與體育','藝術','綜合活動','科技','其他'];
const EXAM_ROUNDS = ['第一次段考','第二次段考','第三次段考','期末考','小考','模擬考','其他'];

function examStorageKey(){
  const uid = currentUser ? (currentUser.id || 'guest') : 'guest';
  return 'exams:' + uid;
}
function loadExams(){
  try{
    const raw = localStorage.getItem(examStorageKey());
    exams = raw ? JSON.parse(raw) : [];
    if(!Array.isArray(exams)) exams = [];
  }catch(e){ exams = []; }
}
function saveExams(){
  try{ localStorage.setItem(examStorageKey(), JSON.stringify(exams)); }
  catch(e){ console.error('儲存考卷失敗', e); }
}
function currentSchoolYearOptions(){
  // 民國學年度，以現在年份推算前後幾年
  const roc = new Date().getFullYear() - 1911;
  const years = [];
  for(let y = roc + 1; y >= roc - 6; y--) years.push(String(y));
  return years;
}
function gradesForLevel(level){
  return level === 'elementary' ? EXAM_GRADES_ELE : EXAM_GRADES_JUN;
}
function examDisplayTitle(e){
  return `${e.subject} · ${e.round}`;
}
function renderExamsPanel(){
  const panel = document.getElementById('examsPanel');
  if(!panel) return;
  loadExams();
  let list = exams.slice().sort((a,b)=>{
    const ya = Number(b.school_year)||0, yb = Number(a.school_year)||0;
    if(ya !== yb) return ya - yb;
    return (b.created_at||'').localeCompare(a.created_at||'');
  });
  if(examFilterYear !== 'all') list = list.filter(e=>String(e.school_year)===String(examFilterYear));
  if(examFilterSubject !== 'all') list = list.filter(e=>e.subject===examFilterSubject);
  const years = [...new Set(exams.map(e=>String(e.school_year)))].sort((a,b)=>Number(b)-Number(a));
  const subjects = [...new Set(exams.map(e=>e.subject))];

  panel.innerHTML = `
    <div class="panel">
      <div class="section-head">
        <h2>📜 考卷驛站</h2>
        <button type="button" class="solid-btn" id="toggleExamFormBtn">${examShowForm ? '－ 收起表單' : '＋ 登記考卷'}</button>
      </div>
      ${examShowForm ? examFormHTML() : ''}
      ${exams.length ? `
        <div class="chip-row">
          <button type="button" class="chip ${examFilterYear==='all'?'active':''}" data-eyear="all">全部學年</button>
          ${years.map(y=>`<button type="button" class="chip ${examFilterYear===y?'active':''}" data-eyear="${escapeHtml(y)}">${escapeHtml(y)} 學年</button>`).join('')}
        </div>
        <div class="chip-row">
          <button type="button" class="chip ${examFilterSubject==='all'?'active':''}" data-esub="all">全部科目</button>
          ${subjects.map(s=>`<button type="button" class="chip ${examFilterSubject===s?'active':''}" data-esub="${escapeHtml(s)}">${escapeHtml(s)}</button>`).join('')}
        </div>
      ` : ''}
      ${list.length === 0 ? `
        <div class="empty">
          <h2>${exams.length ? '這個篩選下沒有考卷' : '還沒有登記考卷'}</h2>
          <p>按上方「＋ 登記考卷」，選擇國中／國小、學年度、年級、學期、科目與段考次。</p>
        </div>
      ` : list.map(examCardHTML).join('')}
    </div>
  `;
  bindExamsPanelEvents();
}
function examFormHTML(){
  const years = currentSchoolYearOptions();
  const defaultYear = years[1] || years[0];
  return `
    <form class="vocab-form exam-form" id="examForm">
      ${examFormError ? `<div class="vocab-form-error">${escapeHtml(examFormError)}</div>` : ''}
      <div class="row2">
        <div class="field">
          <label>國中／國小</label>
          <select id="exLevel">
            ${EXAM_LEVELS.map(l=>`<option value="${l.id}">${l.label}</option>`).join('')}

        </div>
        <div class="field">
          <label>學年度（民國）</label>
          <select id="exYear">
            ${years.map(y=>`<option value="${y}" ${y===defaultYear?'selected':''}>${y} 學年度</option>`).join('')}

        </div>
      </div>
      <div class="row3">
        <div class="field">
          <label>年級</label>
          <select id="exGrade">
            ${gradesForLevel('junior').map(g=>`<option value="${g}">${g}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>學期</label>
          <select id="exSemester">
            ${EXAM_SEMESTERS.map(s=>`<option value="${s}">${s}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>段考次</label>
          <select id="exRound">
            ${EXAM_ROUNDS.map(r=>`<option value="${r}">${r}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>科目</label>
          <select id="exSubject">
            ${EXAM_SUBJECTS.map(s=>`<option value="${s}">${s}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>考試日期（選填）</label>
          <input type="date" id="exDate">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>得分（選填）</label>
          <input type="number" id="exScore" min="0" max="100" step="0.5" placeholder="例如 88">
        </div>
        <div class="field">
          <label>滿分（選填）</label>
          <input type="number" id="exFull" min="1" max="100" step="1" value="100" placeholder="100">

      </div>
      <div class="field">
        <label>備註（選填）</label>
        <input type="text" id="exNote" placeholder="例如：第 3～5 課、需訂正念法">
      </div>
      <div class="mistake-form-actions">
        <button type="button" class="ghost-btn" id="cancelExamFormBtn">取消</button>
        <button type="submit" class="solid-btn">登記考卷</button>
      </div>
    </form>
  `;
}
function examCardHTML(e){
  const levelLabel = (EXAM_LEVELS.find(l=>l.id===e.level)||{}).label || e.level || '';
  const scoreHtml = (e.score !== null && e.score !== '' && e.score !== undefined)
    ? `<div class="exam-score">${escapeHtml(String(e.score))}${e.full_score ? ' / '+escapeHtml(String(e.full_score)) : ' 分'}</div>`
    : '';
  return `
    <div class="exam-card" data-id="${escapeHtml(e.id)}">
      <div class="exam-title">${escapeHtml(examDisplayTitle(e))}</div>
      <div class="exam-meta">
        <span>${escapeHtml(levelLabel)}</span>
        <span>${escapeHtml(String(e.school_year))} 學年</span>
        <span>${escapeHtml(e.grade||'')}</span>
        <span>${escapeHtml(e.semester||'')}</span>
        <span>${escapeHtml(e.round||'')}</span>
        ${e.exam_date ? `<span>${escapeHtml(e.exam_date)}</span>` : ''}
      </div>
      ${scoreHtml}
      ${e.note ? `<p style="margin:8px 0 0;font-size:13px;color:#5A4A38;">${escapeHtml(e.note)}</p>` : ''}
      <div style="margin-top:10px;display:flex;justify-content:flex-end;">
        <button type="button" class="ghost-btn exam-del" data-id="${escapeHtml(e.id)}" style="color:var(--danger);border-color:var(--danger);padding:4px 10px;font-size:12px;">刪除</button>
      </div>
    </div>
  `;
}
function bindExamsPanelEvents(){
  document.getElementById('toggleExamFormBtn')?.addEventListener('click', ()=>{
    examShowForm = !examShowForm;
    examFormError = '';
    renderExamsPanel();
  });
  document.getElementById('cancelExamFormBtn')?.addEventListener('click', ()=>{
    examShowForm = false;
    examFormError = '';
    renderExamsPanel();
  });
  const levelSel = document.getElementById('exLevel');
  const gradeSel = document.getElementById('exGrade');
  if(levelSel && gradeSel){
    const syncGrades = ()=>{
      const grades = gradesForLevel(levelSel.value);
      gradeSel.innerHTML = grades.map(g=>`<option value="${g}">${g}</option>`).join('');
    };
    levelSel.addEventListener('change', syncGrades);
    // 預設國中 → 七年級已在 form；若改國小要同步
  }
  document.getElementById('examForm')?.addEventListener('submit', (ev)=>{
    ev.preventDefault();
    submitExamForm();
  });
  document.querySelectorAll('#examsPanel [data-eyear]').forEach(el=>{
    el.addEventListener('click', ()=>{ examFilterYear = el.dataset.eyear; renderExamsPanel(); });
  });
  document.querySelectorAll('#examsPanel [data-esub]').forEach(el=>{
    el.addEventListener('click', ()=>{ examFilterSubject = el.dataset.esub; renderExamsPanel(); });
  });
  document.querySelectorAll('#examsPanel .exam-del').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(!confirm('確定刪除這份考卷登記？')) return;
      exams = exams.filter(x=>x.id !== el.dataset.id);
      saveExams();
      renderExamsPanel();
    });
  });
}
function submitExamForm(){
  examFormError = '';
  const level = document.getElementById('exLevel')?.value;
  const school_year = document.getElementById('exYear')?.value;
  const grade = document.getElementById('exGrade')?.value;
  const semester = document.getElementById('exSemester')?.value;
  const subject = document.getElementById('exSubject')?.value;
  const round = document.getElementById('exRound')?.value;
  const exam_date = document.getElementById('exDate')?.value || '';
  const scoreRaw = document.getElementById('exScore')?.value;
  const fullRaw = document.getElementById('exFull')?.value;
  const note = (document.getElementById('exNote')?.value || '').trim();
  if(!level || !school_year || !grade || !semester || !subject || !round){
    examFormError = '請完整選擇國中／國小、學年度、年級、學期、科目與段考次';
    renderExamsPanel();
    return;
  }
  const score = scoreRaw === '' || scoreRaw === undefined ? null : Number(scoreRaw);
  const full_score = fullRaw === '' || fullRaw === undefined ? null : Number(fullRaw);
  const entry = {
    id: (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : ('ex-'+Date.now()),
    level, school_year, grade, semester, subject, round,
    exam_date, score, full_score, note,
    created_at: new Date().toISOString(),
    user_id: currentUser ? currentUser.id : 'guest'
  };
  exams.unshift(entry);
  saveExams();
  examShowForm = false;
  examFormError = '';
  renderExamsPanel();
  if(typeof showDailyToast === 'function'){

      return `<div class="${cls}"><span>${letter}.</span><span>${escapeHtml(opt)}</span>${correct?'<span class="tag">✓ 正確</span>':''}${mine&&!correct?'<span class="tag">✗ 我的答案</span>':''}</div>`;

  }else{
    body = `<div class="m-fill-ans">

    <div class="mistake-card" style="--tab-color:${color}">

/* ---------------- 圖片辨識文字（OCR） ---------------- */

function ensureTesseractLoaded(){
  if(window.Tesseract) return Promise.resolve();
  if(window.__tesseractLoadingPromise) return window.__tesseractLoadingPromise;
  window.__tesseractLoadingPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('無法載入辨識套件，請檢查網路連線'));
    document.head.appendChild(script);
  });
  return window.__tesseractLoadingPromise;
}

// 辨識前處理：轉灰階＋拉高對比，並將過小的照片放大，提升辨識率
function preprocessImageForOcr(file){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try{
        const MIN_DIM = 1600; // 目標最短邊長，太小的照片會放大到這個尺寸
        const longSide = Math.max(img.naturalWidth, img.naturalHeight);
        let scale = 1;
        if(longSide < MIN_DIM){
          scale = Math.min(3, MIN_DIM / longSide);
        }
        const w = Math.round(img.naturalWidth * scale);
        const h = Math.round(img.naturalHeight * scale);

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);

        const imageData = ctx.getImageData(0, 0, w, h);
        const data = imageData.data;
        const contrast = 32; // -255~255，數值越大對比越強；太高會讓筆劃複雜的字被吃掉細節
        const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
        for(let i=0; i<data.length; i+=4){
          const gray = 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
          const adjusted = Math.min(255, Math.max(0, factor * (gray - 128) + 128));
          data[i] = data[i+1] = data[i+2] = adjusted;
        }
        ctx.putImageData(imageData, 0, 0);

        canvas.toBlob((blob)=>{
          URL.revokeObjectURL(url);
          if(blob) resolve(blob); else reject(new Error('圖片處理失敗'));
        }, 'image/png');
      }catch(err){
        URL.revokeObjectURL(url);
        reject(err);
      }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('圖片讀取失敗')); };
    img.src = url;
  });
}

// 從 OCR 文字中拆出選項：偵測「(A)」「B.」「（C）」之類的選項標記，
// 標記之前的內容當題目，標記之間的內容分別填入對應選項
function extractOptionsFromOcrText(text, count){
  if(!count || !text) return null;
  const labels = OPTION_LABELS.slice(0, count);
  const markerRe = new RegExp('(?:^|[\\s\\n(（「])(' + labels.join('|') + ')[\\.\\)）」、:．]\\s*', 'g');
  const matches = [];
  let m;
  while((m = markerRe.exec(text))){
    matches.push({ label: m[1], index: m.index, markerEnd: markerRe.lastIndex });
  }
  if(matches.length < 2) return null;

  // 依序比對 A、B、C…，確保選項標記是照順序出現，避免誤判內文中的英文字母
  let expectedIdx = 0;
  const selected = [];
  for(const item of matches){
    if(item.label === labels[expectedIdx]){
      selected.push(item);
      expectedIdx++;
      if(expectedIdx >= labels.length) break;
    }
  }
  if(selected.length < 2) return null;

  const question = text.slice(0, selected[0].index).trim();
  const options = [];
  for(let i=0; i<selected.length; i++){
    const start = selected[i].markerEnd;
    const end = (i+1 < selected.length) ? selected[i+1].index : text.length;
    options.push(text.slice(start, end).trim());
  }
  while(options.length < count) options.push('');
  return { question, options };
}

// 去掉題目開頭的題號標記，例如「1. ( )」「12.（）」，那只是題號不是題目內容
// Tesseract 很容易漏掉左上引號「，右下引號」通常還在，靠這個規律把漏掉的「補回去：
// 由左到右掃描，遇到沒有配對開引號的」，就在「這個字所屬的那個片段」開頭（也就是上一個
// 分隔符號之後，例如 / 、 空白 或 開頭）補上一個「。這是用猜的，不保證 100% 正確。
function restoreMissingOpenQuotes(text){
  const DELIMS = new Set(['/', '／', '、', ',', '，', ' ', '\n', '\t', '(', '（', ')', '）', ':', '：']);
  let result = '';
  let openCount = 0;
  let segmentStart = 0; // result 目前長度中，「這一段」開頭的位置
  for(const ch of text){
    if(ch === '「'){
      openCount++;
      result += ch;
      segmentStart = result.length;
    }else if(ch === '」'){
      if(openCount > 0){
        openCount--;
        result += ch;
      }else{
        // 找不到配對的開引號，補在這一段的開頭
        result = result.slice(0, segmentStart) + '「' + result.slice(segmentStart) + ch;
      }
      segmentStart = result.length;
    }else{
      result += ch;
      if(DELIMS.has(ch)) segmentStart = result.length;
    }
  }
  return result;
}

function stripQuestionNumberMarker(text){
  return text.replace(/^\s*\d+\s*[.、．]\s*[(（「]\s*[)）」]\s*/, '').trim();
}

async function handleOcrFile(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('mOcrStatus');
  const ocrBtn = document.getElementById('mOcrBtn');
  const textarea = document.getElementById('mQuestion');
  const langSel = document.getElementById('mOcrLang');
  const enhanceEl = document.getElementById('mOcrEnhance');
  if(!statusEl || !textarea) return;

  const lang = (langSel && langSel.value) || 'chi_tra+eng';
  const useEnhance = !enhanceEl || enhanceEl.checked;
  ocrBtn.disabled = true;
  let worker = null;
  try{
    statusEl.textContent = '辨識套件載入中…';
    await ensureTesseractLoaded();

    let processedImage = file;
    if(useEnhance){
      statusEl.textContent = '圖片處理中…';
      processedImage = await preprocessImageForOcr(file);
    }

    statusEl.textContent = '辨識引擎初始化中…';
    worker = await window.Tesseract.createWorker(lang, 1, {
      logger: (info) => {
        if(info && info.status === 'recognizing text'){
          statusEl.textContent = `辨識中… ${Math.round((info.progress||0)*100)}%`;
        }else if(info && info.status){
          statusEl.textContent = info.status;
        }
      }
    });
    // 單一文字區塊模式，比自動版面分析更適合一整段題目文字
    await worker.setParameters({ tessedit_pageseg_mode: window.Tesseract.PSM.SINGLE_BLOCK });

    statusEl.textContent = '辨識中… 0%';
    const result = await worker.recognize(processedImage);
    const rawText = ((result && result.data && result.data.text) || '').trim();
    const text = stripQuestionNumberMarker(restoreMissingOpenQuotes(rawText));
    if(text){
      const isFillType = mistakeFormType === 'fill';
      const count = isFillType ? 0 : parseInt(mistakeFormType, 10);
      const extracted = !isFillType ? extractOptionsFromOcrText(text, count) : null;

      if(extracted){
        const combined = textarea.value.trim() ? (textarea.value.trim() + '\n' + extracted.question) : extracted.question;
        textarea.value = combined;
        mistakeFormDraft.question = combined;

        const optionInputs = document.querySelectorAll('.mOption');
        extracted.options.forEach((val, idx)=>{
          if(val && optionInputs[idx]) optionInputs[idx].value = val;
        });
        mistakeFormDraft.options = Array.from(optionInputs).map(i=>i.value);
        statusEl.textContent = '✓ 辨識完成，已自動拆分題目與選項，請檢查並修改';
      }else{
        const combined = textarea.value.trim() ? (textarea.value.trim() + '\n' + text) : text;
        textarea.value = combined;
        mistakeFormDraft.question = combined;
        statusEl.textContent = '✓ 辨識完成，請檢查並修改文字內容';
      }
    }else{
      statusEl.textContent = '沒有辨識到文字，換一張更清楚、光線更好的照片試試';
    }
  }catch(err){
    console.error('OCR 失敗', err);
    statusEl.textContent = '辨識失敗，請再試一次（' + (err.message||'') + '）';
  }finally{
    if(worker){ try{ await worker.terminate(); }catch(_e){} }
    ocrBtn.disabled = false;
    e.target.value = '';
  }
}

async function submitMistakeForm(e){
  e.preventDefault();
  const subject = document.getElementById('mSubject').value.trim();
  const question = document.getElementById('mQuestion').value.trim();
  const type = mistakeFormType;
  mistakeFormError = '';
  if(!question){ mistakeFormError = '請輸入題目內容'; renderMistakesPanel(); return; }

  let entry = { subject: subject || '未分類', question, type, user_id: currentUser.id, review_count:0, streak:0 };
  if(type === 'fill'){
    const myAnswer = document.getElementById('mMyAnswerFill').value.trim();
    const correctAnswer = document.getElementById('mCorrectAnswerFill').value.trim();
    if(!myAnswer || !correctAnswer){ mistakeFormError = '請填寫我寫的答案與正確答案'; renderMistakesPanel(); return; }
    entry.my_answer = myAnswer; entry.correct_answer = correctAnswer; entry.options = [];
  }else{
    const count = parseInt(type,10);
    const options = Array.from(document.querySelectorAll('.mOption')).map(i=>i.value.trim());
    if(options.some(o=>!o)){ mistakeFormError = '請填寫所有選項內容'; renderMistakesPanel(); return; }
    const myAnswer = document.getElementById('mMyAnswer').value;
    const correctAnswer = document.getElementById('mCorrectAnswer').value;
    if(!myAnswer || !correctAnswer){ mistakeFormError = '請選擇我寫的答案與正確答案'; renderMistakesPanel(); return; }
    entry.options = options.slice(0,count); entry.my_answer = myAnswer; entry.correct_answer = correctAnswer;
  }

  const { data, error } = await db.from('mistakes').insert(entry).select().single();
  if(error){ mistakeFormError = '新增失敗：' + error.message; renderMistakesPanel(); return; }
  mistakes.unshift(data);
  mistakeShowForm = false; mistakeFormDraft = {};
  renderMistakesPanel();
}

/* ---------------- 複習 ---------------- */


/* ---- 火山試煉塔：熱度與樓層 ---- */
function mistakeHeat(m){
  if(!m) return 0;
  if(isMastered(m)) return 0;
  let h = 55;
  h += Math.max(0, 25 - (Number(m.review_count)||0) * 4);
  h -= (Number(m.streak)||0) * 18;
  if((Number(m.streak)||0) === 0 && (Number(m.review_count)||0) > 0) h += 18;
  return Math.max(1, Math.min(100, Math.round(h)));
}
function heatFloor(heat){
  if(heat <= 0) return 0;
  if(heat >= 70) return 4;
  if(heat >= 45) return 3;
  if(heat >= 25) return 2;
  return 1;
}
const VOLCANO_FLOORS = [
  { id:4, name:'白熱層', icon:'⚪', desc:'C1–C2 高階單字', minHeat:70, play:'高階單字 BOSS' },
  { id:3, name:'熔岩層', icon:'🟠', desc:'B2 單字', minHeat:45, play:'中高階單字 BOSS' },
  { id:2, name:'赤紅層', icon:'🔴', desc:'B1 單字', minHeat:25, play:'中階單字 BOSS' },
  { id:1, name:'餘燼層', icon:'🟤', desc:'A1–A2 基礎單字', minHeat:1, play:'基礎單字 BOSS' },
];
function floorMeta(id){ return VOLCANO_FLOORS.find(f=>f.id===id); }
function mistakesOnFloor(floorId, pool){
  return (pool||[]).filter(m=>heatFloor(mistakeHeat(m)) === floorId);
}
function highestAvailableFloor(pool){
  for(const f of VOLCANO_FLOORS){
    if(mistakesOnFloor(f.id, pool).length) return f.id;
  }
  return 0;
}
/* 火山試煉改為英文單字 BOSS：樓層對應 CEFR */
function vocabFloorOf(v){
  const c = (v && v.cefr) || 'A1';
  if(c === 'C1' || c === 'C2') return 4;
  if(c === 'B2') return 3;
  if(c === 'B1') return 2;
  return 1; // A1 A2
}
function vocabOnFloor(floorId, pool){
  return (pool||[]).filter(v=>vocabFloorOf(v) === Number(floorId));
}
function highestVocabFloor(pool){
  for(const f of VOLCANO_FLOORS){
    if(vocabOnFloor(f.id, pool).length) return f.id;
  }
  return 0;
}
function lavaSecondsForVocab(v){
  const f = vocabFloorOf(v);
  return ({1:20,2:16,3:13,4:10})[f] || 15;
}
/** 單字 BOSS：中文題，四選一英文 */
function vocabBossChoices(correct){
  const others = vocab.filter(v=>v.id !== correct.id).map(v=>v.word);
  const pool = others.slice();
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const picks = pool.slice(0,3);
  while(picks.length < 3) picks.push('—');
  const opts = [correct.word, ...picks];
  for(let i=opts.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [opts[i],opts[j]]=[opts[j],opts[i]]; }
  return opts;
}

function volcanoStatus(pool, cooledCount){
  const hot = (pool||[]).filter(m=>!isMastered(m)).length;
  if(hot === 0 && cooledCount > 0) return { key:'dormant', label:'❄️ 休眠・成功登頂', line:'所有錯題已冷卻，火山進入休眠！' };
  if(hot <= 3) return { key:'cooling', label:'🧊 降溫中', line:'只剩最後幾題熱源，火山正在降溫…' };
  return { key:'active', label:'🔥 活躍', line:`火山活躍中・尚有 ${hot} 題未冷卻` };
}
function comboLabel(n){

  if(n >= 5) return '冰封 ×'+n;

}
function bossNameForFloor(floor){
  const map = {4:'白熱巨魔',3:'熔岩獸',2:'赤紅守衛',1:'餘燼幽靈'};

  return map[Number(floor)] || '熔岩魔';
}
/** BOSS 稀有度：普通／稀有／史詩／傳說 */
const BOSS_RARITIES = [
  { id:'common',  label:'普通',  weight:50, hpMul:1.0,  atkMul:1.0, rageMul:1.0, color:'#C4A574', stars:'★' },
  { id:'rare',    label:'稀有',  weight:30, hpMul:1.35, atkMul:1.2, rageMul:1.1, color:'#5B9BD5', stars:'★★' },
  { id:'epic',    label:'史詩',  weight:15, hpMul:1.7,  atkMul:1.45,rageMul:1.25,color:'#9B6BFF', stars:'★★★' },
  { id:'legend',  label:'傳說',  weight:5,  hpMul:2.2,  atkMul:1.8, rageMul:1.4, color:'#FFB020', stars:'★★★★' },
];
function rollBossRarity(){
  const total = BOSS_RARITIES.reduce((s,r)=>s+r.weight,0);
  let n = Math.random()*total;
  for(const r of BOSS_RARITIES){
    n -= r.weight;
    if(n <= 0) return r;
  }
  return BOSS_RARITIES[0];
}
function shuffleIds(ids){
  const a = ids.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
/** 戰鬥越久 BOSS 越強：每 3 回合升一級 */
function bossPhase(session){
  const turns = session.turnCount || 0;
  return Math.floor(turns / 3); // 0,1,2...
}
function bossAtkScale(session){
  const rarity = session.bossRarity || BOSS_RARITIES[0];
  const phase = bossPhase(session);
  return (rarity.atkMul || 1) * (1 + phase * 0.18);
}
function bossRageScale(session){
  const rarity = session.bossRarity || BOSS_RARITIES[0];
  const phase = bossPhase(session);
  return (rarity.rageMul || 1) * (1 + phase * 0.1);
}

function startLavaTimer(){
  clearLavaTimer();

    const left = leftMs / 1000;
    const fill = document.getElementById('lavaTimerFill');
    const lab = document.getElementById('lavaTimerLabel');
    const pct = Math.max(0, Math.min(100, (left / total) * 100));
    if(fill){

      clearLavaTimer();
      if(!reviewSession.revealed){
        reviewSession.picked = null;

        revealReviewAnswer();

    }
  };
  tick();

function ensureBossQueue(){

    ? reviewSession.poolIds

  reviewSession.queue = (reviewSession.queue||[]).concat(shuffleIds(pool));

function bindReviewSessionEvents(){
