/* ---------------- 圖片辨識文字（OCR） ---------------- */

function ensureTesseractLoaded(){
  if(window.Tesseract) return Promise.resolve();
  if(window.__tesseractLoadingPromise) return window.__tesseractLoadingPromise;
  window.__tesseractLoadingPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('無法載入辨識套件，請檢查網路連線'));
    document.head.appendChild(script);
  });
  return window.__tesseractLoadingPromise;
}

// 辨識前處理：轉灰階＋拉高對比，並將過小的照片放大，提升辨識率
function preprocessImageForOcr(file){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try{
        const MIN_DIM = 1600; // 目標最短邊長，太小的照片會放大到這個尺寸
        const longSide = Math.max(img.naturalWidth, img.naturalHeight);
        let scale = 1;
        if(longSide < MIN_DIM){
          scale = Math.min(3, MIN_DIM / longSide);
        }
        const w = Math.round(img.naturalWidth * scale);
        const h = Math.round(img.naturalHeight * scale);

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);

        const imageData = ctx.getImageData(0, 0, w, h);
        const data = imageData.data;
        const contrast = 32; // -255~255，數值越大對比越強；太高會讓筆劃複雜的字被吃掉細節
        const factor = (259 * (contrast + 255)) / (255 * (259 - contrast));
        for(let i=0; i<data.length; i+=4){
          const gray = 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
          const adjusted = Math.min(255, Math.max(0, factor * (gray - 128) + 128));
          data[i] = data[i+1] = data[i+2] = adjusted;
        }
        ctx.putImageData(imageData, 0, 0);

        canvas.toBlob((blob)=>{
          URL.revokeObjectURL(url);
          if(blob) resolve(blob); else reject(new Error('圖片處理失敗'));
        }, 'image/png');
      }catch(err){
        URL.revokeObjectURL(url);
        reject(err);
      }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('圖片讀取失敗')); };
    img.src = url;
  });
}

// 從 OCR 文字中拆出選項：偵測「(A)」「B.」「（C）」之類的選項標記，
// 標記之前的內容當題目，標記之間的內容分別填入對應選項
function extractOptionsFromOcrText(text, count){
  if(!count || !text) return null;
  const labels = OPTION_LABELS.slice(0, count);
  const markerRe = new RegExp('(?:^|[\\s\\n(（「])(' + labels.join('|') + ')[\\.\\)）」、:．]\\s*', 'g');
  const matches = [];
  let m;
  while((m = markerRe.exec(text))){
    matches.push({ label: m[1], index: m.index, markerEnd: markerRe.lastIndex });
  }
  if(matches.length < 2) return null;

  // 依序比對 A、B、C…，確保選項標記是照順序出現，避免誤判內文中的英文字母
  let expectedIdx = 0;
  const selected = [];
  for(const item of matches){
    if(item.label === labels[expectedIdx]){
      selected.push(item);
      expectedIdx++;
      if(expectedIdx >= labels.length) break;
    }
  }
  if(selected.length < 2) return null;

  const question = text.slice(0, selected[0].index).trim();
  const options = [];
  for(let i=0; i<selected.length; i++){
    const start = selected[i].markerEnd;
    const end = (i+1 < selected.length) ? selected[i+1].index : text.length;
    options.push(text.slice(start, end).trim());
  }
  while(options.length < count) options.push('');
  return { question, options };
}

// 去掉題目開頭的題號標記，例如「1. ( )」「12.（）」，那只是題號不是題目內容
// Tesseract 很容易漏掉左上引號「，右下引號」通常還在，靠這個規律把漏掉的「補回去：
// 由左到右掃描，遇到沒有配對開引號的」，就在「這個字所屬的那個片段」開頭（也就是上一個
// 分隔符號之後，例如 / 、 空白 或 開頭）補上一個「。這是用猜的，不保證 100% 正確。
function restoreMissingOpenQuotes(text){
  const DELIMS = new Set(['/', '／', '、', ',', '，', ' ', '\n', '\t', '(', '（', ')', '）', ':', '：']);
  let result = '';
  let openCount = 0;
  let segmentStart = 0; // result 目前長度中，「這一段」開頭的位置
  for(const ch of text){
    if(ch === '「'){
      openCount++;
      result += ch;
      segmentStart = result.length;
    }else if(ch === '」'){
      if(openCount > 0){
        openCount--;
        result += ch;
      }else{
        // 找不到配對的開引號，補在這一段的開頭
        result = result.slice(0, segmentStart) + '「' + result.slice(segmentStart) + ch;
      }
      segmentStart = result.length;
    }else{
      result += ch;
      if(DELIMS.has(ch)) segmentStart = result.length;
    }
  }
  return result;
}

function stripQuestionNumberMarker(text){
  return text.replace(/^\s*\d+\s*[.、．]\s*[(（「]\s*[)）」]\s*/, '').trim();
}

async function handleOcrFile(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('mOcrStatus');
  const ocrBtn = document.getElementById('mOcrBtn');
  const textarea = document.getElementById('mQuestion');
  const langSel = document.getElementById('mOcrLang');
  const enhanceEl = document.getElementById('mOcrEnhance');
  if(!statusEl || !textarea) return;

  const lang = (langSel && langSel.value) || 'chi_tra+eng';
  const useEnhance = !enhanceEl || enhanceEl.checked;
  ocrBtn.disabled = true;
  let worker = null;
  try{
    statusEl.textContent = '辨識套件載入中…';
    await ensureTesseractLoaded();

    let processedImage = file;
    if(useEnhance){
      statusEl.textContent = '圖片處理中…';
      processedImage = await preprocessImageForOcr(file);
    }

    statusEl.textContent = '辨識引擎初始化中…';
    worker = await window.Tesseract.createWorker(lang, 1, {
      logger: (info) => {
        if(info && info.status === 'recognizing text'){
          statusEl.textContent = `辨識中… ${Math.round((info.progress||0)*100)}%`;
        }else if(info && info.status){
          statusEl.textContent = info.status;
        }
      }
    });
    // 單一文字區塊模式，比自動版面分析更適合一整段題目文字
    await worker.setParameters({ tessedit_pageseg_mode: window.Tesseract.PSM.SINGLE_BLOCK });

    statusEl.textContent = '辨識中… 0%';
    const result = await worker.recognize(processedImage);
    const rawText = ((result && result.data && result.data.text) || '').trim();
    const text = stripQuestionNumberMarker(restoreMissingOpenQuotes(rawText));
    if(text){
      const isFillType = mistakeFormType === 'fill';
      const count = isFillType ? 0 : parseInt(mistakeFormType, 10);
      const extracted = !isFillType ? extractOptionsFromOcrText(text, count) : null;

      if(extracted){
        const combined = textarea.value.trim() ? (textarea.value.trim() + '\n' + extracted.question) : extracted.question;
        textarea.value = combined;
        mistakeFormDraft.question = combined;

        const optionInputs = document.querySelectorAll('.mOption');
        extracted.options.forEach((val, idx)=>{
          if(val && optionInputs[idx]) optionInputs[idx].value = val;
        });
        mistakeFormDraft.options = Array.from(optionInputs).map(i=>i.value);
        statusEl.textContent = '✓ 辨識完成，已自動拆分題目與選項，請檢查並修改';
      }else{
        const combined = textarea.value.trim() ? (textarea.value.trim() + '\n' + text) : text;
        textarea.value = combined;
        mistakeFormDraft.question = combined;
        statusEl.textContent = '✓ 辨識完成，請檢查並修改文字內容';
      }
    }else{
      statusEl.textContent = '沒有辨識到文字，換一張更清楚、光線更好的照片試試';
    }
  }catch(err){
    console.error('OCR 失敗', err);
    statusEl.textContent = '辨識失敗，請再試一次（' + (err.message||'') + '）';
  }finally{
    if(worker){ try{ await worker.terminate(); }catch(_e){} }
    ocrBtn.disabled = false;
    e.target.value = '';
  }
}

async function submitMistakeForm(e){
  e.preventDefault();
  const subject = document.getElementById('mSubject').value.trim();
  const question = document.getElementById('mQuestion').value.trim();
  const type = mistakeFormType;
  mistakeFormError = '';
  if(!question){ mistakeFormError = '請輸入題目內容'; renderMistakesPanel(); return; }

  let entry = { subject: subject || '未分類', question, type, user_id: currentUser.id, review_count:0, streak:0 };
  if(type === 'fill'){
    const myAnswer = document.getElementById('mMyAnswerFill').value.trim();
    const correctAnswer = document.getElementById('mCorrectAnswerFill').value.trim();
    if(!myAnswer || !correctAnswer){ mistakeFormError = '請填寫我寫的答案與正確答案'; renderMistakesPanel(); return; }
    entry.my_answer = myAnswer; entry.correct_answer = correctAnswer; entry.options = [];
  }else{
    const count = parseInt(type,10);
    const options = Array.from(document.querySelectorAll('.mOption')).map(i=>i.value.trim());
    if(options.some(o=>!o)){ mistakeFormError = '請填寫所有選項內容'; renderMistakesPanel(); return; }
    const myAnswer = document.getElementById('mMyAnswer').value;
    const correctAnswer = document.getElementById('mCorrectAnswer').value;
    if(!myAnswer || !correctAnswer){ mistakeFormError = '請選擇我寫的答案與正確答案'; renderMistakesPanel(); return; }
    entry.options = options.slice(0,count); entry.my_answer = myAnswer; entry.correct_answer = correctAnswer;
  }

  const { data, error } = await db.from('mistakes').insert(entry).select().single();
  if(error){ mistakeFormError = '新增失敗：' + error.message; renderMistakesPanel(); return; }
  mistakes.unshift(data);
  mistakeShowForm = false; mistakeFormDraft = {};
  renderMistakesPanel();
}

/* ---------------- 複習 ---------------- */

function renderReviewPanel(){
  const panel = document.getElementById('reviewPanel');
  if(reviewSession){ panel.innerHTML = `<div class="panel">${reviewSessionHTML()}</div>`; bindReviewSessionEvents(); return; }

  const subs = mistakeSubjects();
  const pool = reviewSubjectFilter === 'all' ? mistakes : mistakes.filter(m=>m.subject===reviewSubjectFilter);
  const eligible = reviewOnlyUnmastered ? pool.filter(m=>!isMastered(m)) : pool;

  panel.innerHTML = `
    <div class="panel review-setup-card">
      <h2 style="font-family:'Fraunces',serif;margin:0 0 4px;">開始複習</h2>
      <p>選擇要複習的科目範圍，逐題作答並立刻看到對錯</p>
      <div class="chip-row" style="justify-content:center;">
        <button type="button" class="chip ${reviewSubjectFilter==='all'?'active':''}" data-subject="all">全部科目</button>
        ${subs.map(s=>`<button type="button" class="chip ${reviewSubjectFilter===s?'active':''}" data-subject="${escapeHtml(s)}">${escapeHtml(s)}</button>`).join('')}
      </div>
      <div class="review-toggle">
        <input type="checkbox" id="onlyUnmasteredChk" ${reviewOnlyUnmastered?'checked':''}>
        <label for="onlyUnmasteredChk">只複習尚未熟練的題目</label>
      </div>
      ${eligible.length === 0 ? `
        <div class="empty"><h2>目前沒有可複習的題目</h2><p>試試切換篩選條件，或先去「錯題本」新增一些題目。</p></div>
      ` : `<button type="button" class="solid-btn" id="startReviewBtn">開始複習（共 ${eligible.length} 題）</button>`}
    </div>
  `;
  document.querySelectorAll('#reviewPanel .chip').forEach(el=>{
    el.addEventListener('click', ()=>{ reviewSubjectFilter = el.dataset.subject; renderReviewPanel(); });
  });
  const chk = document.getElementById('onlyUnmasteredChk');
  if(chk) chk.addEventListener('change', (e)=>{ reviewOnlyUnmastered = e.target.checked; renderReviewPanel(); });
  const startBtn = document.getElementById('startReviewBtn');
  if(startBtn) startBtn.addEventListener('click', startReviewSession);
}

function startReviewSession(){
  const pool = reviewSubjectFilter === 'all' ? mistakes : mistakes.filter(m=>m.subject===reviewSubjectFilter);
  const eligible = reviewOnlyUnmastered ? pool.filter(m=>!isMastered(m)) : pool;
  const queue = eligible.map(m=>m.id);
  for(let i=queue.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [queue[i],queue[j]]=[queue[j],queue[i]]; }
  reviewSession = { queue, idx:0, correctCount:0, picked:null, revealed:false, lastCorrect:false };
  renderReviewPanel();
}

function reviewSessionHTML(){
  const total = reviewSession.queue.length;
  if(reviewSession.idx >= total){
    const correct = reviewSession.correctCount;
    return `
      <div class="flash-wrap">
        <div class="summary-card">
          <span class="subject-tag">複習結果</span>
          <div class="score">${correct} <span>/ ${total}</span></div>
          <p style="color:var(--ink-soft);font-size:13.5px;">答對率 ${total?Math.round(correct/total*100):0}%</p>
          <div class="flash-actions" style="justify-content:center;margin-top:16px;">
            <button type="button" class="ghost-btn" id="backToSetupBtn">回到設定</button>
            <button type="button" class="solid-btn" id="restartReviewBtn">再複習一次</button>
          </div>
        </div>
      </div>`;
  }
  const m = mistakes.find(x=>x.id===reviewSession.queue[reviewSession.idx]);
  if(!m){ reviewSession.idx++; return reviewSessionHTML(); }
  const revealed = reviewSession.revealed;

  let bodyHtml = '';
  if(m.type !== 'fill'){
    bodyHtml = (m.options||[]).map((opt,i)=>{
      const letter = OPTION_LABELS[i];
      let cls = 'choice-btn';
      if(revealed){
        if(letter === m.correct_answer) cls += ' reveal-correct';
        else if(letter === reviewSession.picked) cls += ' reveal-wrong';
      }else if(letter === reviewSession.picked) cls += ' picked';
      return `<button type="button" class="${cls}" data-letter="${letter}" ${revealed?'disabled':''}><span>${letter}.</span><span>${escapeHtml(opt)}</span></button>`;
    }).join('');
  }else{
    bodyHtml = `<input type="text" class="fill-answer-input" id="fillAnswerInput" placeholder="輸入你的答案" ${revealed?'disabled':''} value="${revealed?escapeHtml(reviewSession.picked||''):''}">`;
  }

  let resultHtml = '';
  if(revealed){
    resultHtml = `
      <div class="result-banner ${reviewSession.lastCorrect?'ok':'no'}">${reviewSession.lastCorrect?'✓ 答對了':'✗ 答錯了'}</div>
      ${m.type==='fill' ? `<div class="correct-line">正確答案：<b>${escapeHtml(m.correct_answer)}</b></div>` : ''}
    `;
  }

  return `
    <div class="flash-wrap">
      <div class="flash-progress"><span>第 ${reviewSession.idx+1} / ${total} 題</span><span>答對 ${reviewSession.correctCount} 題</span></div>
      <div class="flash-bar"><div class="fill" style="width:${(reviewSession.idx/total*100)}%"></div></div>
      <div class="flashcard">
        <span class="subject-tag">${escapeHtml(m.subject||'未分類')}</span>
        <div class="m-question">${escapeHtml(m.question)}</div>
        ${bodyHtml}
        ${resultHtml}
        <div class="flash-actions">
          ${m.type==='fill' && !revealed ? `<button type="button" class="solid-btn" id="submitFillBtn">送出答案</button>` : ''}
          ${revealed ? `<button type="button" class="solid-btn" id="nextCardBtn">${reviewSession.idx+1>=total?'查看結果':'下一題'}</button>` : ''}
        </div>
      </div>
    </div>
  `;
}

function bindReviewSessionEvents(){
  document.querySelectorAll('#reviewPanel .choice-btn').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(reviewSession.revealed) return;
      reviewSession.picked = el.dataset.letter;
      revealReviewAnswer();
    });
  });
  const submitFillBtn = document.getElementById('submitFillBtn');
  if(submitFillBtn) submitFillBtn.addEventListener('click', ()=>{
    const input = document.getElementById('fillAnswerInput');
    reviewSession.picked = input ? input.value.trim() : '';
    revealReviewAnswer();
  });
  const fillInput = document.getElementById('fillAnswerInput');
  if(fillInput) fillInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); submitFillBtn?.click(); } });
  const nextBtn = document.getElementById('nextCardBtn');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{
    reviewSession.idx++; reviewSession.revealed = false; reviewSession.picked = null;
    renderReviewPanel();
  });
  const backBtn = document.getElementById('backToSetupBtn');
  if(backBtn) backBtn.addEventListener('click', ()=>{ reviewSession = null; renderReviewPanel(); });
  const restartBtn = document.getElementById('restartReviewBtn');
  if(restartBtn) restartBtn.addEventListener('click', startReviewSession);
}

async function revealReviewAnswer(){
  const m = mistakes.find(x=>x.id===reviewSession.queue[reviewSession.idx]);
  let correct;
  if(m.type === 'fill'){
    correct = (reviewSession.picked||'').trim().toLowerCase() === (m.correct_answer||'').trim().toLowerCase();
  }else{
    correct = reviewSession.picked === m.correct_answer;
  }
  reviewSession.revealed = true;
  reviewSession.lastCorrect = correct;
  if(correct){ reviewSession.correctCount++; m.streak = (m.streak||0) + 1; } else { m.streak = 0; }
  m.review_count = (m.review_count||0) + 1;
  renderReviewPanel();
  const { error } = await db.from('mistakes').update({ review_count:m.review_count, streak:m.streak }).eq('id', m.id);
  if(error) console.error('更新複習紀錄失敗', error);
}

function cumulativeFor(bookId){
  const list = (entriesByBook[bookId]||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  let sum = 0;
  return list.map(e=>{ sum += Number(e.pages)||0; return {...e, cum:sum}; });
}
function totalFor(bookId){
  return (entriesByBook[bookId]||[]).reduce((s,e)=>s+(Number(e.pages)||0),0);
}

// 從「起始頁」「結束頁」兩個欄位算出實際寫了幾頁
// 只填起始頁 = 1 頁；起訖都填 = 終-起+1 頁（自動處理順序顛倒）
function parsePageRange(startRaw, endRaw){
  const startStr = String(startRaw||'').trim();
  const endStr = String(endRaw||'').trim();
  if(startStr === '') return null;
  const startNum = Number(startStr);
  if(!Number.isFinite(startNum) || startNum <= 0) return null;

  if(endStr === ''){
    return { pages: 1, rangeLabel: `第${startNum}頁`, start: startNum, end: startNum };
  }
  const endNum = Number(endStr);
  if(!Number.isFinite(endNum) || endNum <= 0) return null;
  const start = Math.min(startNum, endNum), end = Math.max(startNum, endNum);
  return { pages: end - start + 1, rangeLabel: `第${start}~${end}頁`, start, end };
}

// 把某本書「目前所有紀錄」的頁碼區間合併成互不重疊、由小到大排序的區間陣列
// excludeEntryId：如果是在編輯某一筆舊紀錄，記得排除自己，不然會跟自己重疊
function mergedRangesFor(bookId, excludeEntryId){
  const ranges = (entriesByBook[bookId]||[])
    .filter(e => e.id !== excludeEntryId && Number.isFinite(e.page_start) && Number.isFinite(e.page_end))
    .map(e => [e.page_start, e.page_end])
    .sort((a,b)=>a[0]-b[0]);
  const merged = [];
  for(const [s,e] of ranges){
    const last = merged[merged.length-1];
    if(last && s <= last[1] + 1){ last[1] = Math.max(last[1], e); }
    else{ merged.push([s,e]); }
  }
  return merged;
}

// 用「已經寫過的區間」去扣掉這次新輸入的 start~end，算出真正「新寫的頁數」跟「重疊掉的頁數」
function subtractWrittenRanges(start, end, mergedRanges){
  let segments = [[start,end]];
  for(const [rs,re] of mergedRanges){
    const next = [];
    for(const [s,e] of segments){
      if(re < s || rs > e){ next.push([s,e]); continue; } // 完全沒重疊
      if(s < rs) next.push([s, rs-1]);
      if(e > re) next.push([re+1, e]);
    }
    segments = next;
  }
  const totalPages = end - start + 1;
  const newPages = segments.reduce((sum,[s,e])=>sum + (e-s+1), 0);
  return { newPages, overlappedPages: totalPages - newPages, totalPages };
}

// 產生「逐頁長條圖」：目標頁數是幾頁就畫幾格、排成一整條，只有寫過的頁碼格子會被填色（顏色跟該科目一致）
function pageGridHTML(bookId, target, color, extraClass){
  const merged = mergedRangesFor(bookId);
  const isWritten = (p) => merged.some(([s,e]) => p>=s && p<=e);

  const cellCount = target>0 ? target : (merged.length ? merged[merged.length-1][1] : 0);
  if(cellCount <= 0){
    return `<div class="page-grid-empty">還沒有可顯示的頁碼，記錄後會自動畫出進度條。</div>`;
  }
  const cells = Array.from({length:cellCount}).map((_,i)=>{
    const p = i+1;
    return `<span class="page-cell ${isWritten(p)?'filled':''}" title="第${p}頁"></span>`;
  }).join('');
  return `<div class="page-grid ${extraClass||''}" style="--cell-color:${color}">${cells}</div>`;
}

/* ---------------- Rendering ---------------- */

function flipAnimateOverviewCards(prevRects){
  const cards = Array.from(document.querySelectorAll('.overview-card'));
  if(cards.length === 0) return;

  cards.forEach(el=>{
    const id = el.dataset.id;
    const prev = prevRects[id];
    if(!prev) return; // 新卡片，不做位移動畫
    const next = el.getBoundingClientRect();
    const dx = prev.left - next.left;
    const dy = prev.top - next.top;
    if(Math.abs(dx) < 1 && Math.abs(dy) < 1) return; // 位置沒變，不用動畫

    // 先移除可能殘留的動畫 class，確保能重新觸發
    el.classList.remove('reorder-move');
    el.style.setProperty('--dx', dx + 'px');
    el.style.setProperty('--dy', dy + 'px');
    void el.offsetWidth; // 強制 reflow，確保上面的移除/變數設定先生效
    el.classList.add('reorder-move');

    el.addEventListener('animationend', function handler(){
      el.classList.remove('reorder-move');
      el.style.removeProperty('--dx');
      el.style.removeProperty('--dy');
      el.removeEventListener('animationend', handler);
    });
  });
}

function render(){
  const app = document.getElementById('appPanel');
  checkAchievements();

  const prevCardRects = {};
  app.querySelectorAll('.overview-card').forEach(el=>{
    prevCardRects[el.dataset.id] = el.getBoundingClientRect();
  });

  if(books.length === 0){
    app.innerHTML = `
      <div class="layout">
        <aside class="shelf">
          <h2>書目 / 科目</h2>
          <div class="add-book">${addBookFormHTML()}</div>
        </aside>
        <div class="panel">
          <div class="empty">
            <h2>還沒有任何一本書</h2>
            <p>從左側新增你正在寫的參考書或科目，開始記錄每天寫的頁數。</p>
          </div>
        </div>
      </div>`;
    bindAddBook();
    return;
  }

  if(!activeBookId || !books.find(b=>b.id===activeBookId)){
    activeBookId = books[0].id;
  }
  const active = books.find(b=>b.id===activeBookId);
  const activeColor = PALETTE[books.findIndex(b=>b.id===active.id) % PALETTE.length];
  const total = totalFor(active.id);
  const target = Number(active.target)||0;
  const pctExact = target>0 ? Math.min(100, (total/target)*100) : 0;
  const pct = Math.round(pctExact);
  const rows = cumulativeFor(active.id).slice().reverse();

  app.innerHTML = `
    <div class="overview">
      <div class="overview-head">
        <h2>進度總覽</h2>
        <div class="overview-badges">
          <span class="today-total">今天總共寫了 <b>${todayTotalPages()}</b> 頁</span>
          <span class="today-total grand-total">累計總頁數 <b>${overallStats().totalPagesAll}</b> 頁</span>
        </div>
      </div>
      <div class="overview-grid">
        ${books.map((b,i)=>{
          const t = totalFor(b.id); const tg = Number(b.target)||0;
          const pExact = tg>0 ? Math.min(100, (t/tg)*100) : 0;
          return { b, i, t, tg, pExact };
        }).sort((x,y)=> y.pExact - x.pExact).map(({b,i,t,tg,pExact})=>{
          const p = Math.round(pExact);
          const color = PALETTE[i % PALETTE.length];
          return `<button class="overview-card ${b.id===active.id?'active':''}" style="--tab-color:${color}" data-id="${b.id}">
            <span class="name">${escapeHtml(b.name)}</span>
            ${tg>0 ? `
              <span class="num">已寫 <b>${t}</b> / ${tg} 頁</span>
              ${pageGridHTML(b.id, tg, color, 'compact')}
              <span class="num">完成 <b>${p}%</b></span>
            ` : `<span class="no-target">已寫 ${t} 頁・尚未設目標</span>`}
          </button>`;
        }).join('')}
      </div>
    </div>
    <div class="layout">
      <aside class="shelf">
        <h2>書目 / 科目</h2>
        ${books.map((b,i)=>{
          const t = totalFor(b.id); const tg = Number(b.target)||0;
          const p = tg>0 ? Math.min(100, Math.round((t/tg)*100)) : 0;
          const color = PALETTE[i % PALETTE.length];
          return `<button class="book-tab ${b.id===active.id?'active':''}" style="--tab-color:${color}" data-id="${b.id}">
            <span class="name">${escapeHtml(b.name)}</span>
            <span class="pct">${tg>0 ? p+'%' : t+'頁'}</span>
          </button>`;
        }).join('')}
        <div class="add-book">${addBookFormHTML()}</div>
      </aside>

      <div class="panel">
        <div class="panel-head">
          <h2>${escapeHtml(active.name)}</h2>
          <div class="target-edit">
            目標頁數
            <input type="number" min="0" id="targetInput" value="${target||''}" placeholder="未設定">
            <button class="delete-book" id="delBookBtn">刪除此書</button>
          </div>
        </div>

        <div class="ruler">
          <div class="stats">
            <span>已寫 <b>${total}</b> 頁</span>
            <span>${target>0 ? `目標 <b>${target}</b> 頁・完成 <b>${pct}%</b>` : '尚未設定目標頁數'}</span>
          </div>
          ${pageGridHTML(active.id, target, activeColor)}
        </div>

        <form class="entry-form" id="entryForm">
          <div class="field">
            <label>日期</label>
            <input type="date" id="entryDate" value="${todayStr()}" required>
          </div>
          <div class="field">
            <label>今天寫了第幾頁</label>
            <div class="page-range">
              <input type="number" min="1" id="entryPageStart" placeholder="從">
              <span class="tilde">~</span>
              <input type="number" min="1" id="entryPageEnd" placeholder="到（選填）">
            </div>
            <div class="field-hint">只填「從」＝寫1頁；兩個都填會自動算頁數</div>
          </div>
          <div class="field">
            <label>備註（選填）</label>
            <input type="text" id="entryNote" placeholder="例如：第三章草稿">
          </div>
          <button type="submit" class="submit">記錄</button>
        </form>

        ${rows.length===0 ? `<div class="empty"><p>還沒有紀錄，開始寫下今天的頁數吧。</p></div>` : `
        <table class="ledger">
          <thead><tr><th>日期</th><th>當日頁數</th><th>累計頁數</th><th>備註</th><th></th></tr></thead>
          <tbody>
            ${rows.map(r=>`
              <tr>
                <td>${r.date}</td>
                <td>${r.pages}</td>
                <td>${r.cum}</td>
                <td class="note">${escapeHtml(r.note||'')}</td>
                <td><button class="del" data-entry="${r.id}">刪除</button></td>
              </tr>`).join('')}
          </tbody>
        </table>`}
      </div>
    </div>
  `;

  flipAnimateOverviewCards(prevCardRects);

  bindAddBook();
  document.querySelectorAll('.book-tab').forEach(el=>{
    el.addEventListener('click', ()=>{ activeBookId = el.dataset.id; render(); });
  });
  document.querySelectorAll('.overview-card').forEach(el=>{
    el.addEventListener('click', ()=>{ activeBookId = el.dataset.id; render(); });
  });
  document.getElementById('targetInput').addEventListener('change', async (e)=>{
    const val = e.target.value === '' ? null : Number(e.target.value);
    const { error } = await db.from('books').update({ target: val }).eq('id', active.id);
    if(error){ alert('更新失敗：' + error.message); return; }
    active.target = val;
    render();
  });
  document.getElementById('delBookBtn').addEventListener('click', async ()=>{
    if(!confirm(`確定要刪除「${active.name}」以及它的所有紀錄嗎？此動作無法復原。`)) return;
    const { error } = await db.from('books').delete().eq('id', active.id);
    if(error){ alert('刪除失敗：' + error.message); return; }
    books = books.filter(b=>b.id!==active.id);
    delete entriesByBook[active.id];
    activeBookId = books[0]?.id || null;
    render();
  });
document.getElementById('entryForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const date = document.getElementById('entryDate').value;
    const pageStart = document.getElementById('entryPageStart').value;
    const pageEnd = document.getElementById('entryPageEnd').value;
    if(!date) return;
    const parsed = parsePageRange(pageStart, pageEnd);
    if(!parsed || parsed.pages <= 0){
      alert('頁數欄位看不懂，請至少填「從」，例如從15到20');
      return;
    }

    // 檢查這個範圍裡有沒有頁數是「之前已經寫過」的，已經寫過的不重複計算
    const merged = mergedRangesFor(active.id);
    const { newPages, overlappedPages } = subtractWrittenRanges(parsed.start, parsed.end, merged);
    if(newPages <= 0){
      alert(`${parsed.rangeLabel}都已經寫過了，這次不會重複計算頁數，所以沒有新增紀錄。`);
      return;
    }

    let label = parsed.rangeLabel;
    if(overlappedPages > 0){
      label += `（其中${overlappedPages}頁已寫過，只算${newPages}頁新進度）`;
    }
    let note = document.getElementById('entryNote').value.trim();
    note = note ? `${label}・${note}` : label;

    const { data, error } = await db.from('entries')
      .insert({ book_id: active.id, user_id: currentUser.id, date, pages: newPages, page_start: parsed.start, page_end: parsed.end, note })
      .select().single();
    if(error){ alert('新增失敗：' + error.message); return; }
    if(!entriesByBook[active.id]) entriesByBook[active.id] = [];
    entriesByBook[active.id].push(data);
    render();
    showExperienceToast(newPages);
    updateDailyProgress();
    const taskProgress = taskProgressForBook(active.id);
    if(taskProgress){
      showTaskProgressToast(taskProgress);
    }
  });
  document.querySelectorAll('.del').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const entryId = el.dataset.entry;
      const { error } = await db.from('entries').delete().eq('id', entryId);
      if(error){ alert('刪除失敗：' + error.message); return; }
      entriesByBook[active.id] = entriesByBook[active.id].filter(e=>e.id!==entryId);
      render();
      updateDailyProgress();
    });
  });
}

function addBookFormHTML(){
  return `
    <input type="text" id="newBookName" placeholder="書名／科目名稱">
    <div class="row">
      <input type="number" min="0" class="pages" id="newBookTarget" placeholder="目標頁數">
      <button id="addBookBtn" style="flex:1">新增</button>
    </div>`;
}
function bindAddBook(){
  document.getElementById('addBookBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('newBookName').value.trim();
    if(!name) return;
    const targetVal = document.getElementById('newBookTarget').value;
    const target = targetVal ? Number(targetVal) : null;
    const { data, error } = await db.from('books')
      .insert({ name, target, user_id: currentUser.id })
      .select().single();
    if(error){ alert('新增失敗：' + error.message); return; }
    books.push(data);
    entriesByBook[data.id] = [];
    activeBookId = data.id;
    render();
  });
}

/* ---------------- View switching ---------------- */

function showAuthView(){
  document.getElementById('authView').classList.remove('hidden');
  document.getElementById('mainView').classList.add('hidden');
}
async function showMainView(){
  document.getElementById('authView').classList.add('hidden');
  document.getElementById('mainView').classList.remove('hidden');
  document.getElementById('userBadge').textContent = isGuestMode ? '' : currentUser.email;
  document.getElementById('avatarInitial').textContent = isGuestMode ? '訪' : avatarInitial(currentUser.email);
  document.getElementById('guestBadge').classList.toggle('hidden', !isGuestMode);
  document.getElementById('changePwBtn').classList.toggle('hidden', isGuestMode);
  document.getElementById('appPanel').innerHTML = '<div class="loading">讀取資料中…</div>';
  await loadAllData();
  render();
  await showDailyTask();
}

/* ---------------- Init ---------------- */

async function init(){
  formatStamp();
  checkConfig();

  document.getElementById('authForm').addEventListener('submit', handleAuthSubmit);
  document.getElementById('authToggleBtn').addEventListener('click', toggleAuthMode);
  document.getElementById('guestModeBtn').addEventListener('click', enterGuestMode);
  document.getElementById('logoutBtn').addEventListener('click', handleLogout);
  document.getElementById('todayPagesBtn').addEventListener('click', openTodayPagesModal);
  document.getElementById('closeTodayPagesBtn').addEventListener('click', closeTodayPagesModal);
  document.getElementById('todayPagesOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'todayPagesOverlay') closeTodayPagesModal();
  });
  document.getElementById('changePwBtn').addEventListener('click', openChangePwModal);
  document.getElementById('cancelPwBtn').addEventListener('click', closeChangePwModal);
  document.getElementById('changePwForm').addEventListener('submit', handleChangePwSubmit);
  document.getElementById('dailyClose').addEventListener('click', ()=>{
    requestNotifyPermission();
    closeDailyTask();
  });
  document.getElementById('openDailyBtn').addEventListener('click', async ()=>{
    requestNotifyPermission();
    await showDailyTask();
  });
  document.getElementById('dailyReshuffleBtn').addEventListener('click', async ()=>{
    const plan = await getDailyTaskPlan();
    const pct = dailyCompletionPct(plan.tasks || []);
    if(pct < 100){
      const usedKey = passwordReshuffleUsedKey();
      if(localStorage.getItem(usedKey) === '1'){
        showDailyToast({ icon:'🔒', title:'密碼破例只能用一次', body:'已經用過囉，寫到 100% 才能再重排唷' });
        return;
      }
      const input = prompt('今天還沒寫完，輸入密碼可以破例重排一次：');
      if(input === null) return; // 使用者取消
      if(input !== RESHUFFLE_PASSWORD){
        showDailyToast({ icon:'🔒', title:'密碼不對', body:'先寫完今天的任務，或輸入正確密碼才能重排' });
        return;
      }
      localStorage.setItem(usedKey, '1');
      await reshuffleDailyTasks(true);
      return;
    }
    await reshuffleDailyTasks(false);
  });
  document.getElementById('changePwOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'changePwOverlay') closeChangePwModal();
  });
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=> switchSection(el.dataset.section));
  });
  document.getElementById('avatarBtn').addEventListener('click', openProfileModal);
  document.getElementById('closeProfileBtn').addEventListener('click', closeProfileModal);
  document.getElementById('profileOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'profileOverlay') closeProfileModal();
  });

  const { data: { session } } = await supabase.auth.getSession();
  if(session){ currentUser = session.user; await showMainView(); }
  else{ showAuthView(); }

  supabase.auth.onAuthStateChange(async (event, session) => {
    if(session){
      const isNewLogin = !currentUser || currentUser.id !== session.user.id;
      currentUser = session.user;
      // 只有真正的登入（或切換帳號）才重新載入資料並跳出每日任務彈窗。
      // TOKEN_REFRESHED / USER_UPDATED 等事件只更新使用者資訊，避免每次 token 刷新
      // 或切回分頁時彈窗又跳出來。
      if(event === 'SIGNED_IN' && isNewLogin){
        await showMainView();
      }else if(document.getElementById('mainView').classList.contains('hidden')){
        // 例如頁面重新載入時先收到 INITIAL_SESSION，仍需要正常顯示主畫面
        await showMainView();
      }
    }else{
      currentUser = null;
      books = []; entriesByBook = {}; activeBookId = null;
      earnedBadges = []; earnedBonusBadges = []; earnedRerollBadges = []; earnedAchievements = [];
      currentStreak = { count: 0, lastDate: null };
      currentDailyPlan = null;
      dailyRerollActive = false;
      showAuthView();
    }
  });
}

init();
</script>
