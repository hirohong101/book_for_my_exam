      reviewSession.picked = el.dataset.letter;
      reviewSession.pickedWord = el.dataset.word || '';
      reviewSession.timedOut = false;
      revealReviewAnswer();
    });
  });
  const submitFillBtn = document.getElementById('submitFillBtn');
  if(submitFillBtn) submitFillBtn.addEventListener('click', ()=>{
    const input = document.getElementById('fillAnswerInput');
    reviewSession.picked = input ? input.value.trim() : '';
    reviewSession.timedOut = false;
    revealReviewAnswer();
  });
  const fillInput = document.getElementById('fillAnswerInput');
  if(fillInput) fillInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); submitFillBtn?.click(); } });

  if(nextBtn) nextBtn.addEventListener('click', ()=>{
    clearLavaTimer();
    reviewSession.idx++;
    reviewSession.revealed = false;
    reviewSession.picked = null;
    reviewSession.pickedWord = '';
    reviewSession.timedOut = false;
    reviewSession._choices = null;
    reviewSession._choicesFor = null;
    ensureBossQueue();
    renderReviewPanel();
  });
  const backBtn = document.getElementById('backToSetupBtn');
  if(backBtn) backBtn.addEventListener('click', ()=>{ clearLavaTimer(); reviewSession = null; renderReviewPanel(); });
  const restartBtn = document.getElementById('restartReviewBtn');
  if(restartBtn) restartBtn.addEventListener('click', ()=>{ clearLavaTimer(); startReviewSession({ floor: reviewSession && reviewSession.floor }); });
  // 開始／繼續熔岩倒數
  if(reviewSession && !reviewSession.revealed && !reviewSession.battleOver){
    ensureBossQueue();
    startLavaTimer();
  }
}


let _audioCtx = null;
function getAudioCtx(){
  if(!_audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) _audioCtx = new AC();
  }
  if(_audioCtx && _audioCtx.state === 'suspended'){
    _audioCtx.resume().catch(()=>{});
  }
  return _audioCtx;
}
/** 答對：清脆上升音；連擊越高音越高 */
function playCorrectSound(combo){
  try{
    const ctx = getAudioCtx();
    if(!ctx) return;
    const now = ctx.currentTime;
    const c = Math.max(1, Math.min(Number(combo)||1, 12));
    // 以 C5 為底，每連擊半音上移，最高約到很高的叮叮
    const base = 523.25 * Math.pow(2, (c - 1) / 12);
    const notes = [base, base * 1.25, base * 1.5];
    notes.forEach((freq, i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = Math.min(freq, 2800);
      const vol = Math.min(0.22, 0.14 + c * 0.008);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(vol, now + 0.02 + i*0.045);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2 + i*0.045);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i*0.045);
      osc.stop(now + 0.26 + i*0.045);
    });
  }catch(e){}
}
/** 答錯：低沉短音 */
function playWrongSound(){
  try{
    const ctx = getAudioCtx();
    if(!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(90, now + 0.2);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.15, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.28);
  }catch(e){}
}

async function revealReviewAnswer(){
  clearLavaTimer();
  const v = vocab.find(x=>x.id===reviewSession.queue[reviewSession.idx]);
  if(!v){ renderReviewPanel(); return; }
  let correct;
  if(reviewSession.timedOut){
    correct = false;
  }else{
    // picked 存 letter；用 data-word 對照
    const word = (reviewSession.pickedWord || '').trim();
    const ans = (reviewSession._correctWord || v.word || '').trim().toLowerCase();
    correct = word.toLowerCase() === ans;
  }
  if(correct && reviewSession.timed && reviewSession.questionStartedAt && reviewSession.timeLimit){
    const used = (Date.now() - reviewSession.questionStartedAt) / 1000;
    if(used <= reviewSession.timeLimit * 0.5) reviewSession.fastCount = (reviewSession.fastCount||0) + 1;
  }
  if(reviewSession.timedOut) reviewSession.timedOutCount = (reviewSession.timedOutCount||0) + 1;
  reviewSession.revealed = true;
  reviewSession.lastCorrect = correct;

  // ---- BOSS 戰鬥結算 ----
  reviewSession.turnCount = (reviewSession.turnCount||0) + 1;
  const atkScale = bossAtkScale(reviewSession);
  const rageScale = bossRageScale(reviewSession);
  const phase = bossPhase(reviewSession);

  if(correct){
    reviewSession.correctCount++;
    v.correct_streak = (v.correct_streak||0) + 1;
    reviewSession.combo = (reviewSession.combo||0) + 1;
    reviewSession.maxCombo = Math.max(reviewSession.maxCombo||0, reviewSession.combo);
    playCorrectSound(reviewSession.combo);
    const petBonus = (typeof petPower === 'function') ? Math.floor(petPower().power / 20) : 0;
    const dmg = 14 + (reviewSession.combo * 4) + petBonus;
    reviewSession.bossHp = Math.max(0, (reviewSession.bossHp||0) - dmg);
    reviewSession.bossRage = Math.max(0, (reviewSession.bossRage||0) - 8);
    if(reviewSession.bossHp <= 0){
      reviewSession.battleLog = `💥 你造成 ${dmg} 傷害！${reviewSession.bossName} 被擊倒了！`;
      reviewSession.battleOver = true;
      reviewSession.battleWon = true;
    }else{
      reviewSession.battleLog = `⚔️ 攻擊命中！${dmg} 傷害（連擊 ×${reviewSession.combo}${petBonus?` · 海水蛙 +${petBonus}`:''}）· BOSS 強化 Lv.${phase+1}`;
    }
    if(typeof petGainExp === 'function') petGainExp(8, 'review');
  } else {
    playWrongSound();
    reviewSession.wrongCount = (reviewSession.wrongCount||0) + 1;
    v.correct_streak = 0;
    reviewSession.combo = 0;
    const rageGain = Math.round((reviewSession.timedOut ? 35 : 28) * rageScale);
    reviewSession.bossRage = Math.min(reviewSession.bossRageMax||100, (reviewSession.bossRage||0) + rageGain);
    if((reviewSession.bossRage||0) >= (reviewSession.bossRageMax||100)){
      const specialDmg = Math.round(28 * atkScale);
      reviewSession.playerHp = Math.max(0, (reviewSession.playerHp||0) - specialDmg);
      reviewSession.bossRage = 0;
      reviewSession.battleLog = `🔥 ${reviewSession.bossName} 怒氣全滿，使出大招！你受到 ${specialDmg} 傷害！（強化 Lv.${phase+1}）`;
    }else{
      const normalDmg = Math.round(10 * atkScale);
      reviewSession.playerHp = Math.max(0, (reviewSession.playerHp||0) - normalDmg);
      reviewSession.battleLog = `🗡️ ${reviewSession.bossName} 普通攻擊！你受到 ${normalDmg} 傷害（怒氣 +${rageGain} · 強化 Lv.${phase+1}）`;
    }
    if((reviewSession.playerHp||0) <= 0){
      reviewSession.battleOver = true;
      reviewSession.battleWon = false;
      reviewSession.battleLog += ' 你倒下了…';
    }
  }
  v.review_count = (v.review_count||0) + 1;
  // 遺忘曲線：每次只進一步，不會一次到最完美
  const prog = applyVocabReviewStage(v, correct);
  if(prog){
    if(!reviewSession.wordProgress) reviewSession.wordProgress = [];
    reviewSession.wordProgress.push(prog);
  }
  renderReviewPanel();
  try{
    await db.from('vocab').update({ correct_streak: v.correct_streak||0, review_count: v.review_count||0 }).eq('id', v.id);
  }catch(err){ console.error('更新單字紀錄失敗', err); }
}

function cumulativeFor(bookId){
  const list = (entriesByBook[bookId]||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  let sum = 0;
  return list.map(e=>{ sum += Number(e.pages)||0; return {...e, cum:sum}; });
}
function totalFor(bookId){
  return (entriesByBook[bookId]||[]).reduce((s,e)=>s+(Number(e.pages)||0),0);
}

// 從「起始頁」「結束頁」兩個欄位算出實際寫了幾頁
// 只填起始頁 = 1 頁；起訖都填 = 終-起+1 頁（自動處理順序顛倒）
function parsePageRange(startRaw, endRaw){
  const startStr = String(startRaw||'').trim();
  const endStr = String(endRaw||'').trim();
  if(startStr === '') return null;
  const startNum = Number(startStr);
  if(!Number.isFinite(startNum) || startNum <= 0) return null;

  if(endStr === ''){
    return { pages: 1, rangeLabel: `第${startNum}頁`, start: startNum, end: startNum };
  }
  const endNum = Number(endStr);
  if(!Number.isFinite(endNum) || endNum <= 0) return null;
  const start = Math.min(startNum, endNum), end = Math.max(startNum, endNum);
  return { pages: end - start + 1, rangeLabel: `第${start}~${end}頁`, start, end };
}

// 把某本書「目前所有紀錄」的頁碼區間合併成互不重疊、由小到大排序的區間陣列
// excludeEntryId：如果是在編輯某一筆舊紀錄，記得排除自己，不然會跟自己重疊
function mergedRangesFor(bookId, excludeEntryId){
  const ranges = (entriesByBook[bookId]||[])
    .filter(e => e.id !== excludeEntryId && Number.isFinite(e.page_start) && Number.isFinite(e.page_end))
    .map(e => [e.page_start, e.page_end])
    .sort((a,b)=>a[0]-b[0]);
  const merged = [];
  for(const [s,e] of ranges){
    const last = merged[merged.length-1];
    if(last && s <= last[1] + 1){ last[1] = Math.max(last[1], e); }
    else{ merged.push([s,e]); }
  }
  return merged;
}

// 用「已經寫過的區間」去扣掉這次新輸入的 start~end，算出真正「新寫的頁數」跟「重疊掉的頁數」
function subtractWrittenRanges(start, end, mergedRanges){
  let segments = [[start,end]];
  for(const [rs,re] of mergedRanges){
    const next = [];
    for(const [s,e] of segments){
      if(re < s || rs > e){ next.push([s,e]); continue; } // 完全沒重疊
      if(s < rs) next.push([s, rs-1]);
      if(e > re) next.push([re+1, e]);
    }
    segments = next;
  }
  const totalPages = end - start + 1;
  const newPages = segments.reduce((sum,[s,e])=>sum + (e-s+1), 0);
  return { newPages, overlappedPages: totalPages - newPages, totalPages };
}

// 產生「逐頁長條圖」：目標頁數是幾頁就畫幾格、排成一整條，只有寫過的頁碼格子會被填色（顏色跟該科目一致）
function pageGridHTML(bookId, target, color, extraClass){
  const merged = mergedRangesFor(bookId);
  const isWritten = (p) => merged.some(([s,e]) => p>=s && p<=e);

  const cellCount = target>0 ? target : (merged.length ? merged[merged.length-1][1] : 0);
  if(cellCount <= 0){
    return `<div class="page-grid-empty">還沒有可顯示的頁碼，記錄後會自動畫出進度條。</div>`;
  }
  const cells = Array.from({length:cellCount}).map((_,i)=>{
    const p = i+1;
    return `<span class="page-cell ${isWritten(p)?'filled':''}" title="第${p}頁"></span>`;
  }).join('');
  return `<div class="page-grid ${extraClass||''}" style="--cell-color:${color}">${cells}</div>`;
}

function flipAnimateOverviewCards(prevRects){
  const cards = Array.from(document.querySelectorAll('.overview-card'));
  if(cards.length === 0) return;

  cards.forEach(el=>{
    const id = el.dataset.id;
    const prev = prevRects[id];
    if(!prev) return; // 新卡片，不做位移動畫
    const next = el.getBoundingClientRect();
    const dx = prev.left - next.left;
    const dy = prev.top - next.top;
    if(Math.abs(dx) < 1 && Math.abs(dy) < 1) return; // 位置沒變，不用動畫

    // 先移除可能殘留的動畫 class，確保能重新觸發
    el.classList.remove('reorder-move');
    el.style.setProperty('--dx', dx + 'px');
    el.style.setProperty('--dy', dy + 'px');
    void el.offsetWidth; // 強制 reflow，確保上面的移除/變數設定先生效
    el.classList.add('reorder-move');

    el.addEventListener('animationend', function handler(){
      el.classList.remove('reorder-move');
      el.style.removeProperty('--dx');
      el.style.removeProperty('--dy');
      el.removeEventListener('animationend', handler);
    });
  });
}

    note = note ? `${label}・${note}` : label;

      .insert({ book_id: active.id, user_id: currentUser.id, date, pages: newPages, page_start: parsed.start, page_end: parsed.end, note })

    if(!entriesByBook[active.id]) entriesByBook[active.id] = [];
    entriesByBook[active.id].push(data);

      entriesByBook[active.id] = entriesByBook[active.id].filter(e=>e.id!==entryId);
      render();
      updateDailyProgress();

  if(fabAv) fabAv.textContent = initial;
  if(advAv) advAv.textContent = initial;
  if(advName) advName.textContent = isGuestMode ? '訪客冒險者' : (currentUser.email || '冒險者');
  if(advSub) advSub.textContent = isGuestMode ? '本機資料・未登入' : '島上冒險者';
  const advPw = document.getElementById('advChangePwBtn');
  if(advPw) advPw.style.display = isGuestMode ? 'none' : '';
  document.getElementById('appPanel').innerHTML = '<div class="loading">讀取資料中…</div>';
  await loadAllData();
  render();
  showIslandHome();
  // 主線任務改為手動點左側按鈕查看，不再自動跳出
  try{ await prepareDailyTask(); }catch(e){ console.warn(e); }
}

/* ---------------- Init ---------------- */

async function init(){
  formatStamp();
  checkConfig();

  document.getElementById('authForm').addEventListener('submit', handleAuthSubmit);
  document.getElementById('authToggleBtn').addEventListener('click', toggleAuthMode);
  document.getElementById('guestModeBtn').addEventListener('click', enterGuestMode);
  document.getElementById('logoutBtn').addEventListener('click', handleLogout);
  document.getElementById('todayPagesBtn').addEventListener('click', openTodayPagesModal);
  document.getElementById('closeTodayPagesBtn').addEventListener('click', closeTodayPagesModal);
  document.getElementById('todayPagesOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'todayPagesOverlay') closeTodayPagesModal();
  });
  document.getElementById('vocabDetailOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'vocabDetailOverlay') closeVocabDetail();
  });
  document.getElementById('changePwBtn').addEventListener('click', openChangePwModal);
  document.getElementById('cancelPwBtn').addEventListener('click', closeChangePwModal);
  document.getElementById('changePwForm').addEventListener('submit', handleChangePwSubmit);
  document.getElementById('dailyClose').addEventListener('click', ()=>{
    requestNotifyPermission();
    closeDailyTask();
  });
  document.getElementById('openDailyBtn')?.addEventListener('click', async ()=>{
    requestNotifyPermission();
    await showDailyTask();
  });
  bindPetUI();
  document.getElementById('missionFab')?.addEventListener('click', async ()=>{
    requestNotifyPermission();
    await showDailyTask();
  });
  document.getElementById('badgeAnimClose')?.addEventListener('click', ()=>{
    document.getElementById('badgeAnimOverlay')?.classList.add('hidden');
  });
  document.getElementById('badgeAnimOverlay')?.addEventListener('click', (e)=>{
    if(e.target.id === 'badgeAnimOverlay') e.target.classList.add('hidden');
  });
  document.getElementById('dailyReshuffleBtn')?.addEventListener('click', async ()=>{
    const plan = await getDailyTaskPlan();
    const pct = dailyCompletionPct(plan.tasks || []);
    if(pct < 100){
      const usedKey = passwordReshuffleUsedKey();
      if(localStorage.getItem(usedKey) === '1'){
        showDailyToast({ icon:'🔒', title:'密碼破例只能用一次', body:'已經用過囉，寫到 100% 才能再重排唷' });
        return;
      }
      const input = prompt('今天還沒寫完，輸入密碼可以破例重排一次：');
      if(input === null) return; // 使用者取消
      if(input !== RESHUFFLE_PASSWORD){
        showDailyToast({ icon:'🔒', title:'密碼不對', body:'先寫完今天的任務，或輸入正確密碼才能重排' });
        return;
      }
      localStorage.setItem(usedKey, '1');
      await reshuffleDailyTasks(true);
      return;
    }
    await reshuffleDailyTasks(false);
  });
  document.getElementById('changePwOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'changePwOverlay') closeChangePwModal();
  });
  document.querySelectorAll('.nav-item, .island-spot').forEach(el=>{
    el.addEventListener('click', ()=> switchSection(el.dataset.section));
  });
  const backBtn = document.getElementById('backToIslandBtn');
  if(backBtn) backBtn.addEventListener('click', showIslandHome);

  // 全螢幕（類似 YouTube）
  const fsBtn = document.getElementById('fullscreenBtn');
  function updateFsBtn(){
    if(!fsBtn) return;
    const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
    fsBtn.textContent = on ? '⛶ 離開全螢幕' : '⛶ 全螢幕';
    fsBtn.title = on ? '離開全螢幕' : '全螢幕顯示';
  }
  async function toggleFullscreen(){
    try{
      const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
      if(!on){
        const el = document.documentElement;
        if(el.requestFullscreen) await el.requestFullscreen();
        else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      }else{
        if(document.exitFullscreen) await document.exitFullscreen();
        else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }catch(err){
      console.warn('全螢幕失敗', err);
      alert('此瀏覽器無法進入全螢幕，或需要你允許權限。');
    }
    updateFsBtn();
  }
  if(fsBtn){
    fsBtn.addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', updateFsBtn);
    document.addEventListener('webkitfullscreenchange', updateFsBtn);
  }
  document.getElementById('avatarBtn').addEventListener('click', openProfileModal);

  // 冒險者資訊選單
  const fab = document.getElementById('adventurerFab');
  const menu = document.getElementById('adventurerMenu');
  if(fab && menu){
    fab.addEventListener('click', (e)=>{
      e.stopPropagation();
      menu.classList.toggle('open');
    });
    document.addEventListener('click', (e)=>{
      if(!menu.contains(e.target) && e.target !== fab && !fab.contains(e.target)){
        menu.classList.remove('open');
      }
    });
    document.getElementById('advProfileBtn')?.addEventListener('click', ()=>{ menu.classList.remove('open'); openProfileModal(); });
    document.getElementById('advTodayPagesBtn')?.addEventListener('click', ()=>{ menu.classList.remove('open'); openTodayPagesModal(); });
    document.getElementById('advDailyBtn')?.addEventListener('click', async ()=>{ menu.classList.remove('open'); await showDailyTask(); });
    document.getElementById('advChangePwBtn')?.addEventListener('click', ()=>{ menu.classList.remove('open'); openChangePwModal(); });
    document.getElementById('advLogoutBtn')?.addEventListener('click', ()=>{ menu.classList.remove('open'); handleLogout(); });
  }
  document.getElementById('closeProfileBtn').addEventListener('click', closeProfileModal);
  document.getElementById('profileOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'profileOverlay') closeProfileModal();
  });

  const { data: { session } } = await supabase.auth.getSession();
  if(session){ currentUser = session.user; await showMainView(); }
  else{ showAuthView(); }

  supabase.auth.onAuthStateChange(async (event, session) => {
    if(session){
      const isNewLogin = !currentUser || currentUser.id !== session.user.id;
      currentUser = session.user;
      // 只有真正的登入（或切換帳號）才重新載入資料並跳出每日任務彈窗。
      // TOKEN_REFRESHED / USER_UPDATED 等事件只更新使用者資訊，避免每次 token 刷新
      // 或切回分頁時彈窗又跳出來。
      if(event === 'SIGNED_IN' && isNewLogin){
        await showMainView();
      }else if(document.getElementById('mainView').classList.contains('hidden')){
        // 例如頁面重新載入時先收到 INITIAL_SESSION，仍需要正常顯示主畫面
        await showMainView();
      }
    }else{
      currentUser = null;
      books = []; entriesByBook = {}; activeBookId = null;
      earnedBadges = []; earnedBonusBadges = []; earnedAchievements = [];
      currentStreak = { count: 0, lastDate: null };
      currentDailyPlan = null;
      showAuthView();
    }
  });
}

init();
</script>
</body>
</html>
