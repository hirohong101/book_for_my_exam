<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>複習島嶼 · Review Island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper: #E8F4F0;
  --paper-line: #c5e0d6;
  --card: #FFFef8;
  --card-border: #D4E8DF;
  --ink: #1E3A34;
  --ink-soft: #5A7A70;
  --ledger-green: #2A7B6B;
  --ledger-green-soft: #E0F2EC;
  --brass: #D4A017;
  --brass-soft: #FBF0D0;
  --danger: #C45C4A;
  --ocean: #3A8FBF;
  --sand: #F5E6C8;
  --coral: #E07A5F;
  --palm: #3D8B6E;
  --radius: 10px;
  --shadow: 0 2px 6px rgba(30,58,52,0.07), 0 6px 16px rgba(30,58,52,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 120% 80% at 50% -20%, #B8E0D8 0%, transparent 55%),
    radial-gradient(ellipse 80% 50% at 90% 100%, #F5E6C8 0%, transparent 40%),
    radial-gradient(ellipse 60% 40% at 10% 90%, #A8D4C8 0%, transparent 35%),
    linear-gradient(180deg, #E8F4F0 0%, #F0F7F4 40%, #F8F4E8 100%);
  color:var(--ink);
  font-family:'Inter', sans-serif;
  min-height:100vh;
  padding:28px 20px 60px;
}
::selection{ background: var(--brass-soft); }
:focus-visible{ outline:2px solid var(--ledger-green); outline-offset:2px; border-radius:3px; }
.hidden{ display:none !important; }

.wrap{ max-width:980px; margin:0 auto; }

header.top{
  display:flex; justify-content:space-between; align-items:flex-end;
  gap:16px; margin-bottom:24px; flex-wrap:wrap;
}
.title-block{
  display:flex; flex-direction:column; align-items:flex-start; gap:6px;
}
.title-block h1{
  font-family:'Fraunces', serif; font-weight:600; font-size:clamp(28px,4vw,38px);
  margin:0 0 4px; letter-spacing:-0.01em;
}
body.in-place .title-block h1{ font-size:clamp(22px,3.2vw,30px); }

.title-block .stamp{
  font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink-soft);
  letter-spacing:0.04em; text-transform:uppercase;
}
.header-actions{ display:flex; align-items:center; gap:10px; }
.avatar-btn{
  width:34px; height:34px; border-radius:50%; border:none; cursor:pointer; padding:0;
  background:var(--ledger-green); color:#fff; font-family:'Fraunces',serif; font-weight:600;
  font-size:15px; display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow); transition:transform .15s ease;
}
.avatar-btn:hover{ transform:scale(1.06); }
.user-badge{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); }
.daily-progress{
  padding:7px 10px; border:1px solid var(--brass); border-radius:999px;
  background:var(--brass-soft); color:#72530f; white-space:nowrap;
  font:700 12px 'JetBrains Mono',monospace;
}
.export-btn, .logout-btn{
  font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
  border:none; border-radius:var(--radius);
  padding:11px 18px; cursor:pointer; box-shadow:var(--shadow);
  display:inline-flex; align-items:center; gap:8px; transition:transform .12s ease, background .12s ease;
}
.export-btn{ background:var(--ledger-green); color:#fff; }
.export-btn:hover{ background:#264c41; transform:translateY(-1px); }
.logout-btn{ background:#fff; color:var(--danger); border:1px solid var(--card-border); }
.logout-btn:hover{ background:#f7f0ee; }
.export-btn svg{ width:15px; height:15px; }

/* ---------- 登入畫面 ---------- */
.auth-wrap{ max-width:380px; margin:8vh auto 0; }
.auth-card{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:32px 28px;
}
.auth-card h1{ font-family:'Fraunces',serif; font-size:26px; margin:0 0 4px; text-align:center; }
.auth-card .sub{ text-align:center; color:var(--ink-soft); font-size:13px; margin-bottom:22px; }
.auth-field{ display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
.auth-field label{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; }
.auth-field input{ font-family:'Inter',sans-serif; font-size:14px; padding:10px 12px; border:1px solid var(--card-border); border-radius:4px; background:#fff; }
.auth-submit{
  width:100%; background:var(--ledger-green); color:#fff; border:none; border-radius:4px;
  padding:11px; font-weight:600; font-size:14px; cursor:pointer; margin-top:4px;
}
.auth-submit:hover{ background:#264c41; }
.auth-submit:disabled{ opacity:0.6; cursor:default; }
.auth-toggle{ text-align:center; margin-top:16px; font-size:13px; color:var(--ink-soft); }
.auth-toggle button{ background:none; border:none; color:var(--ledger-green); font-weight:600; cursor:pointer; text-decoration:underline; padding:0; font-size:13px; }
.auth-msg{ font-size:13px; text-align:center; margin-top:12px; padding:8px; border-radius:4px; }
.auth-msg.error{ background:#f7e3e0; color:var(--danger); }
.auth-msg.success{ background:var(--ledger-green-soft); color:var(--ledger-green); }
.guest-divider{ display:flex; align-items:center; gap:10px; margin:18px 0 12px; color:var(--ink-soft); font-size:12px; }
.guest-divider::before, .guest-divider::after{ content:''; flex:1; height:1px; background:var(--card-border); }
.guest-mode-btn{
  width:100%; background:#fff; color:var(--ink); border:1px solid var(--card-border); border-radius:4px;
  padding:11px; font-weight:600; font-size:13.5px; cursor:pointer; font-family:'Inter',sans-serif;
}
.guest-mode-btn:hover{ background:var(--ledger-green-soft); border-color:var(--ledger-green); }
.guest-badge{
  font-family:'JetBrains Mono',monospace; font-size:11px; color:#72530f; background:var(--brass-soft);
  border:1px solid var(--brass); border-radius:999px; padding:3px 9px; white-space:nowrap;
}

/* ---------- 主應用程式 ---------- */
.overview{ margin-bottom:22px; }
.overview h2{ font-family:'Fraunces',serif; font-size:18px; font-weight:600; margin:0; }
.overview-head{ display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
.overview-badges{ display:flex; gap:8px; flex-wrap:wrap; }
.today-total{ font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink-soft); background:var(--brass-soft); padding:4px 10px; border-radius:20px; }
.today-total b{ color:var(--brass); font-size:15px; }
.today-total.grand-total{ background:var(--ledger-green-soft); font-size:11px; padding:3px 8px; }
.today-total.grand-total b{ color:var(--ledger-green); font-size:12.5px; }
.overview-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; }
@media (max-width:900px){ .overview-grid{ grid-template-columns:repeat(2, 1fr); } }
@media (max-width:520px){ .overview-grid{ grid-template-columns:1fr; } }
.overview-card{
  position:relative;
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:14px 16px; cursor:pointer; text-align:left;
  font-family:inherit; display:flex; flex-direction:column; gap:8px;
  border-left:4px solid var(--tab-color, var(--brass)); transition:transform .12s ease, box-shadow .12s ease;
}
.overview-card:hover{ transform:translateY(-1px); box-shadow:0 2px 4px rgba(43,42,38,0.08), 0 6px 14px rgba(43,42,38,0.08); }
@keyframes flipReorder{
  0%{
    transform: translate(var(--dx,0px), var(--dy,0px)) scale(0.96);
    box-shadow:0 2px 6px rgba(43,42,38,0.16), 0 10px 22px rgba(43,42,38,0.14), inset 0 0 0 2px var(--tab-color, var(--brass));
    filter:brightness(1.04);
  }
  55%{
    transform: translate(calc(var(--dx,0px) * 0.06), calc(var(--dy,0px) * 0.06)) scale(1.025);
    box-shadow:0 3px 8px rgba(43,42,38,0.16), 0 12px 24px rgba(43,42,38,0.14), inset 0 0 0 2px var(--tab-color, var(--brass));
  }
  100%{
    transform: translate(0,0) scale(1);
    box-shadow:var(--shadow);
    filter:brightness(1);
  }
}
.overview-card.reorder-move{
  animation: flipReorder 1400ms cubic-bezier(0.32, 0, 0.16, 1);
  z-index:5;
}
.overview-card.active{ outline:2px solid var(--tab-color, var(--ledger-green)); outline-offset:1px; }
.overview-card .name{ font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.overview-card .num{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); }
.overview-card .num b{ color:var(--ink); font-size:14px; }
.overview-bar{ height:8px; background:#fff; border:1px solid var(--card-border); border-radius:4px; overflow:hidden; }
.overview-bar-fill{ height:100%; background:var(--tab-color, var(--brass)); transition:width .35s ease; }
.overview-card .no-target{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); }

/* 已完成的書本：淡化＋蓋上斜章 */
.overview-card{ overflow:hidden; }
.overview-card.completed, .book-tab.completed{ opacity:0.55; filter:grayscale(45%); }
.overview-card.completed::after, .book-tab.completed::after{
  content:'完成';
  position:absolute; top:10px; right:-30px; width:120px;
  transform:rotate(35deg); text-align:center;
  background:var(--ledger-green); color:#fff; font-family:'JetBrains Mono',monospace;
  font-size:11px; font-weight:700; letter-spacing:.15em; padding:3px 0;
  box-shadow:0 1px 3px rgba(0,0,0,.25); pointer-events:none; z-index:2;
}

.layout{ display:grid; grid-template-columns:220px 1fr; gap:20px; align-items:start; }
@media (max-width:720px){ .layout{ grid-template-columns:1fr; } }

.shelf{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:10px; display:flex; flex-direction:column; gap:6px;
}
.shelf h2{
  font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase;
  letter-spacing:0.08em; color:var(--ink-soft); margin:4px 6px 2px; font-weight:700;
}
.book-tab{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  background:transparent; border:none; border-left:4px solid var(--tab-color, var(--ledger-green));
  border-radius:3px; padding:9px 10px; cursor:pointer; font-family:'Inter',sans-serif;
  font-size:14px; color:var(--ink); transition:background .12s ease;
  position:relative; overflow:hidden;
}
.book-tab .name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.book-tab .pct{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); }
.book-tab:hover{ background:var(--ledger-green-soft); }
.book-tab.active{ background:var(--ledger-green-soft); font-weight:600; }
.book-tab.paused{ opacity:0.5; }
.book-tab.paused .pct{ color:var(--brass); }
.paused-tag{
  font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; color:#72530f;
  background:var(--brass-soft); border:1px solid var(--brass); border-radius:999px; padding:1px 7px; margin-left:6px;
}

.add-book{ border-top:1px dashed var(--card-border); margin-top:4px; padding-top:8px; }
.add-book input{
  width:100%; font-family:'Inter',sans-serif; font-size:13px; padding:7px 8px;
  border:1px solid var(--card-border); border-radius:4px; margin-bottom:6px; background:#fff;
}
.add-book .row{ display:flex; gap:6px; }
.add-book .row input.pages{ width:70px; }
.add-book button{
  font-family:'Inter',sans-serif; font-size:13px; font-weight:600; width:100%;
  background:#fff; border:1px solid var(--ledger-green); color:var(--ledger-green);
  border-radius:4px; padding:7px; cursor:pointer;
}
.add-book button:hover{ background:var(--ledger-green-soft); }

.panel{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:22px 24px;
}
.panel-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:6px;}
.panel-head h2{ font-family:'Fraunces',serif; font-size:22px; font-weight:600; margin:0; }
.panel-head .target-edit{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft); }
.panel-head .target-edit input{
  width:70px; font-family:'JetBrains Mono',monospace; font-size:13px; padding:4px 6px;
  border:1px solid var(--card-border); border-radius:4px; text-align:right;
}
.delete-book{ background:none; border:none; color:var(--danger); font-size:12px; cursor:pointer; text-decoration:underline; padding:0; }
.pause-book{ background:none; border:none; color:var(--brass); font-size:12px; cursor:pointer; text-decoration:underline; padding:0; }
.pause-book.is-paused{ color:var(--ledger-green); }

.ruler{ margin:22px 0 26px; }
.ruler .stats{ display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink-soft); margin-bottom:10px; }
.ruler .stats b{ color:var(--ink); font-size:15px; }
.page-grid{
  display:flex; height:22px; border:1px solid var(--card-border); border-radius:3px;
  overflow:hidden; background:#fff;
}
.page-cell{ flex:1; border-right:1px solid var(--paper-line); transition:background .15s ease; }
.page-cell:last-child{ border-right:none; }
.page-cell.filled{ background:var(--cell-color, var(--brass)); border-right-color:var(--cell-color, var(--brass)); }
.page-grid.compact{ height:8px; border-radius:4px; }
.page-grid.compact .page-cell{ border-right:none; }
.page-grid-empty{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); }


.entry-form{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; padding:16px; background:var(--ledger-green-soft); border-radius:var(--radius); margin-bottom:20px; }
.entry-form .field{ display:flex; flex-direction:column; gap:4px; }
.entry-form label{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; }
.entry-form input{ font-family:'Inter',sans-serif; font-size:14px; padding:8px 10px; border:1px solid var(--card-border); border-radius:4px; background:#fff; }
.entry-form input[type=number]{ width:90px; }
.entry-form input[type=text]{ width:180px; }
.entry-form input#entryPages{ width:130px; }
.page-range{ display:flex; align-items:center; gap:6px; }
.page-range input{ width:70px !important; }
.page-range .tilde{ color:var(--ink-soft); font-family:'JetBrains Mono',monospace; }
.field-hint{ font-size:11px; color:var(--ink-soft); max-width:160px; line-height:1.3; }
.entry-form .submit{
  background:var(--ledger-green); color:#fff; border:none; border-radius:4px; padding:9px 18px;
  font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; font-size:14px; height:38px;
}
.entry-form .submit:hover{ background:#264c41; }

table.ledger{ width:100%; border-collapse:collapse; font-size:14px; }
table.ledger th{ text-align:left; font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); border-bottom:1px solid var(--card-border); padding:6px 8px; font-weight:700; }
table.ledger td{ padding:8px; border-bottom:1px solid var(--paper-line); font-family:'JetBrains Mono',monospace; }
table.ledger td.note{ font-family:'Inter',sans-serif; color:var(--ink-soft); }
table.ledger tr:hover td{ background:#faf7ee; }
table.ledger .del{ background:none; border:none; color:var(--danger); cursor:pointer; font-size:12px; }

.empty{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
.empty h2{ font-family:'Fraunces',serif; font-size:20px; color:var(--ink); margin-bottom:6px; }

.loading{ text-align:center; padding:60px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; font-size:13px; }

/* ---------- 每日紀錄（熱力圖） ---------- */
.daily-summary{ display:flex; gap:18px; flex-wrap:wrap; margin-bottom:18px; }
.daily-summary .stat{ font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--ink-soft); }
.daily-summary .stat b{ color:var(--ledger-green); font-size:15px; }
.heatmap-scroll{ overflow-x:auto; padding-bottom:8px; margin-bottom:22px; }
.heatmap-inner{ display:inline-block; min-width:100%; }
.heatmap-months{
  display:grid; grid-auto-flow:column; grid-auto-columns:12px; gap:3px;
  margin-left:30px; height:14px; font:10px 'JetBrains Mono',monospace; color:var(--ink-soft);
}
.heatmap-body{ display:flex; gap:6px; }
.heatmap-weekday-labels{
  display:grid; grid-template-rows:repeat(7,12px); gap:3px;
  font:9.5px 'JetBrains Mono',monospace; color:var(--ink-soft); width:24px; text-align:right;
}
.heatmap-grid{
  display:grid; grid-template-rows:repeat(7,12px); grid-auto-flow:column; grid-auto-columns:12px; gap:3px;
}
.heatmap-cell{
  width:12px; height:12px; border-radius:3px; background:var(--paper-line);
  cursor:pointer; transition:transform .1s ease, outline .1s ease;
}
.heatmap-cell:hover{ transform:scale(1.3); }
.heatmap-cell.empty-pad{ background:transparent; cursor:default; pointer-events:none; }
.heatmap-cell.level-0{ background:var(--paper-line); }
.heatmap-cell.level-1{ background:#cfe3da; }
.heatmap-cell.level-2{ background:#9cc4b3; }
.heatmap-cell.level-3{ background:#5c9784; }
.heatmap-cell.level-4{ background:var(--ledger-green); }
.heatmap-cell.selected{ outline:2px solid var(--brass); outline-offset:1px; }
.heatmap-legend{ display:flex; align-items:center; gap:5px; margin-top:8px; font:10px 'JetBrains Mono',monospace; color:var(--ink-soft); }
.heatmap-legend .heatmap-cell{ cursor:default; }
.heatmap-legend .heatmap-cell:hover{ transform:none; }

.daily-detail{
  background:var(--ledger-green-soft); border-radius:var(--radius); padding:16px 18px;
}
.daily-detail-head{ display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
.daily-detail-head h3{ font-family:'Fraunces',serif; font-size:16px; margin:0; }
.daily-detail-head .total{ font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ledger-green); }
.daily-detail-head .total b{ font-size:16px; }
.daily-detail-list{ display:flex; flex-direction:column; gap:6px; }
.daily-detail-row{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  background:var(--card); border:1px solid var(--card-border); border-radius:4px; padding:8px 12px;
}
.daily-detail-row .subject{ font-weight:600; font-size:13.5px; }
.daily-detail-row .pages{ font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink-soft); white-space:nowrap; }
.daily-detail-row .pages b{ color:var(--ink); }
.daily-detail-empty{ color:var(--ink-soft); font-size:13px; text-align:center; padding:14px 0; }

/* ---------- 修改密碼彈窗 ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(43,42,38,0.45); display:flex;
  align-items:center; justify-content:center; padding:20px; z-index:50;
}
.modal-card{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:26px 26px; width:100%; max-width:360px;
}
.modal-card h2{ font-family:'Fraunces',serif; font-size:20px; margin:0 0 16px; }
.modal-card .auth-field{ margin-bottom:12px; }
.modal-actions{ display:flex; gap:8px; margin-top:6px; }
.modal-actions button{ flex:1; border-radius:4px; padding:10px; font-weight:600; font-size:14px; cursor:pointer; font-family:'Inter',sans-serif; }
.modal-actions .cancel-btn{ background:#fff; border:1px solid var(--card-border); color:var(--ink); }
.modal-actions .cancel-btn:hover{ background:var(--ledger-green-soft); }
.modal-actions .confirm-btn{ background:var(--ledger-green); border:none; color:#fff; }
.modal-actions .confirm-btn:hover{ background:#264c41; }
.modal-actions .confirm-btn:disabled{ opacity:0.6; cursor:default; }
.change-pw-btn{ background:#fff; color:var(--ink); border:1px solid var(--card-border); }
.change-pw-btn:hover{ background:var(--ledger-green-soft); }

/* ---------- 個人檔案彈窗 ---------- */
.profile-card{ max-width:760px; width:100%; }
.profile-head{ display:flex; align-items:center; gap:14px; margin-bottom:18px; }
.profile-avatar{
  width:56px; height:56px; border-radius:50%; flex-shrink:0;
  background:var(--ledger-green); color:#fff; font-family:'Fraunces',serif; font-weight:600;
  font-size:22px; display:flex; align-items:center; justify-content:center;
}
.profile-id h2{ font-family:'Fraunces',serif; font-size:16px; font-weight:600; margin:0 0 2px; word-break:break-all; }
.profile-sub{ margin:0; font-size:12px; color:var(--ink-soft); }
.profile-stats{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
.profile-stat{
  background:var(--ledger-green-soft); border-radius:var(--radius); padding:12px 14px;
  display:flex; flex-direction:column; gap:4px;

/* ---------- 每日任務彈窗 ---------- */
.daily-overlay{ position:fixed; inset:0; z-index:1000; padding:20px; display:flex; align-items:center; justify-content:center; background:rgba(43,42,38,.58); }
.daily-card{ width:min(100%,430px); padding:30px 28px; background:var(--card); border:1px solid var(--card-border); border-radius:10px; box-shadow:0 18px 48px rgba(0,0,0,.24); text-align:center; animation:daily-pop .25s ease-out; }

.daily-card h2{ margin:0 0 7px; font-family:'Fraunces',serif; font-size:27px; }
.daily-date{ color:var(--ink-soft); font-family:'JetBrains Mono',monospace; font-size:12px; }

.daily-reshuffle-btn{

}

.daily-task-list{ margin:20px 0 16px; padding:14px 16px; border-radius:7px; background:var(--ledger-green-soft); text-align:left; }

.daily-task-list .task-row{

}
.bonus-reshuffle-btn:hover{ background:var(--ledger-green-soft); color:var(--ledger-green); }
.daily-badge-label{ color:var(--ink-soft); font-size:12px; letter-spacing:.06em; }
.daily-badge{ margin:7px 0 5px; font-family:'Fraunces',serif; font-size:21px; }
.daily-badge-note{ margin:0 0 20px; color:var(--ink-soft); font-size:13px; }
.daily-btn{ width:100%; padding:12px; border:0; border-radius:4px; background:var(--ledger-green); color:#fff; cursor:pointer; font:600 15px 'Inter',sans-serif; }

.daily-open-btn{

}
.daily-open-btn:hover{ background:#eddba9; transform:translateY(-1px); }

}

.daily-toast-wrap{ position:fixed; top:18px; right:18px; z-index:1200; display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
.daily-toast{

}

.daily-toast .body span{ opacity:.85; font-size:12.5px; }

/* 單本書今日任務進度：改用進度條卡片，不用整段文字說明 */
.progress-toast{ flex-direction:column; gap:8px; min-width:200px; align-items:stretch; }
.progress-toast-head{ display:flex; align-items:center; gap:8px; }
.progress-toast-head .icon{ font-size:16px; }

.progress-toast-head .frac{ font-family:'JetBrains Mono',monospace; font-size:12px; opacity:.9; }
.progress-toast-bar{ height:8px; border-radius:999px; background:rgba(255,255,255,.28); overflow:hidden; }
.progress-toast-bar .fill{ height:100%; border-radius:999px; background:var(--brass); transition:width .35s ease; }

@keyframes toast-in{ from{ opacity:0; transform:translateX(16px); } to{ opacity:1; transform:translateX(0); } }
@keyframes toast-out{ from{ opacity:1; transform:translateX(0); } to{ opacity:0; transform:translateX(16px); } }

/* ============================================================

.app-shell{ display:block; }

/* 首頁：全螢幕島嶼；進入場所後顯示內容 + 頂部列 */

.app-shell.mode-place .island-map-wrap{ display:none; }
.app-shell.mode-place .main-content{ display:block; }

/* 島嶼首頁：隱藏頂部 header，讓島嶼佔滿畫面 */

  display:none !important;
}

}

}

}

/* 島嶼右上角：冒險者資訊 */

/* ---------- 主線任務公佈欄 / 左側按鈕 / 徽章動畫 ---------- */
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0; }
.mission-fab{
  position:fixed; left:18px; top:50%; transform:translateY(-50%);
  z-index:500; display:none; flex-direction:row; align-items:center; gap:8px;
  pointer-events:auto;
  background:linear-gradient(180deg, #8B5A2B 0%, #6B4226 100%);
  color:#F5E6C8; border:2px solid #C4A574; border-radius:999px;
  padding:10px 16px; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.28);
  font-family:'Fraunces',serif; font-weight:600; font-size:14px;
  letter-spacing:0.06em;
  transition:transform .15s ease, box-shadow .15s ease;
}
.mission-fab:hover{ transform:translateY(-50%) scale(1.04); box-shadow:0 8px 22px rgba(0,0,0,.34); }
.mission-fab-icon{ font-size:18px; line-height:1; }
.mission-fab-text{ white-space:nowrap; }
.mission-fab-dot{
  position:absolute; top:4px; right:4px; width:10px; height:10px;
  border-radius:50%; background:var(--danger); border:2px solid #F5E6C8;
}
body.on-island .mission-fab,
body:has(.app-shell.mode-island) .mission-fab{ display:inline-flex; }
body.in-place .mission-fab{ display:inline-flex; top:auto; bottom:80px; transform:none; }
body.in-place .mission-fab:hover{ transform:scale(1.04); }

.mission-overlay.daily-overlay{
  background:rgba(20,16,12,.62);

  z-index:1000;
  pointer-events:auto;
}

  z-index:2;
}
.mission-board-wrap{
  display:flex; flex-direction:column; align-items:center; gap:12px;
  width:min(95vw, 95vh * 1024 / 572);
  max-width:95vw;
  max-height:95vh;
}
.mission-board{
  width:100%;

  max-height:calc(95vh - 56px);

/* 徽章獲得動畫 */
.badge-anim-overlay{
  position:fixed; inset:0; z-index:1300;
  display:flex; align-items:center; justify-content:center;

  backdrop-filter:blur(4px);
}
.badge-anim-card{
  position:relative;
  text-align:center;

}
@keyframes badgePop{
  0%{ opacity:0; transform:scale(.6) translateY(20px); }
  100%{ opacity:1; transform:scale(1) translateY(0); }
}
.badge-anim-rays{
  position:absolute; inset:-30%;

@keyframes raysSpin{ to{ transform:rotate(360deg); } }

  to{ transform:translateY(-8px) scale(1.08); }

/* 場所頁全螢幕：背景與一般模式完全相同（原本紙張漸層） */

.vocab-card.mastered::after{
  content:'精熟';
  position:absolute; top:10px; right:-30px; width:120px;
  transform:rotate(35deg); text-align:center;
  background:var(--ledger-green); color:#fff; font-family:'JetBrains Mono',monospace;
  font-size:11px; font-weight:700; letter-spacing:.15em; padding:3px 0;
  box-shadow:0 1px 3px rgba(0,0,0,.25); pointer-events:none; z-index:2;
}

.vocab-stats-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }
@media (max-width:720px){ .vocab-stats-grid{ grid-template-columns:1fr; } }
.vocab-chart-card{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px 18px;
}
.vocab-chart-card h3{ font-family:'Fraunces',serif; font-size:14px; font-weight:600; margin:0 0 10px; text-align:center; color:var(--ink); }
.vocab-pie-legend{ display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; }
.vocab-pie-legend .legend-item{ display:flex; align-items:center; }
.legend-dot{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:7px; flex-shrink:0; }

/* ---------- 單字本：展開式圖表／複習進度／排序分組 ---------- */
.vocab-fold{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  box-shadow:var(--shadow); margin-bottom:14px; overflow:hidden;
}
.vocab-fold > summary{
  cursor:pointer; list-style:none; padding:12px 16px; font-family:'Fraunces',serif; font-weight:600; font-size:14.5px;
  display:flex; align-items:center; justify-content:space-between; gap:10px; user-select:none;
}
.vocab-fold > summary::-webkit-details-marker{ display:none; }
.vocab-fold > summary::after{ content:'▸'; color:var(--ink-soft); transition:transform .15s ease; }
.vocab-fold[open] > summary::after{ transform:rotate(90deg); }
.vocab-fold > summary:hover{ background:var(--ledger-green-soft); }
.vocab-fold .fold-body{ padding:4px 16px 16px; }
.vocab-fold .fold-sub{ font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:400; color:var(--ink-soft); margin-left:auto; margin-right:8px; }
.vocab-fold .vocab-stats-grid{ margin-bottom:0; }

.review-stack{ display:flex; height:16px; border-radius:999px; overflow:hidden; border:1px solid var(--card-border); background:#fff; margin:6px 0 10px; }
.review-stack span{ display:block; height:100%; }
.review-legend{ display:flex; flex-wrap:wrap; gap:6px 16px; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); margin-bottom:12px; }
.review-legend .legend-item{ display:flex; align-items:center; }
.review-note{ font-size:12px; color:var(--ink-soft); line-height:1.6; margin:8px 0 12px; }
.review-steps{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.review-step{
  font-family:'JetBrains Mono',monospace; font-size:11px; padding:3px 9px; border-radius:999px;
  background:var(--brass-soft); color:#72530f; border:1px solid var(--brass);
}

.vocab-toolbar{ display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin:0 0 14px; }
.vocab-toolbar label{ display:flex; align-items:center; gap:6px; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-soft); }
.vocab-toolbar select{
  font-family:'Inter',sans-serif; font-size:13px; padding:6px 10px; border:1px solid var(--card-border);
  border-radius:6px; background:#fff; cursor:pointer; color:var(--ink);
}

.vocab-group{ margin-bottom:12px; }
.vocab-group > summary{
  cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px; padding:8px 4px; margin-bottom:8px;
  font-family:'Fraunces',serif; font-weight:600; font-size:15px; border-bottom:1px dashed var(--card-border); user-select:none;
}
.vocab-group > summary::-webkit-details-marker{ display:none; }
.vocab-group > summary::before{ content:'▸'; color:var(--ink-soft); font-size:12px; transition:transform .15s ease; }
.vocab-group[open] > summary::before{ transform:rotate(90deg); }
.vocab-group .g-count{ margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:400; color:var(--ink-soft); }

.vocab-card .v-actions{ align-items:center; gap:12px; }
.v-speak{ background:none; border:1px solid var(--card-border); border-radius:999px; cursor:pointer; font-size:13px; padding:2px 9px; line-height:1.4; }
.v-speak:hover{ background:var(--ledger-green-soft); border-color:var(--ledger-green); }
.v-review{ display:flex; align-items:center; gap:8px; margin-top:2px; }
.v-review-bar{ flex:1; height:6px; border-radius:99px; background:var(--paper-line); overflow:hidden; }
.v-review-bar > span{ display:block; height:100%; border-radius:inherit; transition:width .25s ease; }
.v-review-txt{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-soft); white-space:nowrap; }

/* ---------- 讀書時間 ---------- */
.study-timer-card{
  background:var(--ledger-green-soft); border-radius:var(--radius); padding:28px 20px;
  text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px;
}
.study-timer-label{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; }
.study-timer-display{ font-family:'JetBrains Mono',monospace; font-size:42px; font-weight:700; color:var(--ledger-green); letter-spacing:.03em; }
.study-timer-sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:6px; }
.study-stat-num{ font-family:'Fraunces',serif; font-size:26px; font-weight:600; color:var(--ledger-green); }
.study-list{ display:flex; flex-direction:column; gap:8px; }
.study-row{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:12px 16px; display:flex; justify-content:space-between; align-items:center;
  gap:10px; flex-wrap:wrap;
}
.study-row-main{ display:flex; flex-direction:column; gap:3px; min-width:0; }
.study-row-time{ font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink); }
.study-row-note{ font-size:12.5px; color:var(--ink-soft); }
.study-row-side{ display:flex; align-items:center; gap:14px; flex-shrink:0; }
.study-row-duration{ font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; color:var(--ledger-green); }
.vocab-card .v-word{ font-family:'Fraunces',serif; font-size:18px; font-weight:600; }
.cefr-tag{
  font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:700; flex-shrink:0;
  background:var(--cefr-color, var(--brass)); color:#fff; padding:2px 8px; border-radius:999px;
}
.vocab-card .v-translation{ font-size:14px; color:var(--ink-soft); }
.vocab-card .v-actions{ display:flex; justify-content:flex-end; margin-top:2px; }
.vocab-card .v-del{ background:none; border:none; color:var(--danger); cursor:pointer; font-size:12px; text-decoration:underline; padding:0; }
.vocab-seed-btn{
  background:#fff; border:1px dashed var(--card-border); color:var(--ink-soft); border-radius:var(--radius);
  padding:9px 16px; font-size:13px; cursor:pointer; font-family:'Inter',sans-serif; margin-top:10px;
}
.vocab-seed-btn:hover{ border-color:var(--ledger-green); color:var(--ledger-green); }
.vocab-quiz-word-input{
  width:100%; font-family:'JetBrains Mono',monospace; font-size:20px; text-align:center; padding:14px;
  border:2px solid var(--card-border); border-radius:6px; margin-bottom:14px; background:#fff;
}
.vocab-quiz-word-input:focus{ outline:2px solid var(--ledger-green); }
.vocab-quiz-select{
  font-family:'Inter',sans-serif; font-size:14px; padding:9px 14px; border:1px solid var(--card-border);
  border-radius:6px; background:#fff; min-width:220px; cursor:pointer;
}
.vocab-quiz-prompt{ text-align:center; font-size:22px; font-weight:600; font-family:'Fraunces',serif; margin:6px 0 16px; }
.vocab-quiz-hint{ text-align:center; font-size:12px; color:var(--ink-soft); margin:-6px 0 14px; }

/* ---------- 遊戲模式：選單 / 記憶配對 / 打字挑戰 / 字母重組 / 聽力選擇 ---------- */
.game-menu-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:14px; margin-top:18px; }
.game-menu-card{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:20px 16px; text-align:center; cursor:pointer;
  font-family:inherit; transition:transform .12s ease, box-shadow .12s ease;
}
.game-menu-card:hover{ transform:translateY(-2px); box-shadow:0 4px 10px rgba(0,0,0,.08); border-color:var(--ledger-green); }
.game-menu-card .g-icon{ font-size:30px; margin-bottom:8px; }
.game-menu-card .g-name{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; margin-bottom:4px; }
.game-menu-card .g-desc{ font-size:12px; color:var(--ink-soft); line-height:1.5; }

.memory-topbar{ display:flex; justify-content:space-between; align-items:center; font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--ink-soft); margin-bottom:12px; flex-wrap:wrap; gap:8px; }
.memory-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:10px; }
.memory-tile{ position:relative; aspect-ratio:1/0.85; perspective:600px; cursor:pointer; }
.memory-tile .mt-inner{ position:relative; width:100%; height:100%; transition:transform .35s ease; transform-style:preserve-3d; }
.memory-tile.flipped .mt-inner, .memory-tile.matched .mt-inner{ transform:rotateY(180deg); }
.memory-tile .mt-face{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
  border-radius:6px; padding:6px; backface-visibility:hidden; font-size:13px; font-family:'Inter',sans-serif;
  border:1.5px solid var(--card-border); box-shadow:var(--shadow); word-break:break-word; overflow:hidden;
}
.memory-tile .mt-back{ background:var(--ledger-green); color:#fff; font-size:20px; }
.memory-tile .mt-front{ background:#fff; transform:rotateY(180deg); font-weight:600; }
.memory-tile.matched .mt-front{ background:var(--ledger-green-soft); border-color:var(--ledger-green); color:var(--ledger-green); }
.memory-tile.wrong-flash .mt-front{ background:#f7e3e0; border-color:var(--danger); color:var(--danger); }

.typing-timer{
  font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; text-align:center;
  padding:6px 14px; border-radius:999px; background:var(--brass-soft); color:#72530f; display:block; width:fit-content; margin:0 auto 10px;
}
.typing-timer.low{ background:#f7e3e0; color:var(--danger); }
.typing-stats{ display:flex; justify-content:center; gap:18px; font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; }

.scramble-tiles{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:14px 0 10px; min-height:52px; }
.scramble-letter{
  width:42px; height:42px; border-radius:6px; border:1.5px solid var(--card-border); background:#fff;
  font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);
}
.scramble-letter:hover{ border-color:var(--ledger-green); }
.scramble-letter.used{ opacity:.25; cursor:default; pointer-events:none; }
.scramble-answer-row{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:16px; min-height:52px; padding:8px; border:1.5px dashed var(--card-border); border-radius:6px; }
.scramble-blank{
  width:42px; height:42px; border-radius:6px; border:1.5px solid var(--card-border); background:#fbfaf6;
  font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.scramble-blank.filled{ background:var(--ledger-green-soft); border-color:var(--ledger-green); color:var(--ledger-green); }

.listen-btn{
  width:76px; height:76px; border-radius:50%; border:none; background:var(--ledger-green); color:#fff;
  font-size:28px; cursor:pointer; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center;
  margin:6px auto 16px; transition:transform .12s ease;
}
.listen-btn:hover{ transform:scale(1.06); }
.listen-hint{ text-align:center; font-size:12px; color:var(--ink-soft); margin:-8px 0 16px; }

/* ---------- 火山試煉塔 ---------- */
.volcano-lobby{
  position:relative;
  background:
    linear-gradient(180deg, rgba(20,10,6,.72) 0%, rgba(30,14,8,.78) 45%, rgba(12,8,6,.82) 100%),
    url('volcano.jpg') center center / cover no-repeat;
  color:#F5E6C8; border:1px solid #6B4226; border-radius:14px;
  padding:22px 20px 20px; box-shadow:var(--shadow);
  overflow:hidden;
  min-height:min(70vh, 640px);
}
.volcano-lobby h2{
  position:relative; z-index:1;
  font-family:'Fraunces',serif; font-size:24px; margin:0 0 4px;
  color:#FFD28A; text-align:center;
  text-shadow:0 2px 8px rgba(0,0,0,.55);
}
.volcano-lobby .vl-sub{
  text-align:center; color:#C4A574; font-size:13px; margin:0 0 18px;
}
.volcano-floors{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
.volcano-floor{
  position:relative; z-index:1;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  background:rgba(20,10,6,.55); border:1px solid rgba(196,165,116,.45);
  border-radius:12px; padding:12px 14px; cursor:pointer;
  transition:transform .12s ease, background .12s ease, border-color .12s ease;
  backdrop-filter:blur(2px);
}
.volcano-floor:hover{ transform:translateY(-1px); background:rgba(255,248,230,.14); }
.volcano-floor.disabled{ opacity:.45; cursor:not-allowed; }
.volcano-floor.disabled:hover{ transform:none; }
.volcano-floor .fl-icon{ font-size:28px; line-height:1; width:36px; text-align:center; }
.volcano-floor .fl-info{ flex:1; min-width:140px; }
.volcano-floor .fl-name{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; color:#FFE2A8; }
.volcano-floor .fl-desc{ font-size:12px; color:#C4A574; margin-top:2px; }
.volcano-floor .fl-count{
  font-family:'JetBrains Mono',monospace; font-size:12px;
  background:rgba(0,0,0,.25); border-radius:999px; padding:4px 10px; color:#F5E6C8;
}
.volcano-floor .fl-heat{
  height:8px; flex:1; min-width:80px; max-width:140px;
  background:rgba(0,0,0,.3); border-radius:99px; overflow:hidden;
}
.volcano-floor .fl-heat > i{
  display:block; height:100%; border-radius:99px;
  background:linear-gradient(90deg, #D4A017, #E07A5F, #C45C4A);
}
.volcano-floor[data-floor="4"] .fl-heat > i{ background:linear-gradient(90deg,#fff,#FFE08A,#FF6B3D); }
.volcano-floor[data-floor="3"] .fl-heat > i{ background:linear-gradient(90deg,#E07A5F,#C45C4A); }
.volcano-floor[data-floor="2"] .fl-heat > i{ background:linear-gradient(90deg,#D4A017,#E07A5F); }
.volcano-floor[data-floor="1"] .fl-heat > i{ background:linear-gradient(90deg,#8B6914,#C4A574); }
.volcano-actions{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:8px; }
.volcano-actions .solid-btn{
  background:linear-gradient(180deg,#C45C4A,#8B3A2A); border:none;
}
.volcano-actions .solid-btn:hover{ filter:brightness(1.08); }
.volcano-chip-row{ justify-content:center; margin-bottom:12px; }
.volcano-chip-row .chip{
  background:rgba(255,248,230,.1); color:#F5E6C8; border-color:rgba(196,165,116,.4);
}
.volcano-chip-row .chip.active{
  background:#C45C4A; border-color:#C45C4A; color:#fff;
}
.volcano-lobby .review-toggle{ color:#C4A574; justify-content:center; }
.volcano-lobby .review-toggle label{ color:#C4A574; }
.flash-wrap .heat-tag{
  display:inline-block; font-size:11px; font-family:'JetBrains Mono',monospace;
  padding:2px 8px; border-radius:999px; margin-left:6px;
  background:#FBF0D0; color:#8B3A2A; vertical-align:middle;
}
.flash-wrap .floor-banner{
  text-align:center; font-family:'Fraunces',serif; font-size:13px;
  color:#8B3A2A; margin-bottom:6px;
}
.flash-wrap.lava-mode{
  position:relative;
  background:
    linear-gradient(180deg, rgba(25,12,10,.82) 0%, rgba(18,12,14,.88) 100%),
    url('Frog.jpg') center/cover no-repeat;
  border-radius:14px; padding:16px 14px 18px;
  border:1px solid rgba(224,122,95,.35);
  overflow:hidden;
}
.flash-wrap.lava-mode::before{
  content:'';
  position:absolute; inset:0;
  background:url('Frog.jpg') center/cover no-repeat;
  opacity:0.28;
  z-index:0;
  pointer-events:none;
}
.flash-wrap.lava-mode > *{
  position:relative;
  z-index:1;
}
.flash-wrap.lava-mode .flashcard{
  background:rgba(255,248,230,.96);
}
.flash-wrap.lava-mode .floor-banner{ color:#FFD28A; }
.flash-wrap.lava-mode .flash-progress{ color:#F5E6C8; }
.lava-timer-row{
  display:flex; align-items:center; gap:10px; margin:6px 0 12px;
}
.lava-timer-label{
  font-family:'JetBrains Mono',monospace; font-size:12px; color:#FFB070;
  white-space:nowrap; min-width:64px;
}
.lava-timer-track{
  flex:1; height:12px; border-radius:999px; overflow:hidden;
  background:rgba(0,0,0,.35); border:1px solid rgba(224,122,95,.4);
}
.lava-timer-fill{
  height:100%; width:100%;
  background:linear-gradient(90deg, #D4A017, #E07A5F, #C45C4A);
  transform-origin:left center;
  transition:width .2s linear;
}
.lava-timer-fill.urgent{
  background:linear-gradient(90deg, #FF6B3D, #C41E1E);
  animation:lavaPulse .5s ease infinite alternate;
}
@keyframes lavaPulse{
  from{ filter:brightness(1); }
  to{ filter:brightness(1.25); }
}
.lava-timer-fill.frozen{ transition:none; }
.flash-wrap.lava-mode .summary-card{
  background:rgba(255,248,230,.96);
}
/* 動態火山剖面 */
.volcano-stage{
  position:relative; z-index:1;
  display:flex; gap:16px; align-items:stretch;
  margin:12px 0 14px; flex-wrap:wrap;
}
.volcano-visual{
  position:relative;
  width:min(200px, 38%);
  min-width:150px;
  min-height:280px;
  border-radius:16px;
  background:
    radial-gradient(ellipse 80% 40% at 50% 8%, rgba(255,120,40,.55), transparent 70%),
    linear-gradient(180deg, #3a1810 0%, #5a2818 35%, #2a1810 100%);
  border:1px solid rgba(255,160,80,.35);
  overflow:hidden;
  box-shadow:inset 0 -30px 40px rgba(0,0,0,.35);
}
.volcano-visual::before{
  content:'';
  position:absolute; left:50%; top:0; transform:translateX(-50%);
  width:0; height:0;
  border-left:70px solid transparent;
  border-right:70px solid transparent;
  border-bottom:120px solid rgba(80,40,28,.9);
  filter:drop-shadow(0 0 12px rgba(255,100,30,.4));
  z-index:0;
}
.volcano-visual.dormant{
  background:linear-gradient(180deg, #1a2830 0%, #243840 40%, #152028 100%);
  border-color:rgba(140,200,220,.35);
}
.volcano-visual.dormant::before{
  border-bottom-color:rgba(60,90,100,.9);
  filter:drop-shadow(0 0 10px rgba(120,200,255,.35));
}
.volcano-status-badge{
  position:absolute; top:8px; left:50%; transform:translateX(-50%);
  z-index:3;
  font-family:'Fraunces',serif; font-size:12px;
  padding:4px 10px; border-radius:999px;
  background:rgba(0,0,0,.45); color:#FFE2A8;
  border:1px solid rgba(255,200,120,.4);
  white-space:nowrap;
}
.volcano-visual.dormant .volcano-status-badge{
  color:#C8F0FF; border-color:rgba(140,200,230,.5);
}
.volcano-layers{
  position:absolute; left:10px; right:10px; bottom:10px; top:48px;
  display:flex; flex-direction:column; gap:6px; z-index:2;
}
.volcano-layer-btn{
  flex:1;
  display:flex; align-items:center; justify-content:space-between;
  gap:6px; padding:6px 10px;
  border-radius:10px; border:1px solid rgba(255,200,120,.25);
  background:rgba(0,0,0,.28); color:#F5E6C8;
  cursor:pointer; font-family:'Fraunces',serif; font-size:12px;
  transition:transform .12s ease, background .12s ease;
}
.volcano-layer-btn:hover:not(:disabled){ transform:translateY(-1px); background:rgba(255,140,60,.22); }
.volcano-layer-btn:disabled{ opacity:.4; cursor:not-allowed; }
.volcano-layer-btn .vl-n{ font-weight:700; color:#FFD28A; }
.volcano-layer-btn .vl-c{ font-family:'JetBrains Mono',monospace; font-size:11px; color:#C4A574; }
.volcano-layer-btn[data-floor="4"]{ border-color:rgba(255,240,180,.45); }
.volcano-layer-btn[data-floor="3"]{ border-color:rgba(255,120,60,.4); }
.volcano-layer-btn[data-floor="2"]{ border-color:rgba(220,80,60,.4); }
.volcano-layer-btn[data-floor="1"]{ border-color:rgba(160,120,80,.4); }
.volcano-side{
  flex:1; min-width:200px;
  display:flex; flex-direction:column; gap:8px;
}
.volcano-stat-line{
  font-size:12.5px; color:#C4A574; line-height:1.5;

.review-setup-card{ text-align:center; padding:28px 24px; }

.review-toggle{ display:flex; align-items:center; justify-content:center; gap:8px; margin:14px 0 20px; font-size:13.5px; }
.flash-wrap{ max-width:600px; margin:0 auto; }
.flash-progress{ display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); margin-bottom:8px; }
.flash-bar{ height:4px; background:var(--card-border); border-radius:2px; overflow:hidden; margin-bottom:18px; }
.flash-bar .fill{ height:100%; background:var(--brass); transition:width .25s ease; }
.flashcard{
  background:var(--card); border:1px solid var(--card-border); box-shadow:var(--shadow);
  border-radius:var(--radius); padding:26px 24px; min-height:200px;
}
.flashcard .m-question{ font-family:'Fraunces',serif; font-size:18px; font-weight:500; line-height:1.6; margin:10px 0 20px; }
.choice-btn{
  width:100%; text-align:left; padding:11px 14px; margin-bottom:9px;
  border:1.5px solid var(--card-border); border-radius:4px; background:#fff; font-size:14.5px;
  cursor:pointer; display:flex; gap:10px; font-family:'Inter',sans-serif;
}
.choice-btn:hover{ border-color:var(--ledger-green); }
.choice-btn.picked{ border-color:var(--ink); background:#faf7ee; }
.choice-btn.reveal-correct{ border-color:var(--ledger-green); background:var(--ledger-green-soft); color:var(--ledger-green); font-weight:700; }
.choice-btn.reveal-wrong{ border-color:var(--danger); background:#f7e3e0; color:var(--danger); }
.choice-btn:disabled{ cursor:default; }
.fill-answer-input{
  width:100%; padding:11px 14px; border:1.5px solid var(--card-border); border-radius:4px;
  font-size:14.5px; margin-bottom:12px; font-family:'Inter',sans-serif;
}
.fill-answer-input:focus{ outline:2px solid var(--ledger-green); }
.result-banner{
  display:inline-flex; align-items:center; gap:8px; font-family:'Fraunces',serif; font-weight:700;
  font-size:14px; padding:6px 14px; border-radius:4px; margin-bottom:12px; border:2px solid; transform:rotate(-2deg);
}
.result-banner.ok{ color:var(--ledger-green); border-color:var(--ledger-green); background:var(--ledger-green-soft); }
.result-banner.no{ color:var(--danger); border-color:var(--danger); background:#f7e3e0; }
.correct-line{ font-size:13.5px; color:var(--ink-soft); margin-bottom:14px; }
.correct-line b{ color:var(--ledger-green); }
.flash-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:6px; }
.summary-card{ text-align:center; padding:34px 20px; }
.summary-card .score{ font-family:'JetBrains Mono',monospace; font-size:42px; font-weight:700; margin:8px 0; }
.summary-card .score span{ color:var(--brass); }

function guestUuid(){
  if(window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  return 'g-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

function readGuestTable(table){
  try{
    const raw = localStorage.getItem(GUEST_STORAGE_PREFIX + table);
    return raw ? JSON.parse(raw) : [];
  }catch(err){
    console.error('讀取本機資料失敗', table, err);
    return [];
  }
}

function writeGuestTable(table, rows){
  try{
    localStorage.setItem(GUEST_STORAGE_PREFIX + table, JSON.stringify(rows));
  }catch(err){
    console.error('寫入本機資料失敗', table, err);
  }
}

function clearGuestData(){
  Object.keys(localStorage)
    .filter(k=>k.startsWith(GUEST_STORAGE_PREFIX))

}

class LocalQueryBuilder{
  constructor(table){
    this.table = table;
    this.op = null;
    this.payload = null;
    this.upsertOpts = {};
    this.filters = [];
    this.orderCol = null;
    this.orderAsc = true;
    this.wantSingle = false;
    this.wantMaybeSingle = false;
    this.selectAfterWrite = false;
  }
  select(){
    if(this.op === null) this.op = 'select';
    else this.selectAfterWrite = true;
    return this;
  }
  insert(payload){ this.op = 'insert'; this.payload = payload; return this; }
  update(payload){ this.op = 'update'; this.payload = payload; return this; }
  upsert(payload, opts){ this.op = 'upsert'; this.payload = payload; this.upsertOpts = opts || {}; return this; }
  delete(){ this.op = 'delete'; return this; }
  eq(col, val){ this.filters.push([col, val]); return this; }
  order(col, opts){ this.orderCol = col; this.orderAsc = !opts || opts.ascending !== false; return this; }
  single(){ this.wantSingle = true; return this; }
  maybeSingle(){ this.wantMaybeSingle = true; return this; }
  _matches(row){
    return this.filters.every(([col, val]) => row[col] === val);
  }
  _execute(){
    const rows = readGuestTable(this.table);
    if(this.op === 'select'){
      let result = rows.filter(r=>this._matches(r));
      if(this.orderCol){
        result = result.slice().sort((a,b)=>{
          const av = a[this.orderCol], bv = b[this.orderCol];
          if(av === bv) return 0;
          return (av > bv ? 1 : -1) * (this.orderAsc ? 1 : -1);
        });
      }
      if(this.wantSingle || this.wantMaybeSingle){
        return { data: result[0] || null, error: null };
      }
      return { data: result, error: null };
    }
    if(this.op === 'insert'){
      const items = Array.isArray(this.payload) ? this.payload : [this.payload];
      const inserted = items.map(item=>({
        id: item.id || guestUuid(),
        created_at: item.created_at || new Date().toISOString(),
        ...item
      }));
      writeGuestTable(this.table, rows.concat(inserted));
      if(this.selectAfterWrite){
        return { data: this.wantSingle ? inserted[0] : inserted, error: null };
      }
      return { data: null, error: null };
    }
    if(this.op === 'update'){
      const updated = rows.map(r=> this._matches(r) ? { ...r, ...this.payload } : r);
      writeGuestTable(this.table, updated);
      return { data: null, error: null };
    }
    if(this.op === 'upsert'){
      const conflictCol = this.upsertOpts.onConflict || 'id';
      const conflictVal = this.payload[conflictCol];
      let found = false;
      const updated = rows.map(r=>{
        if(r[conflictCol] === conflictVal){ found = true; return { ...r, ...this.payload }; }
        return r;
      });
      if(!found){
        updated.push({ id: this.payload.id || guestUuid(), created_at: new Date().toISOString(), ...this.payload });
      }
      writeGuestTable(this.table, updated);
      return { data: null, error: null };
    }
    if(this.op === 'delete'){
      const remaining = rows.filter(r=>!this._matches(r));
      writeGuestTable(this.table, remaining);
      return { data: null, error: null };
    }
    return { data: null, error: { message: '不支援的本機操作' } };
  }
  then(resolve, reject){
    try{
      resolve(this._execute());
    }catch(err){
      if(reject) reject(err); else resolve({ data: null, error: { message: err.message } });
    }
  }
}

// 今天（含）到今年 12/31 還剩幾天，用來估算每本書的每日進度
function daysUntilYearEnd(){
  const now = new Date();
  const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const yearEnd = new Date(now.getFullYear(), 10, 15);
  const diff = Math.round((yearEnd - todayMidnight) / 86400000) + 1;
  return Math.max(diff, 1);
}

let activeDailyTasks = [];
let activeBonusTask = null; // 今天的「加碼任務」：份量很小，寫少少就能拿特別徽章

// 從還沒排進主線任務的書裡面，挑一本出一個份量很小（1 頁）的加碼任務，
// 讓人有「寫少少也有獎勵」的感覺；如果每本書都已經在主線任務裡了，就從全部未寫完的書裡選。
// seedOffset：預設 0（每天固定選同一本），手動按「換一個」時會帶入隨機值，確保換得到不同的書。
function createBonusTask(excludeBooks, mainTasks, seedOffset = 0){
  const BONUS_QUOTA = 1;
  const notFull = book=>{
    const target = Number(book.target) || 0;
    return !target || totalFor(book.id) < target;
  };
  const pausedIds = getPausedBookIds();
  const notPaused = book=>!pausedIds.includes(book.id);
  const candidates = books.filter(book=>notFull(book) && notPaused(book) && !excludeBooks.includes(book));
  const pool = candidates.length ? candidates : books.filter(book=>notFull(book) && notPaused(book));
  if(!pool.length) return null;

  const book = pool[(dailyIndex() + seedOffset) % pool.length];
  const target = Number(book.target) || 0;
  const written = mergedRangesFor(book.id);
  // 如果這本書剛好也在今天的主線任務裡（例如所有書都排滿了才退回選這本），
  // 要把主線任務已經預定的範圍也算進去，避免加碼任務跟主線任務排到同一段頁數。
  const pending = (mainTasks || []).filter(t=>t.bookId===book.id).map(t=>[t.start, t.end]);
  const occupied = [...written, ...pending].sort((a,b)=>a[0]-b[0]);
  let start = 1;
  for(const [s,e] of occupied){
    if(start >= s && start <= e) start = e + 1;
  }
  const end = target ? Math.min(start + BONUS_QUOTA - 1, target) : start + BONUS_QUOTA - 1;
  if(start > end) return null;
  return { bookId: book.id, bookName: book.name, start, end };
}

function isBonusTaskDone(){
  if(!activeBonusTask) return false;
  const written = entriesByBook[activeBonusTask.bookId] || [];
  for(let page=activeBonusTask.start; page<=activeBonusTask.end; page++){
    if(!written.some(e=>Number(e.page_start) <= page && Number(e.page_end) >= page)) return false;
  }
  return true;
}

async function recordEarnedBadge(){

  const text = dailyBadges[(dailyIndex() + round - 1) % dailyBadges.length];

  }

const DAILY_TASK_EXP = 50;

const LEVEL_EXP_BASE = 100;

// 測驗／好玩模式答完一輪後呼叫：依答對題數（或配對組數）計算 EXP，樂觀更新畫面後再寫回 Supabase。
// 每個 session 只會呼叫一次（呼叫端會用 rewarded/finished 旗標防止重複觸發）。
async function awardQuizExp(amount, source){
  if(!amount || amount <= 0 || !currentUser) return;
  const levelBefore = experienceStats().level;
  quizExpEvents.push({ amount, source });
  showDailyToast({ icon:'✨', title:`+${amount} EXP`, body:`${quizExpSourceLabel(source)}完成，獲得經驗值！` });
  const levelAfter = experienceStats().level;
  if(levelAfter > levelBefore){
    showDailyToast({ icon:'🆙', title:'升級了！', body:`恭喜升上 Lv. ${levelAfter}！` });
  }
  const { error } = await db.from('quiz_exp').insert({ user_id: currentUser.id, amount, source });
  if(error) console.error('紀錄測驗EXP失敗', error);
}

function experienceStats(){
  const totalExp = earnedBadges.length * DAILY_TASK_EXP + earnedBonusBadges.length * BONUS_TASK_EXP + quizExpTotal();
  let level = 1;
  let spent = 0;
  let nextLevelExp = LEVEL_EXP_BASE;
  while(totalExp >= spent + nextLevelExp){
    spent += nextLevelExp;
    level += 1;
    nextLevelExp = LEVEL_EXP_BASE * level;
  }
  const currentLevelExp = totalExp - spent;
  return { totalExp, level, currentLevelExp, nextLevelExp, percent: (currentLevelExp / nextLevelExp) * 100 };
}

async function bumpStreak(){
  const today = todayStr();
  if(currentStreak.lastDate === today) return currentStreak; // 今天已經算過了，避免重複
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  const count = currentStreak.lastDate === yesterday ? currentStreak.count + 1 : 1;
  currentStreak = { count, lastDate: today }; // 先更新畫面，不等雲端回應
  const { error } = await db.from('streaks')
    .upsert({ user_id: currentUser.id, count, last_date: today }, { onConflict: 'user_id' });
  if(error) console.error('儲存連續天數失敗', error);
  return currentStreak;
}

// 總頁數（所有書目已寫頁數加總）與總完成率（只用有設定目標的書目計算）
function overallStats(){
  let totalPagesAll = 0;
  let targetedPages = 0, targetedTarget = 0, hasTarget = false;
  books.forEach(b=>{
    const t = totalFor(b.id);
    totalPagesAll += t;
    const target = Number(b.target) || 0;
    if(target > 0){
      hasTarget = true;
      targetedPages += t;
      targetedTarget += target;
    }
  });
  const rate = hasTarget ? Math.round(Math.min(100, (targetedPages / targetedTarget) * 100)) : null;
  return { totalPagesAll, rate };
}

function createDailyTaskPlan(){
  const pausedIds = getPausedBookIds();
  const available = books.filter(book=>{
    if(pausedIds.includes(book.id)) return false;
    const target = Number(book.target) || 0;
    return !target || totalFor(book.id) < target;
  });
  if(!available.length) return [];

  const N = available.length;
  const picksPerDay = Math.min(DAILY_PICK_COUNT, N);
  const daysLeft = daysUntilYearEnd();

  // 每本書目前的「完成率」（已寫頁數 / 目標頁數）。
  // 沒設定目標頁數的書無法算完成率，視為 Infinity（排最後，只有名額多到排得到才會選進來）。
  function completionPctOf(book){
    const target = Number(book.target) || 0;
    if(!target) return Infinity;
    return totalFor(book.id) / target;
  }

  // 完全依完成率由低到高排序，直接取完成率最低的 picksPerDay 本，
  // 不再另外保留輪替名額——4 個名額都給目前進度最落後的講義。
  // 完成率打平時，選書本清單中排比較後面（畫面上比較靠下）的那一本。
  const selectedBooks = available
    .map((book, idx)=>({ book, idx }))
    .sort((a,b)=> completionPctOf(a.book) - completionPctOf(b.book) || b.idx - a.idx)
    .slice(0, picksPerDay)
    .map(x=>x.book);

  const plan = [];
  const pendingRangesByBook = {}; // 同一天同一本書被排到第二次時，避免跟這次剛排好的範圍重疊
  for(let i=0; i<selectedBooks.length; i++){
    const book = selectedBooks[i];
    const target = Number(book.target) || 0;
    const writtenPages = totalFor(book.id); // 用實際寫過的頁數（而非最後一頁）估算剩餘量，跳著寫也準確
    const remainingPages = target ? Math.max(target - writtenPages, 0) : null;

    // 依目前的輪替規則，估計這本書在期限前大概還會被排到幾次，
    // 再用剩餘頁數 / 剩餘次數，算出這次應該要讀幾頁，才趕得上目標日期。
    const turnsRemaining = Math.max(1, Math.round(daysLeft * picksPerDay / N));
    const dailyQuota = remainingPages != null
      ? Math.max(1, Math.ceil(remainingPages / turnsRemaining))
      : 2; // 沒設定目標頁數的書，維持每次 2 頁的預設份量

    // 優先安排「最前面還沒寫過的缺口」，而不是永遠往書本最後面推進，
    // 這樣如果之前跳著寫，會先補齊中間漏掉的部分，補完才會繼續往後排。
    const written = mergedRangesFor(book.id);
    const pending = pendingRangesByBook[book.id] || [];
    const occupied = [...written, ...pending].sort((a,b)=>a[0]-b[0]);
    let start = 1;
    for(const [s,e] of occupied){
      if(start >= s && start <= e) start = e + 1;
    }
    const end = target ? Math.min(start + dailyQuota - 1, target) : start + dailyQuota - 1;
    if(start <= end){
      plan.push({ bookId:book.id, bookName:book.name, start, end });
      pendingRangesByBook[book.id] = [...pending, [start, end]];
    }
  }
  return plan;
}

// 拿今天的任務排程：先看記憶體快取，沒有就去 Supabase 查，還是沒有才現算一份並存回去。
// 這樣同一天在不同裝置打開，看到的任務範圍、完成通知狀態都會一致。
async function getDailyTaskPlan(){
  const date = todayStr();
  if(currentDailyPlan && currentDailyPlan.date === date) return currentDailyPlan;

  if(currentUser){
    const { data, error } = await db
      .from('daily_plans').select('*').eq('user_id', currentUser.id).eq('plan_date', date).maybeSingle();
    if(error) console.error('讀取今日任務排程失敗', error);
    if(data){
      currentDailyPlan = { date, round: Math.max(1, Number(data.tasks?.round) || 1), tasks: data.tasks?.items || data.tasks || [], bonus: data.bonus || null, notified: !!data.notified, bonusNotified: !!data.bonus_notified };
      return currentDailyPlan;
    }
  }

  const tasks = createDailyTaskPlan();
  const usedBooks = tasks.map(t=>books.find(b=>b.id===t.bookId)).filter(Boolean);
  const bonus = createBonusTask(usedBooks, tasks);
  currentDailyPlan = { date, round:1, tasks, bonus, notified:false, bonusNotified:false };
  if(currentUser){
    const { error } = await db.from('daily_plans').upsert({
      user_id: currentUser.id, plan_date: date, tasks: { round:1, items:tasks }, bonus, notified:false, bonus_notified:false
    }, { onConflict: 'user_id,plan_date' });
    if(error) console.error('儲存今日任務排程失敗', error);
  }
  return currentDailyPlan;
}

function completedDailyPages(plan){
  return plan.reduce((count, task)=>{
    const written = entriesByBook[task.bookId] || [];
    for(let page=task.start; page<=task.end; page++){
      if(written.some(entry=>Number(entry.page_start) <= page && Number(entry.page_end) >= page)) count++;
    }
    return count;
  }, 0);
}

// 算出目前這份每日任務清單的完成率（0~100）。沒有任務可寫時視為 100%，不會擋住重排。
function dailyCompletionPct(tasks){
  const totalPages = (tasks || []).reduce((sum,t)=>sum + t.end - t.start + 1, 0);
  if(!totalPages) return 100;
  const donePages = completedDailyPages(tasks);
  return Math.round(Math.min(100, (donePages / totalPages) * 100));
}

// 依目前完成率，更新「重排」按鈕是否可以按（要 100% 才能重排）
function updateReshuffleButtonState(){
  const btn = document.getElementById('dailyReshuffleBtn');
  if(!btn) return;
  const pct = dailyCompletionPct(activeDailyTasks);
  const locked = pct < 100;
  btn.classList.toggle('locked', locked);
  btn.title = locked ? `完成今天的任務（目前 ${pct}%）才能重排唷` : '用最新的資料重新安排今天的任務';
}

// 算出某本書在今天的任務範圍裡，已經寫了幾頁（用來跳出可愛的小進度提示）
function taskProgressForBook(bookId){
  const task = activeDailyTasks.find(t=>t.bookId===bookId);
  if(!task) return null;
  const written = entriesByBook[bookId] || [];
  let done = 0;
  for(let page=task.start; page<=task.end; page++){
    if(written.some(entry=>Number(entry.page_start) <= page && Number(entry.page_end) >= page)) done++;
  }
  const total = task.end - task.start + 1;
  return { done, total, bookName: task.bookName };
}

// 清掉今天已經產生的「主線任務」重新算一次（要今天的任務全部完成 100% 才能重排）。
// 加碼任務不會被這裡影響，會維持原本的那個；想換加碼任務請按它旁邊的「換一個」按鈕。
async function reshuffleDailyTasks(force){
  const plan = await getDailyTaskPlan();
  const pct = dailyCompletionPct(plan.tasks || []);
  if(pct < 100 && !force){
    showDailyToast({ icon:'🔒', title:'先寫完今天的任務唷', body:`目前完成 ${pct}%，全部寫完才能重排喔！` });
    return;
  }

  const newTasks = createDailyTaskPlan();

  currentDailyPlan = {
    date: plan.date,
    round: dailyRoundNumber(plan) + 1,
    tasks: newTasks,
    bonus: plan.bonus,           // 加碼任務保留原樣，不會被主線重排換掉
    notified: false,             // 這一輪要重新全部寫完，才會再通知、再拿一次徽章
    bonusNotified: plan.bonusNotified
  };

  if(currentUser){
    const { error } = await db.from('daily_plans').upsert({
      user_id: currentUser.id, plan_date: plan.date, tasks: { round: currentDailyPlan.round, items:newTasks }, bonus: plan.bonus,
      notified: false, bonus_notified: plan.bonusNotified
    }, { onConflict: 'user_id,plan_date' });
    if(error) console.error('重排主線任務失敗', error);
  }
  await showDailyTask();
}

// 只換「加碼任務」，不會動到主線任務，隨時都能按，沒有 100% 限制。
async function reshuffleBonusTask(){
  const plan = await getDailyTaskPlan();
  const usedBooks = (plan.tasks || []).map(t=>books.find(b=>b.id===t.bookId)).filter(Boolean);
  // 帶入隨機值，確保換到的跟原本不是同一本（不然同一天用同樣邏輯選出來的一定一樣）
  const seedOffset = 1 + Math.floor(Math.random() * 97);
  const newBonus = createBonusTask(usedBooks, plan.tasks, seedOffset);

  currentDailyPlan = { ...plan, bonus: newBonus, bonusNotified: false };

  if(currentUser){
    const { error } = await db.from('daily_plans').upsert({
      user_id: currentUser.id, plan_date: plan.date, tasks: { round: dailyRoundNumber(plan), items:plan.tasks }, bonus: newBonus,
      notified: plan.notified, bonus_notified: false
    }, { onConflict: 'user_id,plan_date' });
    if(error) console.error('換加碼任務失敗', error);
  }
  await showDailyTask();
}

const NOTIFY_ASK_ONCE_KEY = 'daily-notify-permission-asked';
function requestNotifyPermission(){
  if(typeof Notification === 'undefined') return;
  if(Notification.permission !== 'default') return; // 已經允許或封鎖過，不用再問
  if(localStorage.getItem(NOTIFY_ASK_ONCE_KEY)) return; // 已經主動問過一次了，不再自動彈出
  localStorage.setItem(NOTIFY_ASK_ONCE_KEY, '1');
  Notification.requestPermission();
}

function sendBrowserNotification(title, body){
  if(typeof Notification === 'undefined') return;
  if(Notification.permission === 'granted'){
    try{ new Notification(title, { body, icon:'', tag:'daily-task-complete' }); }
    catch(_){ /* Some environments (e.g. iOS Safari PWA-less) don't support this. */ }
  }
}

// 每日任務全部完成時呼叫一次：記徽章、記連續天數、檢查成就，並把「已通知」狀態存進 Supabase
// 如果這一輪是重排後的第 2 輪以上，完成提示文字會略有不同，但拿到的仍是同一組每日徽章。
async function notifyDailyComplete(){
  if(!currentDailyPlan || currentDailyPlan.notified) return; // 今天已經通知過了，避免重複跳出
  currentDailyPlan.notified = true;
  const isReroll = dailyRoundNumber() > 1;
  const levelBefore = experienceStats().level;
  await recordEarnedBadge();
  await bumpStreak();
  await checkAchievements();
  const title = isReroll ? '加場任務也完成了！🎉' : '今日任務已完成！🎉';
  const body = (isReroll ? '重排後的新一輪任務也全部寫完，一樣拿到今天的徽章！' : '恭喜你完成今天的所有任務，記得看看獲得的徽章～') + ` +${DAILY_TASK_EXP} EXP`;
  const badgeText = dailyBadges[(dailyIndex() + dailyRoundNumber() - 1) % dailyBadges.length];
  playBadgeAnimation(badgeText);
  if(typeof petGainExp === 'function') petGainExp(30, 'daily');
  showDailyToast({ icon: '🏅', title, body });
  sendBrowserNotification(title, body);
  const levelAfter = experienceStats().level;
  if(levelAfter > levelBefore){
    showDailyToast({ icon:'🆙', title:'升級了！', body:`恭喜升上 Lv. ${levelAfter}！` });
  }
  if(currentUser){
    const { error } = await db.from('daily_plans')
      .update({ notified: true }).eq('user_id', currentUser.id).eq('plan_date', currentDailyPlan.date);
    if(error) console.error('更新今日完成通知狀態失敗', error);
  }
}

// 加碼任務份量很小，寫完就給一個特別徽章當小獎勵（同一天只通知一次），狀態存進 Supabase

async function updateDailyProgress(){
  const progressEl = document.getElementById('dailyProgress');
  const openBtn = document.getElementById('openDailyBtn');
  const total = activeDailyTasks.reduce((count, task)=>count + task.end - task.start + 1, 0);
  if(activeBonusTask && isBonusTaskDone()) await notifyBonusComplete();
  if(!total){
    if(progressEl) progressEl.classList.add('hidden');
    if(openBtn) openBtn.classList.remove('has-pending');
    updateReshuffleButtonState();
    return;
  }
  const done = completedDailyPages(activeDailyTasks);
  if(progressEl){
    progressEl.textContent = `當前進度 ${done} / ${total} 頁`;
    progressEl.classList.remove('hidden');
  }
  if(openBtn) openBtn.classList.toggle('has-pending', done < total);
  if(done >= total) await notifyDailyComplete();
  updateReshuffleButtonState();
}

    taskEl.innerHTML = `<div class="task-sheet progress-sheet">

  updateReshuffleButtonState();
  const bonusBtn = document.getElementById('bonusReshuffleBtn');
  if(bonusBtn) bonusBtn.addEventListener('click', reshuffleBonusTask);
  const reshuffleBtn = document.getElementById('dailyReshuffleBtn');
  if(reshuffleBtn && !reshuffleBtn.dataset.bound){
    reshuffleBtn.dataset.bound = '1';
    reshuffleBtn.addEventListener('click', async ()=>{
      const plan = await getDailyTaskPlan();
      const pct = dailyCompletionPct(plan.tasks || []);
      if(pct < 100){
        const usedKey = passwordReshuffleUsedKey();
        if(localStorage.getItem(usedKey) === '1'){
          showDailyToast({ icon:'🔒', title:'密碼破例只能用一次', body:'已經用過囉，寫到 100% 才能再重排唷' });
          return;
        }
        const input = prompt('今天還沒寫完，輸入密碼可以破例重排一次：');
        if(input === null) return;
        if(input !== RESHUFFLE_PASSWORD){
          showDailyToast({ icon:'🔒', title:'密碼不對', body:'先寫完今天的任務，或輸入正確密碼才能重排' });
          return;
        }
        localStorage.setItem(usedKey, '1');
        await reshuffleDailyTasks(true);
        return;
      }
      await reshuffleDailyTasks(false);
    });
  }
  await updateDailyProgress();
  await checkAchievements();

}

function checkConfig(){

async function handleAuthSubmit(e){

function openChangePwModal(){
  document.getElementById('oldPassword').value = '';
  document.getElementById('newPassword').value = '';
  document.getElementById('newPasswordConfirm').value = '';
  setChangePwMsg('');
  document.getElementById('changePwOverlay').classList.remove('hidden');
  document.getElementById('oldPassword').focus();
}
function closeChangePwModal(){
  document.getElementById('changePwOverlay').classList.add('hidden');
}
function setChangePwMsg(text, type){
  const el = document.getElementById('changePwMsg');
  el.textContent = text || '';
  el.className = 'auth-msg' + (type ? ' ' + type : '');
}

async function handleChangePwSubmit(e){
  e.preventDefault();
  const oldPassword = document.getElementById('oldPassword').value;
  const newPassword = document.getElementById('newPassword').value;
  const newPasswordConfirm = document.getElementById('newPasswordConfirm').value;
  const btn = document.getElementById('confirmPwBtn');

  if(newPassword !== newPasswordConfirm){
    setChangePwMsg('兩次輸入的新密碼不一致。', 'error');
    return;
  }
  if(newPassword === oldPassword){
    setChangePwMsg('新密碼不能跟目前密碼一樣。', 'error');
    return;
  }

  btn.disabled = true;
  setChangePwMsg('確認中…');

  // 先用「目前密碼」重新登入一次，確認使用者真的知道原密碼
  const { error: verifyError } = await supabase.auth.signInWithPassword({
    email: currentUser.email,
    password: oldPassword
  });
  if(verifyError){
    setChangePwMsg('目前密碼不正確，請再確認一次。', 'error');
    btn.disabled = false;
    return;
  }

  // 驗證通過，才真的更新成新密碼
  const { error: updateError } = await supabase.auth.updateUser({ password: newPassword });
  btn.disabled = false;
  if(updateError){
    setChangePwMsg('修改失敗：' + updateError.message, 'error');
    return;
  }

  setChangePwMsg('密碼修改成功！', 'success');
  setTimeout(closeChangePwModal, 1200);
}

function vocabCefrCounts(){
  const counts = {};
  CEFR_LEVELS.forEach(l=> counts[l] = 0);
  vocab.forEach(v=>{ if(counts[v.cefr] !== undefined) counts[v.cefr]++; });
  return counts;
}

function cefrDataForChart(){
  const counts = vocabCefrCounts();
  return CEFR_LEVELS.map(l=>({ level:l, count: counts[l]||0, color: CEFR_COLORS[l] }));
}

function vocabBarChartSVG(){
  const data = cefrDataForChart();
  const max = Math.max(1, ...data.map(d=>d.count));
  const barW = 34, gap = 20, chartH = 130, baseY = 150, leftPad = 20;
  const width = leftPad*2 + data.length*(barW+gap) - gap;
  const bars = data.map((d,i)=>{
    const x = leftPad + i*(barW+gap);
    const h = d.count === 0 ? 0 : Math.max(3, Math.round((d.count/max)*chartH));
    const y = baseY - h;
    return `
      <rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="4" fill="${d.color}"></rect>
      <text x="${x+barW/2}" y="${baseY+18}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#6b6659">${d.level}</text>
      <text x="${x+barW/2}" y="${h>0?y-6:baseY-6}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#2B2A26">${d.count}</text>
    `;
  }).join('');
  return `<svg viewBox="0 0 ${width} 176" width="100%" height="176" role="img" aria-label="各CEFR等級單字數量長條圖">
    <line x1="6" y1="${baseY}" x2="${width-6}" y2="${baseY}" stroke="#DAD3C1" stroke-width="1"></line>
    ${bars}
  </svg>`;
}

function polarToCartesian(cx, cy, r, angleDeg){
  const rad = (angleDeg - 90) * Math.PI / 180;
  return [cx + r*Math.cos(rad), cy + r*Math.sin(rad)];
}

function vocabPieChartSVG(){
  const data = cefrDataForChart().filter(d=>d.count>0);
  const total = data.reduce((s,d)=>s+d.count,0);
  const cx=90, cy=90, r=80;
  if(total === 0 || data.length === 1){
    const color = data[0] ? data[0].color : '#DAD3C1';
    return `<svg viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="各CEFR等級單字比例圓餅圖">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}"></circle>
    </svg>`;
  }
  let startAngle = 0;
  const slices = data.map(d=>{
    const angle = (d.count/total)*360;
    const endAngle = startAngle+angle;
    const largeArc = angle>180?1:0;
    const [x1,y1] = polarToCartesian(cx,cy,r,startAngle);
    const [x2,y2] = polarToCartesian(cx,cy,r,endAngle);
    const path = `M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`;
    const slice = `<path d="${path}" fill="${d.color}" stroke="#FCFAF5" stroke-width="1.5"><title>${d.level}: ${d.count}</title></path>`;
    startAngle = endAngle;
    return slice;
  }).join('');
  return `<svg viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="各CEFR等級單字比例圓餅圖">${slices}</svg>`;
}

function vocabStatsHTML(){

// 複習進度（遺忘曲線）：整體記憶保留率、四種狀態的分布條、今天該複習的單字數
function vocabReviewOverviewHTML(){
  if(vocab.length === 0) return '';
  const infos = vocab.map(vocabRetentionInfo);
  const avg = Math.round(infos.reduce((s,i)=>s+i.ret, 0) / infos.length * 100);
  const due = infos.filter(i=>i.due).length;
  const counts = {};
  REVIEW_BUCKETS.forEach(b=> counts[b.id] = 0);
  infos.forEach(i=> counts[i.bucket.id]++);
  const stack = REVIEW_BUCKETS.filter(b=>counts[b.id]>0).map(b=>
    `<span style="width:${counts[b.id]/vocab.length*100}%;background:${b.color}" title="${b.label}：${counts[b.id]} 個"></span>`
  ).join('');
  const legend = REVIEW_BUCKETS.map(b=>
    `<div class="legend-item"><span class="legend-dot" style="background:${b.color}"></span>${b.label} · ${counts[b.id]} 個</div>`
  ).join('');
  const steps = REVIEW_INTERVALS.map((d,i)=>`<span class="review-step">Lv${i}：${d} 天後</span>`).join('');
  return `
    <details class="vocab-fold" id="vocabReviewFold" ${vocabReviewOpen ? 'open' : ''}>
      <summary>🧠 複習進度（遺忘曲線）<span class="fold-sub">${due > 0 ? `今天該複習 ${due} 個` : '目前沒有需要複習的字 🎉'}</span></summary>
      <div class="fold-body">
        <div style="font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ink-soft);">整體記憶保留率 <b style="color:var(--ink);font-size:15px;">${avg}%</b>（共 ${vocab.length} 個單字）</div>
        <div class="review-stack">${stack}</div>
        <div class="review-legend">${legend}</div>
        <div class="review-note">
          依艾賓浩斯遺忘曲線，記憶會隨時間呈指數下降（R = e<sup>−t/S</sup>）。每次答對，複習間隔就拉長一階；答錯則退回兩階重新加強。保留率低於 90% 的單字視為「該複習」。
        </div>
        <div class="review-steps">${steps}</div>
        <div class="review-note" style="margin-top:8px;">複習請前往「🌋 火山試煉塔」挑戰 BOSS；每次答題會慢慢推進複習階段，不會一次到滿。</div>
      </div>
    </details>
  `;
}

function vocabWordExists(word, excludeId){
  const key = normalizeAnswer(word);
  return vocab.some(v => v.id !== excludeId && normalizeAnswer(v.word) === key);
}

// 「精熟」判定：在測驗／好玩模式（配對除外，因為配對沒有針對單一單字的對錯）裡連續答對達到
// VOCAB_MASTER_STREAK 次就標記為精熟；答錯會重置連續次數，但已經精熟過的單字不會被打回原形。
const VOCAB_MASTER_STREAK = 3;

/** 遺忘曲線進度：答對 +1 階、答錯 -2 階（不會一次到滿） */
function applyVocabReviewStage(v, correct){
  if(!v) return null;
  if(!vocabReviewState) loadVocabReviewState();
  const cur = getVocabReview(v);
  const before = cur.stage;
  const after = correct
    ? Math.min(REVIEW_MAX_STAGE, before + 1)
    : Math.max(0, before - 2);
  vocabReviewState[v.id] = { stage: after, last: new Date().toISOString() };
  saveVocabReviewState();
  v.review_stage = after;
  v.last_reviewed = vocabReviewState[v.id].last;
  try{
    db.from('vocab').update({ review_stage: v.review_stage, last_reviewed: v.last_reviewed }).eq('id', v.id)
      .then(res=>{ if(res && res.error) console.warn('複習進度未同步到雲端', res.error.message); });
  }catch(_e){}
  return { before, after, word: v.word, translation: v.translation||'', id: v.id, correct: !!correct };
}
async function recordVocabAnswer(vocabId, correct){
  const v = vocab.find(x=>x.id===vocabId);
  if(!v || !currentUser) return;
  playAnswerSound(correct);
  if(autoSpeakOn) setTimeout(()=>speakVocabWord(v.word), correct ? 380 : 200);
  applyVocabReviewStage(v, correct);
  v.correct_streak = correct ? (Number(v.correct_streak)||0) + 1 : 0;
  if(!v.mastered && v.correct_streak >= VOCAB_MASTER_STREAK){
    v.mastered = true;
  }
  const { error } = await db.from('vocab')
    .update({ correct_streak: v.correct_streak, mastered: v.mastered })
    .eq('id', vocabId);
  if(error) console.error('更新單字精熟狀態失敗', error);
}
