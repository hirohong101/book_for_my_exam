<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自我紀錄講義! Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper: #E9E4D8;
  --paper-line: #d9d2bf;
  --card: #FCFAF5;
  --card-border: #DAD3C1;
  --ink: #2B2A26;
  --ink-soft: #6b6659;
  --ledger-green: #2F5D50;
  --ledger-green-soft: #E4ECE9;
  --brass: #B0812C;
  --brass-soft: #F3E6C8;
  --danger: #A03A2E;
  --radius: 6px;
  --shadow: 0 1px 2px rgba(43,42,38,0.06), 0 4px 10px rgba(43,42,38,0.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    repeating-linear-gradient(180deg, transparent, transparent 27px, var(--paper-line) 28px),
    var(--paper);
  color:var(--ink);
  font-family:'Inter', sans-serif;
  min-height:100vh;
  padding:28px 20px 60px;
}
::selection{ background: var(--brass-soft); }
:focus-visible{ outline:2px solid var(--ledger-green); outline-offset:2px; border-radius:3px; }
.hidden{ display:none !important; }

.wrap{ max-width:980px; margin:0 auto; }

header.top{
  display:flex; justify-content:space-between; align-items:flex-end;
  gap:16px; margin-bottom:24px; flex-wrap:wrap;
}
.title-block h1{
  font-family:'Fraunces', serif; font-weight:600; font-size:clamp(28px,4vw,38px);
  margin:0 0 4px; letter-spacing:-0.01em;
}
.title-block .stamp{
  font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--ink-soft);
  letter-spacing:0.04em; text-transform:uppercase;
}
.header-actions{ display:flex; align-items:center; gap:10px; }
.avatar-btn{
  width:34px; height:34px; border-radius:50%; border:none; cursor:pointer; padding:0;
  background:var(--ledger-green); color:#fff; font-family:'Fraunces',serif; font-weight:600;
  font-size:15px; display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow); transition:transform .15s ease;
}
.avatar-btn:hover{ transform:scale(1.06); }
.user-badge{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); }
.daily-progress{
  padding:7px 10px; border:1px solid var(--brass); border-radius:999px;
  background:var(--brass-soft); color:#72530f; white-space:nowrap;
  font:700 12px 'JetBrains Mono',monospace;
}
.export-btn, .logout-btn{
  font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
  border:none; border-radius:var(--radius);
  padding:11px 18px; cursor:pointer; box-shadow:var(--shadow);
  display:inline-flex; align-items:center; gap:8px; transition:transform .12s ease, background .12s ease;
}
.export-btn{ background:var(--ledger-green); color:#fff; }
.export-btn:hover{ background:#264c41; transform:translateY(-1px); }
.logout-btn{ background:#fff; color:var(--danger); border:1px solid var(--card-border); }
.logout-btn:hover{ background:#f7f0ee; }
.export-btn svg{ width:15px; height:15px; }

/* ---------- 登入畫面 ---------- */
.auth-wrap{ max-width:380px; margin:8vh auto 0; }
.auth-card{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:32px 28px;
}
.auth-card h1{ font-family:'Fraunces',serif; font-size:26px; margin:0 0 4px; text-align:center; }
.auth-card .sub{ text-align:center; color:var(--ink-soft); font-size:13px; margin-bottom:22px; }
.auth-field{ display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
.auth-field label{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; }
.auth-field input{ font-family:'Inter',sans-serif; font-size:14px; padding:10px 12px; border:1px solid var(--card-border); border-radius:4px; background:#fff; }
.auth-submit{
  width:100%; background:var(--ledger-green); color:#fff; border:none; border-radius:4px;
  padding:11px; font-weight:600; font-size:14px; cursor:pointer; margin-top:4px;
}
.auth-submit:hover{ background:#264c41; }
.auth-submit:disabled{ opacity:0.6; cursor:default; }
.auth-toggle{ text-align:center; margin-top:16px; font-size:13px; color:var(--ink-soft); }
.auth-toggle button{ background:none; border:none; color:var(--ledger-green); font-weight:600; cursor:pointer; text-decoration:underline; padding:0; font-size:13px; }
.auth-msg{ font-size:13px; text-align:center; margin-top:12px; padding:8px; border-radius:4px; }
.auth-msg.error{ background:#f7e3e0; color:var(--danger); }
.auth-msg.success{ background:var(--ledger-green-soft); color:var(--ledger-green); }
.guest-divider{ display:flex; align-items:center; gap:10px; margin:18px 0 12px; color:var(--ink-soft); font-size:12px; }
.guest-divider::before, .guest-divider::after{ content:''; flex:1; height:1px; background:var(--card-border); }
.guest-mode-btn{
  width:100%; background:#fff; color:var(--ink); border:1px solid var(--card-border); border-radius:4px;
  padding:11px; font-weight:600; font-size:13.5px; cursor:pointer; font-family:'Inter',sans-serif;
}
.guest-mode-btn:hover{ background:var(--ledger-green-soft); border-color:var(--ledger-green); }
.guest-badge{
  font-family:'JetBrains Mono',monospace; font-size:11px; color:#72530f; background:var(--brass-soft);
  border:1px solid var(--brass); border-radius:999px; padding:3px 9px; white-space:nowrap;
}

/* ---------- 主應用程式 ---------- */
.overview{ margin-bottom:22px; }
.overview h2{ font-family:'Fraunces',serif; font-size:18px; font-weight:600; margin:0; }
.overview-head{ display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
.overview-badges{ display:flex; gap:8px; flex-wrap:wrap; }
.today-total{ font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink-soft); background:var(--brass-soft); padding:4px 10px; border-radius:20px; }
.today-total b{ color:var(--brass); font-size:15px; }
.today-total.grand-total{ background:var(--ledger-green-soft); font-size:11px; padding:3px 8px; }
.today-total.grand-total b{ color:var(--ledger-green); font-size:12.5px; }
.overview-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; }
@media (max-width:900px){ .overview-grid{ grid-template-columns:repeat(2, 1fr); } }
@media (max-width:520px){ .overview-grid{ grid-template-columns:1fr; } }
.overview-card{
  position:relative;
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:14px 16px; cursor:pointer; text-align:left;
  font-family:inherit; display:flex; flex-direction:column; gap:8px;
  border-left:4px solid var(--tab-color, var(--brass)); transition:transform .12s ease, box-shadow .12s ease;
}
.overview-card:hover{ transform:translateY(-1px); box-shadow:0 2px 4px rgba(43,42,38,0.08), 0 6px 14px rgba(43,42,38,0.08); }
@keyframes flipReorder{
  0%{
    transform: translate(var(--dx,0px), var(--dy,0px)) scale(0.96);
    box-shadow:0 2px 6px rgba(43,42,38,0.16), 0 10px 22px rgba(43,42,38,0.14), inset 0 0 0 2px var(--tab-color, var(--brass));
    filter:brightness(1.04);
  }
  55%{
    transform: translate(calc(var(--dx,0px) * 0.06), calc(var(--dy,0px) * 0.06)) scale(1.025);
    box-shadow:0 3px 8px rgba(43,42,38,0.16), 0 12px 24px rgba(43,42,38,0.14), inset 0 0 0 2px var(--tab-color, var(--brass));
  }
  100%{
    transform: translate(0,0) scale(1);
    box-shadow:var(--shadow);
    filter:brightness(1);
  }
}
.overview-card.reorder-move{
  animation: flipReorder 1400ms cubic-bezier(0.32, 0, 0.16, 1);
  z-index:5;
}
.overview-card.active{ outline:2px solid var(--tab-color, var(--ledger-green)); outline-offset:1px; }
.overview-card .name{ font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.overview-card .num{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); }
.overview-card .num b{ color:var(--ink); font-size:14px; }
.overview-bar{ height:8px; background:#fff; border:1px solid var(--card-border); border-radius:4px; overflow:hidden; }
.overview-bar-fill{ height:100%; background:var(--tab-color, var(--brass)); transition:width .35s ease; }
.overview-card .no-target{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); }

.layout{ display:grid; grid-template-columns:220px 1fr; gap:20px; align-items:start; }
@media (max-width:720px){ .layout{ grid-template-columns:1fr; } }

.shelf{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:10px; display:flex; flex-direction:column; gap:6px;
}
.shelf h2{
  font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase;
  letter-spacing:0.08em; color:var(--ink-soft); margin:4px 6px 2px; font-weight:700;
}
.book-tab{
  display:flex; align-items:center; gap:8px; text-align:left; width:100%;
  background:transparent; border:none; border-left:4px solid var(--tab-color, var(--ledger-green));
  border-radius:3px; padding:9px 10px; cursor:pointer; font-family:'Inter',sans-serif;
  font-size:14px; color:var(--ink); transition:background .12s ease;
}
.book-tab .name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.book-tab .pct{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); }
.book-tab:hover{ background:var(--ledger-green-soft); }
.book-tab.active{ background:var(--ledger-green-soft); font-weight:600; }

.add-book{ border-top:1px dashed var(--card-border); margin-top:4px; padding-top:8px; }
.add-book input{
  width:100%; font-family:'Inter',sans-serif; font-size:13px; padding:7px 8px;
  border:1px solid var(--card-border); border-radius:4px; margin-bottom:6px; background:#fff;
}
.add-book .row{ display:flex; gap:6px; }
.add-book .row input.pages{ width:70px; }
.add-book button{
  font-family:'Inter',sans-serif; font-size:13px; font-weight:600; width:100%;
  background:#fff; border:1px solid var(--ledger-green); color:var(--ledger-green);
  border-radius:4px; padding:7px; cursor:pointer;
}
.add-book button:hover{ background:var(--ledger-green-soft); }

.panel{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:22px 24px;
}
.panel-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:6px;}
.panel-head h2{ font-family:'Fraunces',serif; font-size:22px; font-weight:600; margin:0; }
.panel-head .target-edit{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft); }
.panel-head .target-edit input{
  width:70px; font-family:'JetBrains Mono',monospace; font-size:13px; padding:4px 6px;
  border:1px solid var(--card-border); border-radius:4px; text-align:right;
}
.delete-book{ background:none; border:none; color:var(--danger); font-size:12px; cursor:pointer; text-decoration:underline; padding:0; }

.ruler{ margin:22px 0 26px; }
.ruler .stats{ display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink-soft); margin-bottom:10px; }
.ruler .stats b{ color:var(--ink); font-size:15px; }
.page-grid{
  display:flex; height:22px; border:1px solid var(--card-border); border-radius:3px;
  overflow:hidden; background:#fff;
}
.page-cell{ flex:1; border-right:1px solid var(--paper-line); transition:background .15s ease; }
.page-cell:last-child{ border-right:none; }
.page-cell.filled{ background:var(--cell-color, var(--brass)); border-right-color:var(--cell-color, var(--brass)); }
.page-grid.compact{ height:8px; border-radius:4px; }
.page-grid.compact .page-cell{ border-right:none; }
.page-grid-empty{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); }


.entry-form{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; padding:16px; background:var(--ledger-green-soft); border-radius:var(--radius); margin-bottom:20px; }
.entry-form .field{ display:flex; flex-direction:column; gap:4px; }
.entry-form label{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; }
.entry-form input{ font-family:'Inter',sans-serif; font-size:14px; padding:8px 10px; border:1px solid var(--card-border); border-radius:4px; background:#fff; }
.entry-form input[type=number]{ width:90px; }
.entry-form input[type=text]{ width:180px; }
.entry-form input#entryPages{ width:130px; }
.page-range{ display:flex; align-items:center; gap:6px; }
.page-range input{ width:70px !important; }
.page-range .tilde{ color:var(--ink-soft); font-family:'JetBrains Mono',monospace; }
.field-hint{ font-size:11px; color:var(--ink-soft); max-width:160px; line-height:1.3; }
.entry-form .submit{
  background:var(--ledger-green); color:#fff; border:none; border-radius:4px; padding:9px 18px;
  font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; font-size:14px; height:38px;
}
.entry-form .submit:hover{ background:#264c41; }

table.ledger{ width:100%; border-collapse:collapse; font-size:14px; }
table.ledger th{ text-align:left; font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); border-bottom:1px solid var(--card-border); padding:6px 8px; font-weight:700; }
table.ledger td{ padding:8px; border-bottom:1px solid var(--paper-line); font-family:'JetBrains Mono',monospace; }
table.ledger td.note{ font-family:'Inter',sans-serif; color:var(--ink-soft); }
table.ledger tr:hover td{ background:#faf7ee; }
table.ledger .del{ background:none; border:none; color:var(--danger); cursor:pointer; font-size:12px; }

.empty{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
.empty h2{ font-family:'Fraunces',serif; font-size:20px; color:var(--ink); margin-bottom:6px; }

.loading{ text-align:center; padding:60px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; font-size:13px; }

/* ---------- 修改密碼彈窗 ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(43,42,38,0.45); display:flex;
  align-items:center; justify-content:center; padding:20px; z-index:50;
}
.modal-card{
  background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:26px 26px; width:100%; max-width:360px;
}
.modal-card h2{ font-family:'Fraunces',serif; font-size:20px; margin:0 0 16px; }
.modal-card .auth-field{ margin-bottom:12px; }
.modal-actions{ display:flex; gap:8px; margin-top:6px; }
.modal-actions button{ flex:1; border-radius:4px; padding:10px; font-weight:600; font-size:14px; cursor:pointer; font-family:'Inter',sans-serif; }
.modal-actions .cancel-btn{ background:#fff; border:1px solid var(--card-border); color:var(--ink); }
.modal-actions .cancel-btn:hover{ background:var(--ledger-green-soft); }
.modal-actions .confirm-btn{ background:var(--ledger-green); border:none; color:#fff; }
.modal-actions .confirm-btn:hover{ background:#264c41; }
.modal-actions .confirm-btn:disabled{ opacity:0.6; cursor:default; }
.change-pw-btn{ background:#fff; color:var(--ink); border:1px solid var(--card-border); }
.change-pw-btn:hover{ background:var(--ledger-green-soft); }

/* ---------- 個人檔案彈窗 ---------- */
.profile-card{ max-width:440px; }
.profile-head{ display:flex; align-items:center; gap:14px; margin-bottom:18px; }
.profile-avatar{
  width:56px; height:56px; border-radius:50%; flex-shrink:0;
  background:var(--ledger-green); color:#fff; font-family:'Fraunces',serif; font-weight:600;
  font-size:22px; display:flex; align-items:center; justify-content:center;
}
.profile-id h2{ font-family:'Fraunces',serif; font-size:16px; font-weight:600; margin:0 0 2px; word-break:break-all; }
.profile-sub{ margin:0; font-size:12px; color:var(--ink-soft); }
.profile-stats{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
.profile-stat{
  background:var(--ledger-green-soft); border-radius:var(--radius); padding:12px 14px;
  display:flex; flex-direction:column; gap:4px;
}
.profile-stat .label{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.04em; }
.profile-stat .value{ font-family:'Fraunces',serif; font-size:20px; font-weight:600; color:var(--ledger-green); }
.profile-level{ grid-column:1 / -1; background:var(--brass-soft); }
.profile-exp-line{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.profile-exp-line .value{ color:#72530f; }
.profile-exp-progress{ height:7px; border-radius:99px; background:rgba(176,129,44,.2); overflow:hidden; }
.profile-exp-progress > span{ display:block; height:100%; width:0; border-radius:inherit; background:var(--brass); transition:width .25s ease; }
.profile-exp-note{ font:11px 'JetBrains Mono',monospace; color:var(--ink-soft); }
.profile-badges h3{ font-family:'Fraunces',serif; font-size:15px; margin:0 0 10px; display:flex; align-items:center; gap:6px; }
.badge-count{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); font-weight:400; }
.badge-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; max-height:220px; overflow-y:auto; margin-bottom:18px; }
.badge-chip{
  background:var(--brass-soft); border:1px solid var(--card-border); border-radius:8px;
  padding:8px 10px; display:flex; flex-direction:column; gap:2px; align-items:center; text-align:center;
}
.badge-chip .badge-icon{ font-size:20px; line-height:1.2; }
.badge-chip .badge-label{ font-size:11px; color:var(--ink); line-height:1.3; }
.badge-chip .badge-date{ font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--ink-soft); }
.badge-chip.bonus{ background:var(--ledger-green-soft); border-color:var(--ledger-green); position:relative; }
.badge-chip.bonus::after{ content:'🎁'; position:absolute; top:-7px; right:-6px; font-size:13px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
.badge-chip.reroll{ background:#fdeee0; border-color:var(--brass); position:relative; }
.badge-chip.reroll::after{ content:'🔁'; position:absolute; top:-7px; right:-6px; font-size:13px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
.badge-empty{ grid-column:1/-1; color:var(--ink-soft); font-size:13px; padding:14px 4px; text-align:center; }

.achievement-grid{ display:flex; flex-direction:column; gap:8px; max-height:220px; overflow-y:auto; margin-bottom:4px; }
.achievement-card{ display:flex; align-items:center; gap:10px; background:var(--brass-soft); border:1px solid var(--card-border); border-radius:8px; padding:8px 12px; }
.achievement-card .a-icon{ font-size:22px; flex-shrink:0; }
.achievement-card .a-body{ display:flex; flex-direction:column; gap:1px; min-width:0; }
.achievement-card .a-title{ font-size:13px; font-weight:600; color:var(--ink); }
.achievement-card .a-desc{ font-size:11px; color:var(--ink-soft); }
.achievement-card .a-date{ margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--ink-soft); white-space:nowrap; }

/* ---------- 每日任務彈窗 ---------- */
.daily-overlay{ position:fixed; inset:0; z-index:1000; padding:20px; display:flex; align-items:center; justify-content:center; background:rgba(43,42,38,.58); }
.daily-card{ width:min(100%,430px); padding:30px 28px; background:var(--card); border:1px solid var(--card-border); border-radius:10px; box-shadow:0 18px 48px rgba(0,0,0,.24); text-align:center; animation:daily-pop .25s ease-out; }
@keyframes daily-pop{ from{ opacity:0; transform:translateY(12px) scale(.96); } to{ opacity:1; transform:translateY(0) scale(1); } }
.daily-card h2{ margin:0 0 7px; font-family:'Fraunces',serif; font-size:27px; }
.daily-date{ color:var(--ink-soft); font-family:'JetBrains Mono',monospace; font-size:12px; }
.daily-deadline{ color:var(--brass); font-family:'JetBrains Mono',monospace; font-size:11.5px; margin-top:3px; }
.daily-deadline-row{ display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
.daily-reshuffle-btn{
  font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft);
  background:none; border:1px solid var(--card-border); border-radius:999px;
  padding:2px 9px; cursor:pointer; transition:background .15s ease, color .15s ease;
}
.daily-reshuffle-btn:hover{ background:var(--ledger-green-soft); color:var(--ledger-green); }
.daily-reshuffle-btn.locked{ opacity:.45; cursor:not-allowed; }
.daily-reshuffle-btn.locked:hover{ background:none; color:var(--ink-soft); }
.daily-task-list{ margin:20px 0 16px; padding:14px 16px; border-radius:7px; background:var(--ledger-green-soft); text-align:left; }
.daily-task-list p{ margin:0; line-height:1.8; font-size:15px; }
.daily-task-list p + p{ margin-top:4px; }
.daily-task-list .task-row{
  display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  flex-wrap:wrap; line-height:1.5; font-size:15px; padding:3px 0;
}
.daily-task-list .task-row + .task-row{ margin-top:2px; }
.daily-task-list .task-row .task-main{ flex:1 1 auto; min-width:200px; }
.daily-task-list .task-progress{ color:var(--ink-soft); font-size:12px; white-space:nowrap; flex-shrink:0; }
.daily-task-list .task-progress-total{
  font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--ink-soft);
  padding-bottom:10px; margin-bottom:8px !important; border-bottom:1px dashed var(--card-border);
}
.daily-task-list .task-progress-total b{ color:var(--brass); font-size:16px; font-family:'Fraunces',serif; }
.daily-task-list .bonus-row{
  margin-top:10px !important; padding-top:10px; border-top:1px dashed var(--card-border);
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
}
.daily-task-list .bonus-row p{ margin:0; flex:1; min-width:180px; }
.bonus-reshuffle-btn{
  font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-soft);
  background:none; border:1px solid var(--card-border); border-radius:999px;
  padding:2px 8px; cursor:pointer; transition:background .15s ease, color .15s ease; white-space:nowrap;
}
.bonus-reshuffle-btn:hover{ background:var(--ledger-green-soft); color:var(--ledger-green); }
.daily-badge-label{ color:var(--ink-soft); font-size:12px; letter-spacing:.06em; }
.daily-badge{ margin:7px 0 5px; font-family:'Fraunces',serif; font-size:21px; }
.daily-badge-note{ margin:0 0 20px; color:var(--ink-soft); font-size:13px; }
.daily-btn{ width:100%; padding:12px; border:0; border-radius:4px; background:var(--ledger-green); color:#fff; cursor:pointer; font:600 15px 'Inter',sans-serif; }
.daily-btn:hover{ background:#264c41; }

.daily-open-btn{
  font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
  border:1px solid var(--brass); border-radius:999px; background:var(--brass-soft);
  color:#72530f; padding:7px 12px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  white-space:nowrap; transition:transform .12s ease, background .12s ease;
}
.daily-open-btn:hover{ background:#eddba9; transform:translateY(-1px); }
.daily-open-btn .dot{
  width:7px; height:7px; border-radius:50%; background:var(--danger); display:none;
}
.daily-open-btn.has-pending .dot{ display:inline-block; }

.daily-toast-wrap{ position:fixed; top:18px; right:18px; z-index:1200; display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
.daily-toast{
  background:var(--ledger-green); color:#fff; padding:14px 18px; border-radius:8px;
  box-shadow:0 10px 28px rgba(0,0,0,.22); font-family:'Inter',sans-serif; font-size:14px;
  max-width:320px; display:flex; align-items:flex-start; gap:10px; animation:toast-in .25s ease-out;
}
.daily-toast .icon{ font-size:20px; line-height:1; }
.daily-toast .body b{ display:block; font-family:'Fraunces',serif; font-size:15px; margin-bottom:2px; }
.daily-toast .body span{ opacity:.85; font-size:12.5px; }
.daily-toast.leaving{ animation:toast-out .25s ease-in forwards; }

/* 單本書今日任務進度：改用進度條卡片，不用整段文字說明 */
.progress-toast{ flex-direction:column; gap:8px; min-width:200px; align-items:stretch; }
.progress-toast-head{ display:flex; align-items:center; gap:8px; }
.progress-toast-head .icon{ font-size:16px; }
.progress-toast-head b{ font-family:'Fraunces',serif; font-size:14px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.progress-toast-head .frac{ font-family:'JetBrains Mono',monospace; font-size:12px; opacity:.9; }
.progress-toast-bar{ height:8px; border-radius:999px; background:rgba(255,255,255,.28); overflow:hidden; }
.progress-toast-bar .fill{ height:100%; border-radius:999px; background:var(--brass); transition:width .35s ease; }

@keyframes toast-in{ from{ opacity:0; transform:translateX(16px); } to{ opacity:1; transform:translateX(0); } }
@keyframes toast-out{ from{ opacity:1; transform:translateX(0); } to{ opacity:0; transform:translateX(16px); } }

/* ============================================================
   主選單（講義紀錄 / 錯題本 / 複習）
   ============================================================ */
.app-shell{ display:block; }

.main-nav{
  display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;
}
.nav-item{
  display:flex; align-items:center; gap:8px;
  background:var(--card); border:1px solid var(--card-border); border-bottom:3px solid var(--nav-color, var(--ledger-green));
  border-radius:var(--radius) var(--radius) 3px 3px; box-shadow:var(--shadow);
  padding:10px 18px; cursor:pointer; font-family:'Inter',sans-serif;
  font-size:14.5px; font-weight:600; color:var(--ink-soft); transition:background .12s ease, color .12s ease;
  white-space:nowrap;
}
.nav-item .nav-icon{ font-size:16px; line-height:1; flex-shrink:0; }
.nav-item:hover{ background:var(--ledger-green-soft); color:var(--ink); }
.nav-item.active{ background:var(--nav-color, var(--ledger-green)); border-color:var(--nav-color, var(--ledger-green)); color:#fff; }

.main-content{ min-width:0; }
.hidden{ display:none !important; }

/* ---------- 錯題本／複習 共用元件 ---------- */
.section-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.section-head h2{ font-family:'Fraunces',serif; font-size:22px; font-weight:600; margin:0; }
.ghost-btn{
  font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
  padding:9px 16px; border-radius:4px; border:1px solid var(--ledger-green);
  background:#fff; color:var(--ledger-green); cursor:pointer;
}
.ghost-btn:hover{ background:var(--ledger-green-soft); }
.solid-btn{
  font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
  padding:9px 18px; border-radius:4px; border:none;
  background:var(--ledger-green); color:#fff; cursor:pointer;
}
.solid-btn:hover{ background:#264c41; }
.solid-btn:disabled{ opacity:.5; cursor:default; }
.chip-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.chip{
  font-family:'JetBrains Mono',monospace; font-size:12px; padding:6px 13px;
  border:1px solid var(--card-border); border-radius:999px; background:#fff;
  color:var(--ink-soft); cursor:pointer;
}
.chip:hover{ border-color:var(--ledger-green); }
.chip.active{ background:var(--ledger-green); border-color:var(--ledger-green); color:#fff; }

.mistake-form{ background:var(--ledger-green-soft); border-radius:var(--radius); padding:18px 18px 16px; margin-bottom:20px; }
.mistake-form .field{ display:flex; flex-direction:column; gap:4px; margin-bottom:12px; }
.mistake-form label{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; }
.mistake-form input[type=text], .mistake-form textarea, .mistake-form select{
  font-family:'Inter',sans-serif; font-size:14px; padding:8px 10px; border:1px solid var(--card-border);
  border-radius:4px; background:#fff; width:100%;
}
.mistake-form textarea{ min-height:56px; resize:vertical; font-family:'Inter',sans-serif; }
.mistake-form .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:560px){ .mistake-form .row2{ grid-template-columns:1fr; } }
.field-label-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; }
.ocr-btn{
  font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:700;
  padding:5px 10px; border-radius:999px; border:1px solid var(--brass); background:var(--brass-soft);
  color:#72530f; cursor:pointer; white-space:nowrap;
}
.ocr-btn:hover{ background:#eddba9; }
.ocr-btn:disabled{ opacity:.6; cursor:default; }
.ocr-status{ font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-soft); margin-top:5px; min-height:14px; }
.opt-input-row{ display:flex; align-items:center; gap:8px; margin-bottom:7px; }
.opt-letter{
  font-family:'JetBrains Mono',monospace; font-weight:700; width:22px; height:22px;
  border:1px solid var(--ink); border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:11.5px; flex-shrink:0; background:#fff;
}
.mistake-form-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:4px; }
.field-error{ color:var(--danger); font-size:12.5px; margin-top:2px; }

.mistake-list{ display:flex; flex-direction:column; gap:12px; }
.mistake-card{
  background:var(--card); border:1px solid var(--card-border); border-left:4px solid var(--tab-color, var(--ledger-green));
  border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px;
}
.mistake-card .m-meta{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; }
.subject-tag{
  font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700;
  background:var(--ledger-green-soft); color:var(--ledger-green); padding:3px 10px; border-radius:999px;
}
.mastery-stamp{
  font-family:'Fraunces',serif; font-size:11px; font-weight:700; border:2px solid var(--brass);
  color:#72530f; padding:2px 9px; border-radius:4px; transform:rotate(-4deg); background:var(--brass-soft);
}
.mastery-stamp.mastered{ border-color:var(--ledger-green); color:var(--ledger-green); background:var(--ledger-green-soft); }
.mistake-card .m-question{ font-size:15px; line-height:1.55; margin:2px 0 10px; }
.mistake-card .m-opts{ display:flex; flex-direction:column; gap:5px; margin-bottom:10px; }
.mistake-card .m-opt{
  font-size:13.5px; padding:6px 10px; border-radius:4px; background:#fff;
  border:1px solid var(--card-border); display:flex; gap:8px; font-family:'Inter',sans-serif;
}
.mistake-card .m-opt.wrong{ border-color:var(--danger); background:#f7e3e0; color:var(--danger); }
.mistake-card .m-opt.correct{ border-color:var(--ledger-green); background:var(--ledger-green-soft); color:var(--ledger-green); font-weight:700; }
.mistake-card .m-opt .tag{ margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:10.5px; }
.mistake-card .m-fill-ans{ display:flex; gap:18px; font-size:13px; margin-bottom:10px; flex-wrap:wrap; }
.mistake-card .m-fill-ans .label{ display:block; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; font-size:10.5px; }
.mistake-card .m-fill-ans .wrong-v{ color:var(--danger); font-weight:700; }
.mistake-card .m-fill-ans .correct-v{ color:var(--ledger-green); font-weight:700; }
.mistake-card .m-actions{ display:flex; justify-content:space-between; align-items:center; }
.mistake-card .m-review-count{ font-size:11.5px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; }
.mistake-card .m-del{ background:none; border:none; color:var(--danger); cursor:pointer; font-size:12px; text-decoration:underline; }

/* ---------- 複習 flashcard ---------- */
.review-setup-card{ text-align:center; padding:28px 24px; }
.review-setup-card p{ color:var(--ink-soft); font-size:13.5px; margin:4px 0 18px; }
.review-toggle{ display:flex; align-items:center; justify-content:center; gap:8px; margin:14px 0 20px; font-size:13.5px; }
.flash-wrap{ max-width:600px; margin:0 auto; }
.flash-progress{ display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); margin-bottom:8px; }
.flash-bar{ height:4px; background:var(--card-border); border-radius:2px; overflow:hidden; margin-bottom:18px; }
.flash-bar .fill{ height:100%; background:var(--brass); transition:width .25s ease; }
.flashcard{
  background:var(--card); border:1px solid var(--card-border); box-shadow:var(--shadow);
  border-radius:var(--radius); padding:26px 24px; min-height:200px;
}
.flashcard .m-question{ font-family:'Fraunces',serif; font-size:18px; font-weight:500; line-height:1.6; margin:10px 0 20px; }
.choice-btn{
  width:100%; text-align:left; padding:11px 14px; margin-bottom:9px;
  border:1.5px solid var(--card-border); border-radius:4px; background:#fff; font-size:14.5px;
  cursor:pointer; display:flex; gap:10px; font-family:'Inter',sans-serif;
}
.choice-btn:hover{ border-color:var(--ledger-green); }
.choice-btn.picked{ border-color:var(--ink); background:#faf7ee; }
.choice-btn.reveal-correct{ border-color:var(--ledger-green); background:var(--ledger-green-soft); color:var(--ledger-green); font-weight:700; }
.choice-btn.reveal-wrong{ border-color:var(--danger); background:#f7e3e0; color:var(--danger); }
.choice-btn:disabled{ cursor:default; }
.fill-answer-input{
  width:100%; padding:11px 14px; border:1.5px solid var(--card-border); border-radius:4px;
  font-size:14.5px; margin-bottom:12px; font-family:'Inter',sans-serif;
}
.fill-answer-input:focus{ outline:2px solid var(--ledger-green); }
.result-banner{
  display:inline-flex; align-items:center; gap:8px; font-family:'Fraunces',serif; font-weight:700;
  font-size:14px; padding:6px 14px; border-radius:4px; margin-bottom:12px; border:2px solid; transform:rotate(-2deg);
}
.result-banner.ok{ color:var(--ledger-green); border-color:var(--ledger-green); background:var(--ledger-green-soft); }
.result-banner.no{ color:var(--danger); border-color:var(--danger); background:#f7e3e0; }
.correct-line{ font-size:13.5px; color:var(--ink-soft); margin-bottom:14px; }
.correct-line b{ color:var(--ledger-green); }
.flash-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:6px; }
.summary-card{ text-align:center; padding:34px 20px; }
.summary-card .score{ font-family:'JetBrains Mono',monospace; font-size:42px; font-weight:700; margin:8px 0; }
.summary-card .score span{ color:var(--brass); }
</style>
</head>
<body>

<!-- 每日任務：登入後每次進入主畫面都會顯示 -->
<div id="dailyOverlay" class="daily-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="dailyTitle">
  <div class="daily-card">
    <h2 id="dailyTitle">📅 今日任務</h2>
    <div class="daily-date" id="dailyDate"></div>
    <div class="daily-deadline-row">
      <div class="daily-deadline" id="dailyDeadline"></div>
      <button type="button" class="daily-reshuffle-btn" id="dailyReshuffleBtn" title="用最新的資料重新安排今天的任務">🔀 重排</button>
    </div>
    <div class="daily-task-list" id="dailyTask"></div>
    <div class="daily-badge-label">🏅 今日徽章</div>
    <div class="daily-badge" id="dailyBadge"></div>
    <p class="daily-badge-note">完成今天的任務即可獲得！</p>
    <button type="button" class="daily-btn" id="dailyClose">開始挑戰 🚀</button>
  </div>
</div>

<!-- 完成通知 Toast 容器 -->
<div class="daily-toast-wrap" id="dailyToastWrap"></div>

<!-- 登入 / 註冊畫面 -->
<div id="authView" class="auth-wrap">
  <div class="auth-card">
    <h1 id="authTitle">登入</h1>
    <div class="sub">自我紀錄.讓寫好的講義躍然"網"上</div>
    <form id="authForm">
      <div class="auth-field">
        <label>Email</label>
        <input type="email" id="authEmail" required autocomplete="email">
      </div>
      <div class="auth-field">
        <label>密碼</label>
        <input type="password" id="authPassword" required autocomplete="current-password" minlength="6">
      </div>
      <button type="submit" class="auth-submit" id="authSubmitBtn">登入</button>
    </form>
    <div class="auth-toggle">
      <span id="authToggleText">還沒有帳號？</span>
      <button id="authToggleBtn">註冊一個</button>
    </div>
    <div class="auth-msg" id="authMsg"></div>
    <div class="guest-divider"><span>或</span></div>
    <button type="button" class="guest-mode-btn" id="guestModeBtn">👤 訪客模式（免註冊，資料只存本機）</button>
  </div>
</div>

<!-- 主應用程式畫面 -->
<div id="mainView" class="wrap hidden">
  <header class="top">
    <div class="title-block">
      <h1>自我講義複習紀錄!</h1>
      <div class="stamp" id="todayStamp"></div>
    </div>
    <div class="header-actions">
      <button type="button" class="daily-open-btn" id="openDailyBtn" title="隨時查看今日任務">
        <span class="dot" id="openDailyDot"></span>📅 今日任務
      </button>
      <span class="daily-progress hidden" id="dailyProgress"></span>
      <button type="button" class="avatar-btn" id="avatarBtn" title="查看我的進度與徽章">
        <span id="avatarInitial">?</span>
      </button>
      <span class="user-badge" id="userBadge"></span>
      <span class="guest-badge hidden" id="guestBadge">🔒 訪客模式・本機</span>
      <button class="logout-btn change-pw-btn" id="changePwBtn">修改密碼</button>
      <button class="export-btn" id="todayPagesBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19h16"/><path d="M6 19V9m6 10V5m6 14v-7"/></svg>
        今日各書頁數
      </button>
      <button class="logout-btn" id="logoutBtn">登出</button>
    </div>
  </header>

  <div class="app-shell">
    <nav class="main-nav" id="mainNav">
      <button type="button" class="nav-item active" data-section="ledger" style="--nav-color:#2F5D50;"><span class="nav-icon">📚</span><span>講義紀錄</span></button>
      <button type="button" class="nav-item" data-section="mistakes" style="--nav-color:#A03A2E;"><span class="nav-icon">✏️</span><span>錯題本</span></button>
      <button type="button" class="nav-item" data-section="review" style="--nav-color:#B0812C;"><span class="nav-icon">🧠</span><span>複習</span></button>
    </nav>
    <div class="main-content">
      <div id="appPanel"><div class="loading">讀取資料中…</div></div>
      <div id="mistakesPanel" class="hidden"><div class="loading">讀取資料中…</div></div>
      <div id="reviewPanel" class="hidden"><div class="loading">讀取資料中…</div></div>
    </div>
  </div>
</div>

<!-- 個人檔案彈窗：頭像、已獲得徽章、總完成率、總頁數 -->
<div id="profileOverlay" class="modal-overlay hidden">
  <div class="modal-card profile-card">
    <div class="profile-head">
      <div class="profile-avatar" id="profileAvatar">?</div>
      <div class="profile-id">
        <h2 id="profileEmail">—</h2>
        <p class="profile-sub">你的學習紀錄一覽</p>
      </div>
    </div>

    <div class="profile-stats">
      <div class="profile-stat profile-level">
        <span class="label">LEVEL / EXP</span>
        <div class="profile-exp-line"><span class="value" id="profileLevel">Lv. 1</span><span class="profile-exp-note" id="profileExp">0 / 100 EXP</span></div>
        <div class="profile-exp-progress" aria-label="EXP progress"><span id="profileExpBar"></span></div>
      </div>
      <div class="profile-stat">
        <span class="label">總頁數</span>
        <span class="value" id="profileTotalPages">0 頁</span>
      </div>
      <div class="profile-stat">
        <span class="label">總完成率</span>
        <span class="value" id="profileCompletion">—</span>
      </div>
    </div>

    <div class="profile-badges">
      <h3>🏅 已獲得徽章 <span class="badge-count" id="profileBadgeCount"></span></h3>
      <div class="badge-grid" id="badgeGrid"></div>
    </div>

    <div class="profile-badges">
      <h3>🏆 里程碑成就 <span class="badge-count" id="profileAchievementCount"></span></h3>
      <div class="achievement-grid" id="achievementGrid"></div>
    </div>

    <div class="modal-actions">
      <button type="button" class="cancel-btn" id="closeProfileBtn">關閉</button>
    </div>
  </div>
</div>

<!-- 今日各書頁數彈窗 -->
<div id="todayPagesOverlay" class="modal-overlay hidden">
  <div class="modal-card">
    <h2>📖 今天各本寫了幾頁</h2>
    <div class="badge-grid" id="todayPagesList" style="grid-template-columns:1fr; max-height:320px;"></div>
    <div class="modal-actions">
      <button type="button" class="cancel-btn" id="closeTodayPagesBtn">關閉</button>
    </div>
  </div>
</div>

<!-- 修改密碼彈窗 -->
<div id="changePwOverlay" class="modal-overlay hidden">
  <div class="modal-card">
    <h2>修改密碼</h2>
    <form id="changePwForm">
      <div class="auth-field">
        <label>目前密碼</label>
        <input type="password" id="oldPassword" required autocomplete="current-password">
      </div>
      <div class="auth-field">
        <label>新密碼</label>
        <input type="password" id="newPassword" required minlength="6" autocomplete="new-password">
      </div>
      <div class="auth-field">
        <label>確認新密碼</label>
        <input type="password" id="newPasswordConfirm" required minlength="6" autocomplete="new-password">
      </div>
      <div class="auth-msg" id="changePwMsg"></div>

function guestUuid(){

function readGuestTable(table){

function writeGuestTable(table, rows){

class LocalQueryBuilder{
  constructor(table){
    this.table = table;
    this.op = null;
    this.payload = null;
    this.upsertOpts = {};
    this.filters = [];
    this.orderCol = null;
    this.orderAsc = true;
    this.wantSingle = false;
    this.wantMaybeSingle = false;
    this.selectAfterWrite = false;
  }
  select(){
    if(this.op === null) this.op = 'select';
    else this.selectAfterWrite = true;
    return this;
  }
  insert(payload){ this.op = 'insert'; this.payload = payload; return this; }
  update(payload){ this.op = 'update'; this.payload = payload; return this; }
  upsert(payload, opts){ this.op = 'upsert'; this.payload = payload; this.upsertOpts = opts || {}; return this; }
  delete(){ this.op = 'delete'; return this; }
  eq(col, val){ this.filters.push([col, val]); return this; }
  order(col, opts){ this.orderCol = col; this.orderAsc = !opts || opts.ascending !== false; return this; }
  single(){ this.wantSingle = true; return this; }
  maybeSingle(){ this.wantMaybeSingle = true; return this; }
  _matches(row){
    return this.filters.every(([col, val]) => row[col] === val);
  }
  _execute(){
    const rows = readGuestTable(this.table);
    if(this.op === 'select'){
      let result = rows.filter(r=>this._matches(r));
      if(this.orderCol){
        result = result.slice().sort((a,b)=>{
          const av = a[this.orderCol], bv = b[this.orderCol];
          if(av === bv) return 0;
          return (av > bv ? 1 : -1) * (this.orderAsc ? 1 : -1);
        });
      }
      if(this.wantSingle || this.wantMaybeSingle){
        return { data: result[0] || null, error: null };
      }
      return { data: result, error: null };
    }
    if(this.op === 'insert'){
      const items = Array.isArray(this.payload) ? this.payload : [this.payload];
      const inserted = items.map(item=>({
        id: item.id || guestUuid(),
        created_at: item.created_at || new Date().toISOString(),
        ...item
      }));
      writeGuestTable(this.table, rows.concat(inserted));
      if(this.selectAfterWrite){
        return { data: this.wantSingle ? inserted[0] : inserted, error: null };
      }
      return { data: null, error: null };
    }
    if(this.op === 'update'){
      const updated = rows.map(r=> this._matches(r) ? { ...r, ...this.payload } : r);
      writeGuestTable(this.table, updated);
      return { data: null, error: null };
    }
    if(this.op === 'upsert'){
      const conflictCol = this.upsertOpts.onConflict || 'id';
      const conflictVal = this.payload[conflictCol];
      let found = false;
      const updated = rows.map(r=>{
        if(r[conflictCol] === conflictVal){ found = true; return { ...r, ...this.payload }; }
        return r;
      });
      if(!found){
        updated.push({ id: this.payload.id || guestUuid(), created_at: new Date().toISOString(), ...this.payload });
      }
      writeGuestTable(this.table, updated);
      return { data: null, error: null };
    }
    if(this.op === 'delete'){
      const remaining = rows.filter(r=>!this._matches(r));
      writeGuestTable(this.table, remaining);
      return { data: null, error: null };
    }
    return { data: null, error: { message: '不支援的本機操作' } };
  }
  then(resolve, reject){
    try{
      resolve(this._execute());
    }catch(err){
      if(reject) reject(err); else resolve({ data: null, error: { message: err.message } });
    }
  }
}

function daysUntilYearEnd(){
  const now = new Date();
  const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const yearEnd = new Date(now.getFullYear(), 10, 15);
  const diff = Math.round((yearEnd - todayMidnight) / 86400000) + 1;

}

// 從還沒排進主線任務的書裡面，挑一本出一個份量很小（1 頁）的加碼任務，
// 讓人有「寫少少也有獎勵」的感覺；如果每本書都已經在主線任務裡了，就從全部未寫完的書裡選。
// seedOffset：預設 0（每天固定選同一本），手動按「換一個」時會帶入隨機值，確保換得到不同的書。
function createBonusTask(excludeBooks, mainTasks, seedOffset = 0){
  const BONUS_QUOTA = 1;
  const notFull = book=>{
    const target = Number(book.target) || 0;
    return !target || totalFor(book.id) < target;
  };
  const candidates = books.filter(book=>notFull(book) && !excludeBooks.includes(book));
  const pool = candidates.length ? candidates : books.filter(notFull);
  if(!pool.length) return null;

  const book = pool[(dailyIndex() + seedOffset) % pool.length];
  const target = Number(book.target) || 0;
  const written = mergedRangesFor(book.id);
  // 如果這本書剛好也在今天的主線任務裡（例如所有書都排滿了才退回選這本），
  // 要把主線任務已經預定的範圍也算進去，避免加碼任務跟主線任務排到同一段頁數。
  const pending = (mainTasks || []).filter(t=>t.bookId===book.id).map(t=>[t.start, t.end]);
  const occupied = [...written, ...pending].sort((a,b)=>a[0]-b[0]);
  let start = 1;
  for(const [s,e] of occupied){
    if(start >= s && start <= e) start = e + 1;
  }
  const end = target ? Math.min(start + BONUS_QUOTA - 1, target) : start + BONUS_QUOTA - 1;
  if(start > end) return null;
  return { bookId: book.id, bookName: book.name, start, end };
}

function isBonusTaskDone(){
  if(!activeBonusTask) return false;
  const written = entriesByBook[activeBonusTask.bookId] || [];
  for(let page=activeBonusTask.start; page<=activeBonusTask.end; page++){
    if(!written.some(e=>Number(e.page_start) <= page && Number(e.page_end) >= page)) return false;
  }
  return true;
}

  if(error){ console.error('讀取徽章失敗', error); return; }
  (data || []).forEach(row=>{
    if(row.kind === 'daily'){
      const key = row.badge_key || '';
      const match = key.match(/:round:(\d+)$/);
      earnedBadges.push({ date: row.badge_date, text: row.text, key, round: match ? Number(match[1]) : 1 });
    }
    else if(row.kind === 'bonus') earnedBonusBadges.push({ date: row.badge_date, text: row.text });
    else if(row.kind === 'reroll') earnedRerollBadges.push({ date: row.badge_date, text: row.text });
    else if(row.kind === 'achievement') earnedAchievements.push({ id: row.badge_key, date: row.badge_date, icon: row.icon, title: row.title, desc: row.description });
  });
}

function experienceForEntry(pages){

}

// Persist one badge for every completed round. The unique badge_key deliberately
// replaces the old calendar-date-only deduplication.
async function recordEarnedBadge(){
  const date = todayStr();
  const round = dailyRoundNumber();
  const badgeKey = dailyRoundKey(date, round);
  if(earnedBadges.some(b=>b.key === badgeKey)) return;
  const text = dailyBadges[(dailyIndex() + round - 1) % dailyBadges.length];
  const badge = { date, text, key: badgeKey, round };
  earnedBadges.push(badge);
  const { error } = await db.from('badges').insert({
    user_id: currentUser.id, kind: 'daily', badge_date: date, badge_key: badgeKey, text
  });
  if(error){
    earnedBadges = earnedBadges.filter(b=>b !== badge);
    console.error('儲存每日輪次徽章失敗', error);
  }
}

function experienceStats(){
  // EXP is rebuilt from persisted entries: larger single-session page ranges
  // earn higher per-page EXP, while the initial account balance is 902 EXP.
  const earnedExp = Object.values(entriesByBook).flat().reduce(
    (sum, entry)=>sum + experienceForEntry(entry.pages), 0
  );
  const totalExp = EXP_START + earnedExp;
  let level = 1;
  let spent = 0;
  let nextLevelExp = EXP_BASE;
  while(totalExp >= spent + nextLevelExp){
    spent += nextLevelExp;
    level += 1;
    nextLevelExp = EXP_BASE * level;
  }
  const currentLevelExp = totalExp - spent;
  return { totalExp, level, currentLevelExp, nextLevelExp, percent: (currentLevelExp / nextLevelExp) * 100 };
}

// 登入 / 換帳號時呼叫一次：把這個使用者的連續天數紀錄從 Supabase 讀回來
async function loadStreak(){
  currentStreak = { count: 0, lastDate: null };
  if(!currentUser) return;
  const { data, error } = await db
    .from('streaks').select('*').eq('user_id', currentUser.id).maybeSingle();
  if(error){ console.error('讀取連續天數失敗', error); return; }
  if(data) currentStreak = { count: data.count, lastDate: data.last_date };
}

function getStreak(){
  return currentStreak;
}

// 每日任務全部完成時呼叫一次：如果昨天也完成過就 +1，中斷過就重新算 1，同步寫入 Supabase
async function bumpStreak(){
  const today = todayStr();
  if(currentStreak.lastDate === today) return currentStreak; // 今天已經算過了，避免重複
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  const count = currentStreak.lastDate === yesterday ? currentStreak.count + 1 : 1;
  currentStreak = { count, lastDate: today }; // 先更新畫面，不等雲端回應
  const { error } = await db.from('streaks')
    .upsert({ user_id: currentUser.id, count, last_date: today }, { onConflict: 'user_id' });
  if(error) console.error('儲存連續天數失敗', error);
  return currentStreak;
}

// 檢查目前資料是否達成任何還沒拿過的成就，達成就永久記錄下來並跳出通知。
// 可以隨時重複呼叫，已經拿過的成就不會被重複觸發。同步寫入 Supabase。
async function checkAchievements(){
  if(!books.length) return;
  const earnedIds = new Set(earnedAchievements.map(a=>a.id));
  const stats = overallStats();
  const anyBookDone = books.some(b=>{
    const target = Number(b.target) || 0;
    return target > 0 && totalFor(b.id) >= target;
  });
  const ctx = {
    rate: stats.rate || 0,
    totalPagesAll: stats.totalPagesAll,
    streak: getStreak().count,
    anyBookDone
  };

  const newlyEarned = [];
  ACHIEVEMENTS.forEach(a=>{
    if(earnedIds.has(a.id)) return;
    if(a.check(ctx)){
      earnedAchievements.push({ id:a.id, date: todayStr(), icon:a.icon, title:a.title, desc:a.desc }); // 先更新畫面
      newlyEarned.push(a);
    }
  });
  if(newlyEarned.length){
    const rows = newlyEarned.map(a=>({
      user_id: currentUser.id, kind: 'achievement', badge_date: todayStr(),
      badge_key: a.id, icon: a.icon, title: a.title, description: a.desc
    }));
    const { error } = await db.from('badges').insert(rows);
    if(error) console.error('儲存成就失敗', error);
    newlyEarned.forEach(a=>{
      showDailyToast({ icon:a.icon, title:`成就達成：${a.title}`, body:a.desc });
    });
  }
}

// 總頁數（所有書目已寫頁數加總）與總完成率（只用有設定目標的書目計算）
function overallStats(){
  let totalPagesAll = 0;
  let targetedPages = 0, targetedTarget = 0, hasTarget = false;
  books.forEach(b=>{
    const t = totalFor(b.id);
    totalPagesAll += t;
    const target = Number(b.target) || 0;
    if(target > 0){
      hasTarget = true;
      targetedPages += t;
      targetedTarget += target;
    }
  });
  const rate = hasTarget ? Math.round(Math.min(100, (targetedPages / targetedTarget) * 100)) : null;
  return { totalPagesAll, rate };
}

  }, 0);
}

function createDailyTaskPlan(){
  const available = books.filter(book=>{
    const target = Number(book.target) || 0;
    return !target || totalFor(book.id) < target;
  });
  if(!available.length) return [];

  const N = available.length;
  const picksPerDay = Math.min(DAILY_PICK_COUNT, N);
  const daysLeft = daysUntilYearEnd();

  // 每本書目前的「完成率」（已寫頁數 / 目標頁數）。
  // 沒設定目標頁數的書無法算完成率，視為 Infinity（排最後，只有名額多到排得到才會選進來）。
  function completionPctOf(book){
    const target = Number(book.target) || 0;
    if(!target) return Infinity;
    return totalFor(book.id) / target;
  }

  // 完全依完成率由低到高排序，直接取完成率最低的 picksPerDay 本，
  // 不再另外保留輪替名額——4 個名額都給目前進度最落後的講義。
  // 完成率打平時，選書本清單中排比較後面（畫面上比較靠下）的那一本。
  const selectedBooks = available
    .map((book, idx)=>({ book, idx }))
    .sort((a,b)=> completionPctOf(a.book) - completionPctOf(b.book) || b.idx - a.idx)
    .slice(0, picksPerDay)
    .map(x=>x.book);

  const plan = [];
  const pendingRangesByBook = {}; // 同一天同一本書被排到第二次時，避免跟這次剛排好的範圍重疊
  for(let i=0; i<selectedBooks.length; i++){
    const book = selectedBooks[i];
    const target = Number(book.target) || 0;
    const writtenPages = totalFor(book.id); // 用實際寫過的頁數（而非最後一頁）估算剩餘量，跳著寫也準確
    const remainingPages = target ? Math.max(target - writtenPages, 0) : null;

    // 依目前的輪替規則，估計這本書在期限前大概還會被排到幾次，
    // 再用剩餘頁數 / 剩餘次數，算出這次應該要讀幾頁，才趕得上目標日期。
    const turnsRemaining = Math.max(1, Math.round(daysLeft * picksPerDay / N));
    const dailyQuota = remainingPages != null
      ? Math.max(1, Math.ceil(remainingPages / turnsRemaining))
      : 2; // 沒設定目標頁數的書，維持每次 2 頁的預設份量

    // 優先安排「最前面還沒寫過的缺口」，而不是永遠往書本最後面推進，
    // 這樣如果之前跳著寫，會先補齊中間漏掉的部分，補完才會繼續往後排。
    const written = mergedRangesFor(book.id);
    const pending = pendingRangesByBook[book.id] || [];
    const occupied = [...written, ...pending].sort((a,b)=>a[0]-b[0]);
    let start = 1;
    for(const [s,e] of occupied){
      if(start >= s && start <= e) start = e + 1;
    }
    const end = target ? Math.min(start + dailyQuota - 1, target) : start + dailyQuota - 1;
    if(start <= end){
      plan.push({ bookId:book.id, bookName:book.name, start, end });
      pendingRangesByBook[book.id] = [...pending, [start, end]];
    }
  }
  return plan;
}

// 拿今天的任務排程：先看記憶體快取，沒有就去 Supabase 查，還是沒有才現算一份並存回去。
// 這樣同一天在不同裝置打開，看到的任務範圍、完成通知狀態都會一致。
async function getDailyTaskPlan(){
  const date = todayStr();
  if(currentDailyPlan && currentDailyPlan.date === date) return currentDailyPlan;

  dailyRerollActive = false; // 換了一天（或第一次載入），加場狀態歸零

  if(currentUser){
    const { data, error } = await db
      .from('daily_plans').select('*').eq('user_id', currentUser.id).eq('plan_date', date).maybeSingle();
    if(error) console.error('讀取今日任務排程失敗', error);
    if(data){
      currentDailyPlan = { date, round: Math.max(1, Number(data.tasks?.round) || 1), tasks: data.tasks?.items || data.tasks || [], bonus: data.bonus || null, notified: !!data.notified, bonusNotified: !!data.bonus_notified };
      dailyRerollActive = currentDailyPlan.round > 1;
      return currentDailyPlan;
    }
  }

  const tasks = createDailyTaskPlan();
  const usedBooks = tasks.map(t=>books.find(b=>b.id===t.bookId)).filter(Boolean);
  const bonus = createBonusTask(usedBooks, tasks);
  currentDailyPlan = { date, round:1, tasks, bonus, notified:false, bonusNotified:false };
  if(currentUser){
    const { error } = await db.from('daily_plans').upsert({
      user_id: currentUser.id, plan_date: date, tasks: { round:1, items:tasks }, bonus, notified:false, bonus_notified:false
    }, { onConflict: 'user_id,plan_date' });
    if(error) console.error('儲存今日任務排程失敗', error);
  }
  return currentDailyPlan;
}

function completedDailyPages(plan){
  return plan.reduce((count, task)=>{
    const written = entriesByBook[task.bookId] || [];
    for(let page=task.start; page<=task.end; page++){
      if(written.some(entry=>Number(entry.page_start) <= page && Number(entry.page_end) >= page)) count++;
    }
    return count;
  }, 0);
}

// 算出目前這份每日任務清單的完成率（0~100）。沒有任務可寫時視為 100%，不會擋住重排。
function dailyCompletionPct(tasks){
  const totalPages = (tasks || []).reduce((sum,t)=>sum + t.end - t.start + 1, 0);
  if(!totalPages) return 100;
  const donePages = completedDailyPages(tasks);
  return Math.round(Math.min(100, (donePages / totalPages) * 100));
}

// 依目前完成率，更新「重排」按鈕是否可以按（要 100% 才能重排）
function updateReshuffleButtonState(){
  const btn = document.getElementById('dailyReshuffleBtn');
  if(!btn) return;
  const pct = dailyCompletionPct(activeDailyTasks);
  const locked = pct < 100;
  btn.classList.toggle('locked', locked);
  btn.title = locked ? `完成今天的任務（目前 ${pct}%）才能重排唷` : '用最新的資料重新安排今天的任務';
}

// 算出某本書在今天的任務範圍裡，已經寫了幾頁（用來跳出可愛的小進度提示）
function taskProgressForBook(bookId){
  const task = activeDailyTasks.find(t=>t.bookId===bookId);
  if(!task) return null;
  const written = entriesByBook[bookId] || [];
  let done = 0;
  for(let page=task.start; page<=task.end; page++){
    if(written.some(entry=>Number(entry.page_start) <= page && Number(entry.page_end) >= page)) done++;
  }
  const total = task.end - task.start + 1;
  return { done, total, bookName: task.bookName };
}

// 清掉今天已經產生的「主線任務」重新算一次（要今天的任務全部完成 100% 才能重排）。
// 加碼任務不會被這裡影響，會維持原本的那個；想換加碼任務請按它旁邊的「換一個」按鈕。
async function reshuffleDailyTasks(force){
  const plan = await getDailyTaskPlan();
  const pct = dailyCompletionPct(plan.tasks || []);
  if(pct < 100 && !force){
    showDailyToast({ icon:'🔒', title:'先寫完今天的任務唷', body:`目前完成 ${pct}%，全部寫完才能重排喔！` });
    return;
  }

  const newTasks = createDailyTaskPlan();
  dailyRerollActive = true; // 標記這是「完成過一輪後」主動重排的加場，寫完新一輪時會多給一枚特別徽章

  currentDailyPlan = {
    date: plan.date,
    round: dailyRoundNumber(plan) + 1,
    tasks: newTasks,
    bonus: plan.bonus,           // 加碼任務保留原樣，不會被主線重排換掉
    notified: false,             // 這一輪要重新全部寫完，才會再通知、再拿一次徽章
    bonusNotified: plan.bonusNotified
  };

  if(currentUser){
    const { error } = await db.from('daily_plans').upsert({
      user_id: currentUser.id, plan_date: plan.date, tasks: { round: currentDailyPlan.round, items:newTasks }, bonus: plan.bonus,
      notified: false, bonus_notified: plan.bonusNotified
    }, { onConflict: 'user_id,plan_date' });
    if(error) console.error('重排主線任務失敗', error);
  }
  await showDailyTask();
}

// 只換「加碼任務」，不會動到主線任務，隨時都能按，沒有 100% 限制。
async function reshuffleBonusTask(){
  const plan = await getDailyTaskPlan();
  const usedBooks = (plan.tasks || []).map(t=>books.find(b=>b.id===t.bookId)).filter(Boolean);
  // 帶入隨機值，確保換到的跟原本不是同一本（不然同一天用同樣邏輯選出來的一定一樣）
  const seedOffset = 1 + Math.floor(Math.random() * 97);
  const newBonus = createBonusTask(usedBooks, plan.tasks, seedOffset);

  currentDailyPlan = { ...plan, bonus: newBonus, bonusNotified: false };

  if(currentUser){
    const { error } = await db.from('daily_plans').upsert({
      user_id: currentUser.id, plan_date: plan.date, tasks: { round: dailyRoundNumber(plan), items:plan.tasks }, bonus: newBonus,
      notified: plan.notified, bonus_notified: false
    }, { onConflict: 'user_id,plan_date' });
    if(error) console.error('換加碼任務失敗', error);
  }
  await showDailyTask();
}

const NOTIFY_ASK_ONCE_KEY = 'daily-notify-permission-asked';
function requestNotifyPermission(){
  if(typeof Notification === 'undefined') return;
  if(Notification.permission !== 'default') return; // 已經允許或封鎖過，不用再問
  if(localStorage.getItem(NOTIFY_ASK_ONCE_KEY)) return; // 已經主動問過一次了，不再自動彈出
  localStorage.setItem(NOTIFY_ASK_ONCE_KEY, '1');
  Notification.requestPermission();
}

function showDailyToast({icon='🎉', title, body}){
  const wrap = document.getElementById('dailyToastWrap');
  if(!wrap) return;
  const el = document.createElement('div');
  el.className = 'daily-toast';
  el.innerHTML = `<span class="icon">${icon}</span><div class="body"><b>${escapeHtml(title)}</b><span>${escapeHtml(body)}</span></div>`;
  wrap.appendChild(el);
  setTimeout(()=>{
    el.classList.add('leaving');
    setTimeout(()=>el.remove(), 260);
  }, 4200);
}

// 用進度條卡片顯示某本書今日任務的完成進度（跳出、停留幾秒後自動收起）
function showTaskProgressToast({ bookName, done, total }){
  const wrap = document.getElementById('dailyToastWrap');
  if(!wrap) return;
  const pct = total > 0 ? Math.round(Math.min(100, (done / total) * 100)) : 0;
  const complete = done >= total;
  const el = document.createElement('div');
  el.className = 'daily-toast progress-toast';
  el.innerHTML = `
    <div class="progress-toast-head">
      <span class="icon">${complete ? '✅' : '🎯'}</span>
      <b>${escapeHtml(bookName)}</b>
      <span class="frac">${done} / ${total}</span>
    </div>
    <div class="progress-toast-bar"><div class="fill" style="width:${pct}%"></div></div>
  `;
  wrap.appendChild(el);
  setTimeout(()=>{
    el.classList.add('leaving');
    setTimeout(()=>el.remove(), 260);
  }, 4200);
}

function sendBrowserNotification(title, body){
  if(typeof Notification === 'undefined') return;
  if(Notification.permission === 'granted'){
    try{ new Notification(title, { body, icon:'', tag:'daily-task-complete' }); }
    catch(_){ /* Some environments (e.g. iOS Safari PWA-less) don't support this. */ }
  }
}

// 每日任務全部完成時呼叫一次：記徽章、記連續天數、檢查成就，並把「已通知」狀態存進 Supabase
// 如果這一輪是「完成過一次後主動重排」的加場任務，完成時會多給一枚特別的加場徽章。
async function notifyDailyComplete(){
  if(!currentDailyPlan || currentDailyPlan.notified) return; // 今天已經通知過了，避免重複跳出
  currentDailyPlan.notified = true;
  const isReroll = dailyRoundNumber() > 1;
  await recordEarnedBadge();
  if(isReroll) await recordRerollBadge();
  await bumpStreak();
  await checkAchievements();
  const title = isReroll ? '加場任務也完成了！🔁' : '今日任務已完成！🎉';
  const body = isReroll ? '重排後的新一輪任務也全部寫完，額外拿到一枚加場徽章！' : '恭喜你完成今天的所有任務，記得看看獲得的徽章～';
  showDailyToast({ icon: isReroll ? '🔁' : '🏅', title, body });
  sendBrowserNotification(title, body);
  if(currentUser){
    const { error } = await db.from('daily_plans')
      .update({ notified: true }).eq('user_id', currentUser.id).eq('plan_date', currentDailyPlan.date);
    if(error) console.error('更新今日完成通知狀態失敗', error);
  }
}

// 加碼任務份量很小，寫完就給一個特別徽章當小獎勵（同一天只通知一次），狀態存進 Supabase
async function notifyBonusComplete(){
  if(!currentDailyPlan || currentDailyPlan.bonusNotified) return;
  currentDailyPlan.bonusNotified = true;
  await recordBonusBadge();
  const title = '加碼任務完成！🎁';
  const body = '寫少少也能拿到特別徽章，太划算了～';
  showDailyToast({ icon:'🎁', title, body });
  sendBrowserNotification(title, body);
  if(currentUser){
    const { error } = await db.from('daily_plans')
      .update({ bonus_notified: true }).eq('user_id', currentUser.id).eq('plan_date', currentDailyPlan.date);
    if(error) console.error('更新加碼完成通知狀態失敗', error);
  }
}

async function updateDailyProgress(){
  const progressEl = document.getElementById('dailyProgress');
  const openBtn = document.getElementById('openDailyBtn');
  const total = activeDailyTasks.reduce((count, task)=>count + task.end - task.start + 1, 0);
  if(activeBonusTask && isBonusTaskDone()) await notifyBonusComplete();
  if(!total){
    if(progressEl) progressEl.classList.add('hidden');
    if(openBtn) openBtn.classList.remove('has-pending');
    updateReshuffleButtonState();
    return;
  }
  const done = completedDailyPages(activeDailyTasks);
  if(progressEl){
    progressEl.textContent = `當前進度 ${done} / ${total} 頁`;
    progressEl.classList.remove('hidden');
  }
  if(openBtn) openBtn.classList.toggle('has-pending', done < total);
  if(done >= total) await notifyDailyComplete();
  updateReshuffleButtonState();
}

async function showDailyTask(){
  const index = dailyIndex();
  const now = new Date();
  const titleEl = document.getElementById('dailyTitle');
  const dateEl = document.getElementById('dailyDate');
  const taskEl = document.getElementById('dailyTask');
  const badgeEl = document.getElementById('dailyBadge');
  if(!dateEl || !taskEl || !badgeEl) return;

  if(titleEl) titleEl.textContent = '\u{1F4C5} \u4ECA\u65E5\u4EFB\u52D9';
  document.querySelector('.daily-badge-label').textContent = '\u{1F3C5} \u4ECA\u65E5\u5FBD\u7AE0';
  document.querySelector('.daily-badge-note').textContent = '\u5B8C\u6210\u4ECA\u5929\u7684\u4EFB\u52D9\u5373\u53EF\u7372\u5F97\uFF01';
  document.getElementById('dailyClose').textContent = '\u958B\u59CB\u6311\u6230 \u{1F680}';
  dateEl.textContent = now.toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
  const deadlineEl = document.getElementById('dailyDeadline');
  if(deadlineEl) deadlineEl.textContent = `\u{1F3AF} \u76EE\u6A19\uFF1A11/15 \u524D\u8B80\u5B8C\u6240\u6709\u66F8\uFF08\u9084\u5269 ${daysUntilYearEnd()} \u5929\uFF09`;
  const plan = await getDailyTaskPlan();
  activeDailyTasks = plan.tasks;
  activeBonusTask = plan.bonus;
  const round = dailyRoundNumber(plan);
  if(titleEl) titleEl.textContent = `📅 今日任務 · 第 ${round} 輪`;
  document.querySelector('.daily-badge-label').textContent = `🏅 第 ${round} 輪徽章`;
  document.querySelector('.daily-badge-note').textContent = `完成第 ${round} 輪可獲得徽章；單次寫越多頁，獲得的 EXP 越多！`;

  let bonusHtml = '';
  if(activeBonusTask){
    const bt = activeBonusTask;
    const pages = bt.start === bt.end ? `${bt.start}` : `${bt.start}～${bt.end}`;
    const done = isBonusTaskDone();
    bonusHtml = `<div class="bonus-row">
      <p>${done ? '✅' : '🎁'} <b>加碼任務：${escapeHtml(bt.bookName)}</b>：第 ${pages} 頁 <span class="task-progress">${done ? '已完成，賺到！' : '寫少少也給獎勵～'}</span></p>
      <button type="button" class="bonus-reshuffle-btn" id="bonusReshuffleBtn" title="不想寫這本？換一個加碼任務試試">🔀 換一個</button>
    </div>`;
  }

  if(activeDailyTasks.length){
    const totalPages = activeDailyTasks.reduce((sum,t)=>sum + t.end - t.start + 1, 0);
    const donePages = completedDailyPages(activeDailyTasks);
    const overallPct = dailyCompletionPct(activeDailyTasks);
    const rows = activeDailyTasks.map((task, i)=>{
      const pages = task.start === task.end ? `${task.start}` : `${task.start}～${task.end}`;
      const taskTotal = task.end - task.start + 1;
      const book = books.find(b=>b.id === task.bookId);
      const bookTarget = book ? Number(book.target) || 0 : 0;
      const sharePct = bookTarget > 0 ? Math.round((taskTotal / bookTarget) * 100) : null;
      const shareLabel = sharePct === null ? '未設定目標' : `佔本書 ${sharePct}%`;
      return `<div class="task-row"><span class="task-main"><b>${i + 1}. ${escapeHtml(task.bookName)}</b>：第 ${pages} 頁</span><span class="task-progress">${shareLabel}</span></div>`;
    }).join('');
    taskEl.innerHTML = `<p class="task-progress-total">今日總進度：<b>${overallPct}%</b>（${donePages} / ${totalPages} 頁）</p>${rows}${bonusHtml}`;
  }else{
    taskEl.innerHTML = `<p>先新增講義與目標頁數，明天就會自動安排任務。</p>${bonusHtml}`;
  }
  badgeEl.textContent = dailyBadges[(index + round - 1) % dailyBadges.length];
  updateReshuffleButtonState();
  const bonusBtn = document.getElementById('bonusReshuffleBtn');
  if(bonusBtn) bonusBtn.addEventListener('click', reshuffleBonusTask);
  await updateDailyProgress();
  await checkAchievements();
  document.getElementById('dailyOverlay').classList.remove('hidden');
}

  const el = document.getElementById('todayStamp');

    el.textContent = `\u4ECA\u5929 ${date} (${weekdays[d.getDay()]})`;

/* ---------------- Auth ---------------- */

function checkConfig(){
  if(SUPABASE_URL.includes('YOUR_') || SUPABASE_ANON_KEY.includes('YOUR_')){
    setAuthMsg('⚠️ 尚未設定檔案開頭的 SUPABASE_URL 與 SUPABASE_ANON_KEY，請參考 README.md。', 'error');
    return false;
  }
  return true;
}

function setAuthMsg(text, type){
  const el = document.getElementById('authMsg');
  el.textContent = text || '';
  el.className = 'auth-msg' + (type ? ' ' + type : '');
}

async function handleAuthSubmit(e){
  e.preventDefault();
  if(!checkConfig()) return;
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const btn = document.getElementById('authSubmitBtn');
  btn.disabled = true;
  setAuthMsg('');

  if(isSignUpMode){
    const { error } = await supabase.auth.signUp({ email, password });
    if(error){ setAuthMsg(error.message, 'error'); }
    else{ setAuthMsg('註冊成功！請檢查信箱完成驗證後再登入（若專案關閉了信箱驗證，可直接登入）。', 'success'); }
  }else{
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if(error){ setAuthMsg(error.message, 'error'); }
  }
  btn.disabled = false;
}

function toggleAuthMode(){
  isSignUpMode = !isSignUpMode;
  document.getElementById('authTitle').textContent = isSignUpMode ? '建立帳號' : '登入';
  document.getElementById('authSubmitBtn').textContent = isSignUpMode ? '註冊' : '登入';
  document.getElementById('authToggleText').textContent = isSignUpMode ? '已經有帳號了？' : '還沒有帳號？';
  document.getElementById('authToggleBtn').textContent = isSignUpMode ? '登入' : '註冊一個';
  setAuthMsg('');
}

async function handleLogout(){
  if(isGuestMode){
    // 訪客模式沒有真正登入，直接清畫面回登入頁；本機資料保留，下次仍可用同一顆按鈕繼續進訪客模式

function openChangePwModal(){
  document.getElementById('oldPassword').value = '';
  document.getElementById('newPassword').value = '';
  document.getElementById('newPasswordConfirm').value = '';
  setChangePwMsg('');
  document.getElementById('changePwOverlay').classList.remove('hidden');
  document.getElementById('oldPassword').focus();
}
function closeChangePwModal(){
  document.getElementById('changePwOverlay').classList.add('hidden');
}
function setChangePwMsg(text, type){
  const el = document.getElementById('changePwMsg');
  el.textContent = text || '';
  el.className = 'auth-msg' + (type ? ' ' + type : '');
}

async function handleChangePwSubmit(e){
  e.preventDefault();
  const oldPassword = document.getElementById('oldPassword').value;
  const newPassword = document.getElementById('newPassword').value;
  const newPasswordConfirm = document.getElementById('newPasswordConfirm').value;
  const btn = document.getElementById('confirmPwBtn');

  if(newPassword !== newPasswordConfirm){
    setChangePwMsg('兩次輸入的新密碼不一致。', 'error');
    return;
  }
  if(newPassword === oldPassword){
    setChangePwMsg('新密碼不能跟目前密碼一樣。', 'error');
    return;
  }

  btn.disabled = true;
  setChangePwMsg('確認中…');

  // 先用「目前密碼」重新登入一次，確認使用者真的知道原密碼
  const { error: verifyError } = await supabase.auth.signInWithPassword({
    email: currentUser.email,
    password: oldPassword
  });
  if(verifyError){
    setChangePwMsg('目前密碼不正確，請再確認一次。', 'error');
    btn.disabled = false;
    return;
  }

  // 驗證通過，才真的更新成新密碼
  const { error: updateError } = await supabase.auth.updateUser({ password: newPassword });
  btn.disabled = false;
  if(updateError){
    setChangePwMsg('修改失敗：' + updateError.message, 'error');
    return;
  }

  setChangePwMsg('密碼修改成功！', 'success');
  setTimeout(closeChangePwModal, 1200);
}

/* ---------------- Data loading ---------------- */

async function loadAllData(){
  const { data: bookRows, error: bErr } = await db
    .from('books').select('*').order('created_at', { ascending: true });
  if(bErr){ console.error(bErr); books = []; } else { books = bookRows; }

  entriesByBook = {};
  if(books.length){
    const { data: entryRows, error: eErr } = await db
      .from('entries').select('*').order('date', { ascending: true });
    if(eErr){ console.error(eErr); }
    else{
      entryRows.forEach(r=>{
        if(!entriesByBook[r.book_id]) entriesByBook[r.book_id] = [];
        entriesByBook[r.book_id].push(r);
      });
    }
  }
  await loadBadges();
  await loadStreak();
  await loadMistakes();
}

function mistakeCardHTML(m){
  const mastered = isMastered(m);
  const color = PALETTE[Math.abs(hashStr(m.subject||'')) % PALETTE.length];
  let body = '';
  if(m.type !== 'fill'){
    const opts = m.options || [];
    body = `<div class="m-opts">${opts.map((opt,i)=>{
      const letter = OPTION_LABELS[i];
      const mine = letter === m.my_answer, correct = letter === m.correct_answer;
      let cls = 'm-opt' + (correct ? ' correct' : (mine ? ' wrong' : ''));
      return `<div class="${cls}"><span>${letter}.</span><span>${escapeHtml(opt)}</span>${correct?'<span class="tag">✓ 正確</span>':''}${mine&&!correct?'<span class="tag">✗ 我的答案</span>':''}</div>`;
    }).join('')}</div>`;
  }else{
    body = `<div class="m-fill-ans">
      <div><span class="label">我寫的答案</span><span class="wrong-v">${escapeHtml(m.my_answer||'')}</span></div>
      <div><span class="label">正確答案</span><span class="correct-v">${escapeHtml(m.correct_answer||'')}</span></div>
    </div>`;
  }
  return `
    <div class="mistake-card" style="--tab-color:${color}">
      <div class="m-meta">
        <span class="subject-tag">${escapeHtml(m.subject||'未分類')}</span>
        <span class="mastery-stamp ${mastered?'mastered':''}">${mastered?'✓ 已熟練':'尚未熟練'}</span>
      </div>
      <div class="m-question">${escapeHtml(m.question)}</div>
      ${body}
      <div class="m-actions">
        <span class="m-review-count">複習過 ${m.review_count||0} 次</span>
        <button type="button" class="m-del" data-id="${m.id}">刪除</button>
      </div>
    </div>
  `;
}

function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) | 0; } return h; }

function captureMistakeDraft(){
  mistakeFormDraft = mistakeFormDraft || {};
  const subjectEl = document.getElementById('mSubject');
  const questionEl = document.getElementById('mQuestion');
  if(subjectEl) mistakeFormDraft.subject = subjectEl.value;
  if(questionEl) mistakeFormDraft.question = questionEl.value;
  const opts = Array.from(document.querySelectorAll('.mOption')).map(i=>i.value);
  if(opts.length) mistakeFormDraft.options = opts;
  const myA = document.getElementById('mMyAnswer') || document.getElementById('mMyAnswerFill');
  const coA = document.getElementById('mCorrectAnswer') || document.getElementById('mCorrectAnswerFill');
  if(myA) mistakeFormDraft.myAnswer = myA.value;
  if(coA) mistakeFormDraft.correctAnswer = coA.value;
}
